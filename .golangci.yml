version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
  - copyloopvar
  - dupl
  - ginkgolinter
  - gocyclo
  - govet
  - ineffassign
  - misspell
  - nakedret
  - prealloc
  - staticcheck
  - unconvert
  - unparam
  - unused
  settings:
    revive:
      rules:
      - name: comment-spacings
      - name: import-shadowing
  exclusions:
    generated: lax
    rules:
    - linters:
      - lll
      path: api/*
    - linters:
      - dupl
      - lll
      path: internal/*
    paths:
    - third_party$
    - builtin$
    - examples$
    - web
    - opencode
formatters:
  enable:
  - gofmt
  - goimports
  exclusions:
    generated: lax
    paths:
    - third_party$
    - builtin$
    - examples$
