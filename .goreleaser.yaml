version: 2
project_name: agentz
builds:
- id: client
  main: ./cmd/agentz-client
  binary: agentz
  env:
  - CGO_ENABLED=0
  goos:
  - linux
  - darwin
  - windows
  goarch:
  - amd64
  - arm64
  ldflags:
  - -s -w -X main.version={{ .Version }}
archives:
- id: client
  ids:
  - client
  name_template: "agentz-cli_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  format_overrides:
  - goos: windows
    formats:
    - zip
checksum:
  name_template: agentz-cli-checksums.txt
changelog:
  use: github-native
release:
  header: |-
    Container images for linux/amd64 and linux/arm64:

    - `public.ecr.aws/k9v9d5v2/agentz:{{ .Tag }}`
    - `public.ecr.aws/k9v9d5v2/agentz/web:{{ .Tag }}`
    - `public.ecr.aws/k9v9d5v2/agentz/init:{{ .Tag }}`
    - `public.ecr.aws/k9v9d5v2/agentz/agent:{{ .Tag }}`
    - `public.ecr.aws/k9v9d5v2/agentz/agentgateway:{{ .Tag }}`
