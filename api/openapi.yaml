      - type: array
        items:
          $ref: '#/components/schemas/JSONValue'
      - type: object
        additionalProperties:
          $ref: '#/components/schemas/JSONValue'

    SecretKey:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9_]+$'
      description: Secret key name. Alphanumeric and underscores only.

    SecretValue:
      type: string
      maxLength: 49152
      description: Secret value. Max 48 KB.

    SecretHost:
      type: string
      minLength: 1
      maxLength: 253
      description: >
        Allowed request host. Use an exact hostname, wildcard hostname with a
        leading "*.", exact IPv4/IPv6 address, or IPv4/IPv6 CIDR range.
        Wildcards match any subdomain depth and do not match the apex domain.

    SecretEntry:
      type: object
      additionalProperties: false
      properties:
        key:
          $ref: '#/components/schemas/SecretKey'
        value:
          $ref: '#/components/schemas/SecretValue'
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/SecretHost'
          minItems: 1
          maxItems: 100
      required: [key, value, hosts]

    SecretListItem:
      type: object
      additionalProperties: false
      properties:
        key:
          $ref: '#/components/schemas/SecretKey'
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/SecretHost'
        created_at:
          type: string
          format: date-time
        modified_at:
          type: string
          format: date-time
      required: [key, hosts, created_at, modified_at]

    PutSecretsRequest:
      type: object
      additionalProperties: false
      properties:
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/SecretEntry'
          maxItems: 100
      required: [secrets]

    PutSecretsResponse:
      type: object
      additionalProperties: false
      properties:
        stored:
          type: integer
          format: int32
          minimum: 0
          description: Number of secrets stored.
      required: [stored]

    DeleteSecretsRequest:
