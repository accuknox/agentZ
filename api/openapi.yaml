openapi: 3.0.3
info:
  title: ClawArmor HTTP API
  version: 0.1.0
  description: HTTP API for ClawArmor agents, lens, secrets, and environments.
servers:
- url: /
  description: Current origin
tags:
- name: agents
  description: Agent lifecycle and status APIs.
- name: lens
  description: Trace, span, and OS observability APIs.
- name: secrets
  description: Session secret management APIs.
- name: environments
  description: Environment resource management APIs.

paths:
  /api/list-agents:
    get:
      operationId: listAgents
      summary: List paginated agent summaries.
      tags: [agents]
      parameters:
      - $ref: '#/components/parameters/AgentNameFilterQuery'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated agent summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAgentsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/list-traces:
    get:
      operationId: listTraces
      summary: List paginated trace summaries.
      tags: [lens]
      parameters:
      - $ref: '#/components/parameters/AgentNameQuery'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      - $ref: '#/components/parameters/StartedAfterQuery'
      - $ref: '#/components/parameters/StartedBeforeQuery'
      responses:
        '200':
          description: Paginated trace summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTracesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/list-trace-sessions:
    get:
      operationId: listTraceSessions
      summary: List paginated per-session trace summaries.
      tags: [lens]
      parameters:
      - $ref: '#/components/parameters/AgentNameQuery'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      - $ref: '#/components/parameters/StartedAfterQuery'
      - $ref: '#/components/parameters/StartedBeforeQuery'
      responses:
        '200':
          description: Paginated per-session trace summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTraceSessionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/list-spans:
    get:
      operationId: listSpans
      summary: List paginated spans for a trace.
      tags: [lens]
      parameters:
      - $ref: '#/components/parameters/AgentNameQuery'
      - $ref: '#/components/parameters/TraceIDQuery'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated spans for a trace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSpansResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/get-span-detail:
    get:
      operationId: getSpanDetail
      summary: Get span details and correlated OS observability.
      tags: [lens]
      parameters:
      - $ref: '#/components/parameters/AgentNameQuery'
      - $ref: '#/components/parameters/TraceIDQuery'
      - $ref: '#/components/parameters/SpanIDQuery'
      responses:
        '200':
          description: Span detail with payload and correlated events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpanDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/list-process-observability:
    get:
      operationId: listProcessObservability
      summary: List paginated process observability events.
      tags: [lens]
      parameters:
      - $ref: '#/components/parameters/AgentNameQuery'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      - $ref: '#/components/parameters/EventTimeAfterQuery'
      - $ref: '#/components/parameters/EventTimeBeforeQuery'
      - $ref: '#/components/parameters/ActionQuery'
      - $ref: '#/components/parameters/AggregatedQuery'
      responses:
        '200':
          description: Paginated process observability events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProcessObservabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/list-file-observability:
    get:
      operationId: listFileObservability
      summary: List paginated file observability events.
      tags: [lens]
      parameters:
      - $ref: '#/components/parameters/AgentNameQuery'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      - $ref: '#/components/parameters/EventTimeAfterQuery'
      - $ref: '#/components/parameters/EventTimeBeforeQuery'
      - $ref: '#/components/parameters/ActionQuery'
      - $ref: '#/components/parameters/AggregatedQuery'
      responses:
        '200':
          description: Paginated file observability events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFileObservabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/list-network-observability:
    get:
      operationId: listNetworkObservability
      summary: List paginated network observability events.
      tags: [lens]
      parameters:
      - $ref: '#/components/parameters/AgentNameQuery'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      - $ref: '#/components/parameters/EventTimeAfterQuery'
      - $ref: '#/components/parameters/EventTimeBeforeQuery'
      - $ref: '#/components/parameters/ActionQuery'
      - $ref: '#/components/parameters/AggregatedQuery'
      responses:
        '200':
          description: Paginated network observability events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListNetworkObservabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/create-agent:
    post:
      operationId: createAgent
      summary: Create an Agent resource.
      description: >
        Creates an agent record and Agent custom resource. The request returns
        after the Agent resource is created and does not wait for the Agent to
        become ready.
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        '201':
          description: Agent resource created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/delete-agent:
    post:
      operationId: deleteAgent
      summary: Delete an Agent resource.
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAgentRequest'
      responses:
        '204':
          description: Agent was deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/update-agent/{agentName}:
    post:
      operationId: updateAgent
      summary: Update an Agent resource.
      description: >
        Updates mutable Agent fields for an existing Agent. The agent name in
        the path identifies the Agent and is immutable.
      tags: [agents]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        '200':
          description: Agent resource updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/watch-agents:
    post:
      operationId: watchAgents
      summary: Watch agent status changes.
      description: >
        Returns an SSE stream. Each event data payload is a JSON object matching
        WatchAgentsEvent. If agent_names is omitted or empty, all known agents
        are watched.
      tags: [agents]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchAgentsRequest'
      responses:
        '200':
          description: Stream of agent status changes.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/WatchAgentsEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/secret/{agentName}/put:
    post:
      operationId: putSecret
      summary: Store or overwrite secrets for an agent.
      description: >
        Creates or overwrites key-value secrets under the agent. Each secret
        is bound to one or more hosts and is only injected for matching CONNECT
        destinations.
        Keys may contain alphanumeric characters and underscores, up to 128
        characters. Values are limited to 48 KB each. Hosts may be exact
        hostnames, wildcard hostnames with a leading "*.", exact IPv4/IPv6
        addresses, or IPv4/IPv6 CIDR ranges.
      tags: [secrets]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutSecretsRequest'
      responses:
        '201':
          description: Secrets stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutSecretsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/secret/{agentName}/delete:
    post:
      operationId: deleteSecret
      summary: Delete secrets for an agent.
      description: >
        Deletes the specified secret keys for the agent. Missing keys are
        ignored.
      tags: [secrets]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteSecretsRequest'
      responses:
        '204':
          description: Secrets deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/secret/{agentName}/list:
    get:
      operationId: listSecrets
      summary: List secret keys for an agent.
      description: >
        Returns a paginated list of secret keys with created and last modified
        timestamps. Secret values are never included in the response.
      tags: [secrets]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated secret keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSecretsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/environment/list:
    get:
      operationId: listEnvironments
      summary: List paginated Environment resources.
      tags: [environments]
      parameters:
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated environments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvironmentsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/environment/create:
    post:
      operationId: createEnvironment
      summary: Create an Environment resource.
      tags: [environments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnvironmentRequest'
      responses:
        '201':
          description: Environment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/environment/delete:
    post:
      operationId: deleteEnvironment
      summary: Delete an Environment resource.
      tags: [environments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteEnvironmentRequest'
      responses:
        '204':
          description: Environment deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/environment/update/{name}:
    post:
      operationId: updateEnvironment
      summary: Update an Environment resource.
      description: >
        Updates the packages list for an existing Environment. The name in the
        path identifies the Environment.
      tags: [environments]
      parameters:
      - $ref: '#/components/parameters/EnvironmentNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEnvironmentRequest'
      responses:
        '200':
          description: Environment updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    AgentNameQuery:
      name: agent_name
      in: query
      required: true
      description: Agent name.
      schema:
        $ref: '#/components/schemas/AgentName'

    AgentNamePath:
      name: agentName
      in: path
      required: true
      description: Agent name.
      schema:
        $ref: '#/components/schemas/AgentName'

    EnvironmentNamePath:
      name: name
      in: path
      required: true
      description: Environment name.
      schema:
        $ref: '#/components/schemas/EnvironmentName'

    AgentNameFilterQuery:
      name: agent_name
      in: query
      required: false
      description: Optional agent name filters. Repeat the query parameter for multiple agents.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/AgentName'

    LimitQuery:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50

    PageTokenQuery:
      name: page_token
      in: query
      required: false
      description: Opaque pagination token from a previous response.
      schema:
        type: string
        minLength: 1

    TraceIDQuery:
      name: trace_id
      in: query
      required: true
      description: Lowercase hexadecimal OTLP trace ID.
      schema:
        $ref: '#/components/schemas/TraceID'

    SpanIDQuery:
      name: span_id
      in: query
      required: true
      description: Lowercase hexadecimal OTLP span ID.
      schema:
        $ref: '#/components/schemas/SpanID'

    StartedAfterQuery:
      name: started_after
      in: query
      required: false
      description: Inclusive lower bound for trace start time.
      schema:
        type: string
        format: date-time

    StartedBeforeQuery:
      name: started_before
      in: query
      required: false
      description: Inclusive upper bound for trace start time.
      schema:
        type: string
        format: date-time

    EventTimeAfterQuery:
      name: event_time_after
      in: query
      required: false
      description: Inclusive lower bound for event time.
      schema:
        type: string
        format: date-time

    EventTimeBeforeQuery:
      name: event_time_before
      in: query
      required: false
      description: Inclusive upper bound for event time.
      schema:
        type: string
        format: date-time

    ActionQuery:
      name: action
      in: query
      required: false
      description: Optional observability action filter.
      schema:
        $ref: '#/components/schemas/ObservabilityAction'

    AggregatedQuery:
      name: aggregated
      in: query
      required: false
      description: When true, returns aggregated events with occurrence counts over the time range.
      schema:
        type: boolean
        default: false

  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Request conflicts with current agent state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    TraceID:
      type: string
      minLength: 32
      maxLength: 32
      pattern: '^[0-9a-f]{32}$'
      description: Lowercase hexadecimal OTLP trace ID.

    SpanID:
      type: string
      minLength: 16
      maxLength: 16
      pattern: '^[0-9a-f]{16}$'
      description: Lowercase hexadecimal OTLP span ID.

    OptionalSpanID:
      type: string
      maxLength: 16
      pattern: '^([0-9a-f]{16})?$'
      description: Lowercase hexadecimal OTLP span ID, or empty for root spans.

    ObservabilityAction:
      type: string
      enum: [Allowed, Blocked]

    AgentName:
      type: string
      minLength: 1
      maxLength: 32
      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'

    EnvironmentName:
      type: string
      minLength: 1
      maxLength: 32
      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      description: Environment resource name.

    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        details:
          $ref: '#/components/schemas/JSONValue'
      required: [code, message]

    FieldError:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
      required: [field, message]

    ListAgentsResponse:
      type: object
      additionalProperties: false
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
        next_page_token:
          type: string
      required: [agents, next_page_token]

    Agent:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/AgentName'
        last_activity:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        modified_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/AgentStatus'
      required: [name, last_activity, created_at, modified_at, status]

    AgentStatus:
      type: string
      enum:
      - UNSPECIFIED
      - PROGRESSING
      - DEGRADED
      - DELETED
      - IDLE

    CreateAgentRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/AgentName'
        env:
          type: object
          additionalProperties:
            type: string
        environmentName:
          $ref: '#/components/schemas/EnvironmentName'
      required: [name, environmentName]

    DeleteAgentRequest:
      type: object
      additionalProperties: false
      properties:
        agent_name:
          $ref: '#/components/schemas/AgentName'
      required: [agent_name]

    UpdateAgentRequest:
      type: object
      additionalProperties: false
      properties:
        env:
          type: object
          additionalProperties:
            type: string
        environmentName:
          $ref: '#/components/schemas/EnvironmentName'
      minProperties: 1

    ListTracesResponse:
      type: object
      additionalProperties: false
      properties:
        traces:
          type: array
          items:
            $ref: '#/components/schemas/Trace'
        next_page_token:
          type: string
      required: [traces, next_page_token]

    ListTraceSessionsResponse:
      type: object
      additionalProperties: false
      properties:
        trace_sessions:
          type: array
          items:
            $ref: '#/components/schemas/TraceSession'
        next_page_token:
          type: string
      required: [trace_sessions, next_page_token]

    Trace:
      type: object
      additionalProperties: false
      properties:
        trace_id:
          $ref: '#/components/schemas/TraceID'
        agent_name:
          $ref: '#/components/schemas/AgentName'
        root_span_id:
          $ref: '#/components/schemas/OptionalSpanID'
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        duration_ns:
          type: integer
          format: int64
          minimum: 0
        duration_ms:
          type: number
          format: double
          minimum: 0
        span_count:
          type: integer
          format: int64
          minimum: 0
        error_count:
          type: integer
          format: int64
          minimum: 0
        tool_count:
          type: integer
          format: int64
          minimum: 0
        model_count:
          type: integer
          format: int64
          minimum: 0
        input_tokens:
          type: integer
          format: int64
          minimum: 0
        output_tokens:
          type: integer
          format: int64
          minimum: 0
        cached_input_tokens:
          type: integer
          format: int64
          minimum: 0
        cached_write_tokens:
          type: integer
          format: int64
          minimum: 0
        cost_usd:
          type: number
          format: double
          minimum: 0
        status_code:
          type: string
        updated_at:
          type: string
          format: date-time
      required:
      - trace_id
      - agent_name
      - root_span_id
      - started_at
      - ended_at
      - duration_ns
      - duration_ms
      - span_count
      - error_count
      - tool_count
      - model_count
      - input_tokens
      - output_tokens
      - cached_input_tokens
      - cached_write_tokens
      - cost_usd
      - status_code
      - updated_at

    TraceSession:
      type: object
      additionalProperties: false
      properties:
        trace_id:
          $ref: '#/components/schemas/TraceID'
        session_id:
          type: string
        agent_name:
          $ref: '#/components/schemas/AgentName'
        root_span_id:
          $ref: '#/components/schemas/OptionalSpanID'
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        duration_ns:
          type: integer
          format: int64
          minimum: 0
        duration_ms:
          type: number
          format: double
          minimum: 0
        span_count:
          type: integer
          format: int64
          minimum: 0
        error_count:
          type: integer
          format: int64
          minimum: 0
        tool_count:
          type: integer
          format: int64
          minimum: 0
        model_count:
          type: integer
          format: int64
          minimum: 0
        input_tokens:
          type: integer
          format: int64
          minimum: 0
        output_tokens:
          type: integer
          format: int64
          minimum: 0
        cached_input_tokens:
          type: integer
          format: int64
          minimum: 0
        cached_write_tokens:
          type: integer
          format: int64
          minimum: 0
        cost_usd:
          type: number
          format: double
