openapi: 3.0.3
info:
  title: ClawArmor HTTP API
  version: 0.1.0
  description: HTTP API for ClawArmor agent sessions and status streams.
servers:
- url: /
  description: Current origin
tags:
- name: sessions
  description: Session history and interaction APIs.
- name: agents
  description: Agent listing and status streaming APIs.
- name: lens
  description: Trace, span, and OS observability APIs.
- name: secrets
  description: Session secret management APIs.
- name: environments
  description: Environment resource management APIs.

paths:
  /api/chat-history:
    get:
      operationId: getChatHistory
      summary: Get paginated session event history.
      tags: [sessions]
      parameters:
      - $ref: '#/components/parameters/SessionIDQuery'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated chat history for the session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatHistoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/list-agents:
    get:
      operationId: listAgents
      summary: List paginated agent summaries.
      tags: [agents]
      parameters:
      - $ref: '#/components/parameters/SessionIDFilterQuery'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated agent summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAgentsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/list-traces:
    get:
      operationId: listTraces
      summary: List paginated trace summaries.
      tags: [lens]
      parameters:
      - $ref: '#/components/parameters/SessionIDQuery'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      - $ref: '#/components/parameters/StartedAfterQuery'
      - $ref: '#/components/parameters/StartedBeforeQuery'
      responses:
        '200':
          description: Paginated trace summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTracesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/list-spans:
    get:
      operationId: listSpans
      summary: List paginated spans for a trace.
      tags: [lens]
      parameters:
      - $ref: '#/components/parameters/SessionIDQuery'
      - $ref: '#/components/parameters/TraceIDQuery'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated spans for a trace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSpansResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/get-span-detail:
    get:
      operationId: getSpanDetail
      summary: Get span details and correlated OS observability.
      tags: [lens]
      parameters:
      - $ref: '#/components/parameters/SessionIDQuery'
      - $ref: '#/components/parameters/TraceIDQuery'
      - $ref: '#/components/parameters/SpanIDQuery'
      responses:
        '200':
          description: Span detail with payload and correlated events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpanDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/list-process-observability:
    get:
      operationId: listProcessObservability
      summary: List paginated process observability events.
      tags: [lens]
      parameters:
      - $ref: '#/components/parameters/SessionIDQuery'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      - $ref: '#/components/parameters/EventTimeAfterQuery'
      - $ref: '#/components/parameters/EventTimeBeforeQuery'
      - $ref: '#/components/parameters/ActionQuery'
      - $ref: '#/components/parameters/AggregatedQuery'
      responses:
        '200':
          description: Paginated process observability events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProcessObservabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/list-file-observability:
    get:
      operationId: listFileObservability
      summary: List paginated file observability events.
      tags: [lens]
      parameters:
      - $ref: '#/components/parameters/SessionIDQuery'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      - $ref: '#/components/parameters/EventTimeAfterQuery'
      - $ref: '#/components/parameters/EventTimeBeforeQuery'
      - $ref: '#/components/parameters/ActionQuery'
      - $ref: '#/components/parameters/AggregatedQuery'
      responses:
        '200':
          description: Paginated file observability events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFileObservabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/list-network-observability:
    get:
      operationId: listNetworkObservability
      summary: List paginated network observability events.
      tags: [lens]
      parameters:
      - $ref: '#/components/parameters/SessionIDQuery'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      - $ref: '#/components/parameters/EventTimeAfterQuery'
      - $ref: '#/components/parameters/EventTimeBeforeQuery'
      - $ref: '#/components/parameters/ActionQuery'
      - $ref: '#/components/parameters/AggregatedQuery'
      responses:
        '200':
          description: Paginated network observability events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListNetworkObservabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/create-agent:
    post:
      operationId: createAgent
      summary: Create a session-backed Agent.
      description: >
        Creates a session row and Agent custom resource. The request returns
        after the Agent resource is created and does not wait for the Agent to
        become ready.
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        '201':
          description: Agent resource created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/delete-agent:
    post:
      operationId: deleteAgent
      summary: Delete a session-backed Agent.
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAgentRequest'
      responses:
        '204':
          description: Agent and session were deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/update-agent/{sessionID}:
    post:
      operationId: updateAgent
      summary: Update a session-backed Agent.
      description: >
        Updates mutable Agent configuration for an existing session. The
        session ID in the path identifies the Agent; Agent name is immutable
        and is not accepted in the request body.
      tags: [agents]
      parameters:
      - $ref: '#/components/parameters/SessionIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        '200':
          description: Agent resource updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/send-message:
    post:
      operationId: sendMessage
      summary: Send a user prompt to a session agent.
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: Message accepted and run started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/subscribe-session:
    post:
      operationId: subscribeSession
      summary: Subscribe to live events for a session.
      description: >
        Returns an SSE stream. Each event data payload is a JSON object matching
        SessionStreamEvent.
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscribeSessionRequest'
      responses:
        '200':
          description: Stream of session run events.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SessionStreamEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/interrupt-session:
    post:
      operationId: interruptSession
      summary: Interrupt the active run for a session.
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionActionRequest'
      responses:
        '200':
          description: Interrupt result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterruptSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/compact-session:
    post:
      operationId: compactSession
      summary: Compact the current session history.
      tags: [sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionActionRequest'
      responses:
        '200':
          description: Compaction result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompactSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/FailedPrecondition'
        '503':
          $ref: '#/components/responses/Unavailable'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/watch-agents:
    post:
      operationId: watchAgents
      summary: Watch agent status changes.
      description: >
        Returns an SSE stream. Each event data payload is a JSON object matching
        WatchAgentsEvent. If session_ids is omitted or empty, all known agents
        are watched.
      tags: [agents]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchAgentsRequest'
      responses:
        '200':
          description: Stream of agent status changes.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/WatchAgentsEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/secret/{sessionID}/put:
    post:
      operationId: putSecret
      summary: Store or overwrite secrets for a session.
      description: >
        Creates or overwrites key-value secrets under the session. Each secret
        is bound to one or more hosts and is only injected for matching CONNECT
        destinations.
        Keys may contain alphanumeric characters and underscores, up to 128
        characters. Values are limited to 48 KB each. Hosts may be exact
        hostnames, wildcard hostnames with a leading "*.", exact IPv4/IPv6
        addresses, or IPv4/IPv6 CIDR ranges.
      tags: [secrets]
      parameters:
      - $ref: '#/components/parameters/SessionIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutSecretsRequest'
      responses:
        '201':
          description: Secrets stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutSecretsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/secret/{sessionID}/delete:
    post:
      operationId: deleteSecret
      summary: Delete secrets for a session.
      description: >
        Deletes the specified secret keys for the session. Missing keys are
        ignored.
      tags: [secrets]
      parameters:
      - $ref: '#/components/parameters/SessionIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteSecretsRequest'
      responses:
        '204':
          description: Secrets deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/secret/{sessionID}/list:
    get:
      operationId: listSecrets
      summary: List secret keys for a session.
      description: >
        Returns a paginated list of secret keys with created and last modified
        timestamps. Secret values are never included in the response.
      tags: [secrets]
      parameters:
      - $ref: '#/components/parameters/SessionIDPath'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated secret keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSecretsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/environment/list:
    get:
      operationId: listEnvironments
      summary: List paginated Environment resources.
      tags: [environments]
      parameters:
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated environments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvironmentsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/environment/create:
    post:
      operationId: createEnvironment
      summary: Create an Environment resource.
      tags: [environments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnvironmentRequest'
      responses:
        '201':
          description: Environment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/environment/delete:
    post:
      operationId: deleteEnvironment
      summary: Delete an Environment resource.
      tags: [environments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteEnvironmentRequest'
      responses:
        '204':
          description: Environment deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/environment/update/{name}:
    post:
      operationId: updateEnvironment
      summary: Update an Environment resource.
      description: >
        Updates the packages list for an existing Environment. The name in the
        path identifies the Environment.
      tags: [environments]
      parameters:
      - $ref: '#/components/parameters/EnvironmentNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEnvironmentRequest'
      responses:
        '200':
          description: Environment updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    SessionIDQuery:
      name: session_id
      in: query
      required: true
      description: Session UUID.
      schema:
        $ref: '#/components/schemas/SessionID'

    SessionIDPath:
      name: sessionID
      in: path
      required: true
      description: Session UUID.
      schema:
        $ref: '#/components/schemas/SessionID'

    EnvironmentNamePath:
      name: name
      in: path
      required: true
      description: Environment name.
      schema:
        $ref: '#/components/schemas/EnvironmentName'

    SessionIDFilterQuery:
      name: session_id
      in: query
      required: false
      description: Optional session UUID filters. Repeat the query parameter for multiple sessions.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/SessionID'

    LimitQuery:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50

    PageTokenQuery:
      name: page_token
      in: query
      required: false
      description: Opaque pagination token from a previous response.
      schema:
        type: string
        minLength: 1

    TraceIDQuery:
      name: trace_id
      in: query
      required: true
      description: Lowercase hexadecimal OTLP trace ID.
      schema:
        $ref: '#/components/schemas/TraceID'

    SpanIDQuery:
      name: span_id
      in: query
      required: true
      description: Lowercase hexadecimal OTLP span ID.
      schema:
        $ref: '#/components/schemas/SpanID'

    StartedAfterQuery:
      name: started_after
      in: query
      required: false
      description: Inclusive lower bound for trace start time.
      schema:
        type: string
        format: date-time

    StartedBeforeQuery:
      name: started_before
      in: query
      required: false
      description: Inclusive upper bound for trace start time.
      schema:
        type: string
        format: date-time

    EventTimeAfterQuery:
      name: event_time_after
      in: query
      required: false
      description: Inclusive lower bound for event time.
      schema:
        type: string
        format: date-time

    EventTimeBeforeQuery:
      name: event_time_before
      in: query
      required: false
      description: Inclusive upper bound for event time.
      schema:
        type: string
        format: date-time

    ActionQuery:
      name: action
      in: query
      required: false
      description: Optional observability action filter.
      schema:
        $ref: '#/components/schemas/ObservabilityAction'

    AggregatedQuery:
      name: aggregated
      in: query
      required: false
      description: When true, returns aggregated events with occurrence counts over the time range.
      schema:
        type: boolean
        default: false

  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Request conflicts with current session state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    FailedPrecondition:
      description: The session is not in the required state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: A required backend is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    SessionID:
      type: string
      format: uuid
      description: ClawArmor session UUID.

    SessionIDInput:
      type: string
      format: uuid
      x-go-type: string
      minLength: 1
      description: ClawArmor session UUID.

    RunID:
      type: string
      format: uuid
      description: Agent run UUID.

    RequestID:
      type: string
      format: uuid
      description: Agent request UUID.

    TraceID:
      type: string
      minLength: 32
      maxLength: 32
      pattern: '^[0-9a-f]{32}$'
      description: Lowercase hexadecimal OTLP trace ID.

    SpanID:
      type: string
      minLength: 16
      maxLength: 16
      pattern: '^[0-9a-f]{16}$'
      description: Lowercase hexadecimal OTLP span ID.

    OptionalSpanID:
      type: string
      maxLength: 16
      pattern: '^([0-9a-f]{16})?$'
      description: Lowercase hexadecimal OTLP span ID, or empty for root spans.

    ObservabilityAction:
      type: string
      enum: [Allowed, Blocked]

    AgentName:
      type: string
      minLength: 1
      maxLength: 32
      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'

    EnvironmentName:
      type: string
      minLength: 1
      maxLength: 32
      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      description: Environment resource name.

    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        details:
          $ref: '#/components/schemas/JSONValue'
      required: [code, message]

    FieldError:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
      required: [field, message]

    ChatHistoryResponse:
      type: object
      additionalProperties: false
      properties:
        session_id:
          $ref: '#/components/schemas/SessionID'
        events:
          type: array
          items:
            $ref: '#/components/schemas/StoredSessionEvent'
        next_page_token:
          type: string
      required: [session_id, events, next_page_token]

    StoredSessionEvent:
      type: object
      additionalProperties: false
      properties:
        seq:
          type: integer
          format: int64
          minimum: 1
        event_id:
          type: string
          minLength: 1
        event_ts:
          type: string
          format: date-time
        payload:
          $ref: '#/components/schemas/TrpcAgentEventPayload'
      required: [seq, event_id, event_ts, payload]

    ListAgentsResponse:
      type: object
      additionalProperties: false
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/ListAgent'
        next_page_token:
          type: string
      required: [agents, next_page_token]

    ListAgent:
      allOf:
      - $ref: '#/components/schemas/Agent'
      - type: object
        additionalProperties: false
        properties:
          configuration:
            $ref: '#/components/schemas/AgentConfiguration'
        required: [configuration]

    Agent:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/AgentName'
        session_id:
          $ref: '#/components/schemas/SessionID'
        last_activity:
          type: string
