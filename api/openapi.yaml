        is_partial:
          type: boolean
      required: [invocationId, author, id, timestamp]

    EventActions:
      type: object
      additionalProperties: false
      properties:
        skipSummarization:
          type: boolean

    ModelObjectType:
      type: string
      enum:
      - error
      - tool.response
      - preprocessing.basic
      - preprocessing.content
      - preprocessing.identity
      - preprocessing.instruction
      - preprocessing.planning
      - postprocessing.planning
      - postprocessing.code_execution
      - agent.transfer
      - runner.completion
      - state.update
      - chat.completion.chunk
      - chat.completion

    Choice:
      type: object
      additionalProperties: false
      properties:
        index:
          type: integer
          format: int32
          minimum: 0
        message:
          $ref: '#/components/schemas/ModelMessage'
        delta:
          $ref: '#/components/schemas/ModelMessage'
        finish_reason:
          type: string
          nullable: true
      required: [index]

    ModelMessage:
      type: object
      additionalProperties: false
      properties:
        role:
          $ref: '#/components/schemas/MessageRole'
        content:
          type: string
        content_parts:
          type: array
          items:
            $ref: '#/components/schemas/ContentPart'
        tool_id:
          type: string
        tool_name:
          type: string
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
        reasoning_content:
          type: string
      required: [role]

    MessageRole:
      type: string
      enum: [system, user, assistant, tool]

    ContentPart:
      oneOf:
      - $ref: '#/components/schemas/TextContentPart'
      - $ref: '#/components/schemas/ImageContentPart'
      - $ref: '#/components/schemas/AudioContentPart'
      - $ref: '#/components/schemas/FileContentPart'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/TextContentPart'
          image: '#/components/schemas/ImageContentPart'
          audio: '#/components/schemas/AudioContentPart'
          file: '#/components/schemas/FileContentPart'

    TextContentPart:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [text]
        text:
          type: string
      required: [type, text]

    ImageContentPart:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [image]
        image:
          $ref: '#/components/schemas/Image'
      required: [type, image]

    AudioContentPart:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [audio]
        audio:
          $ref: '#/components/schemas/Audio'
      required: [type, audio]

    FileContentPart:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [file]
        file:
          $ref: '#/components/schemas/File'
      required: [type, file]

    Image:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
        data:
          type: string
          format: byte
        detail:
          $ref: '#/components/schemas/ImageDetail'
        format:
          type: string
          enum: [png, jpg, jpeg, webp, gif]

    ImageDetail:
      type: string
      enum: [low, high, auto]

    Audio:
      type: object
      additionalProperties: false
      properties:
        data:
          type: string
          format: byte
        format:
          type: string
          enum: [wav, mp3]
      required: [data, format]

    File:
      type: object
      additionalProperties: false
      properties:
        filename:
          type: string
        data:
          type: string
          format: byte
        file_id:
          type: string
        format:
          type: string
          description: MIME type for file data.

    ToolCall:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [function]
        function:
          $ref: '#/components/schemas/FunctionDefinitionParam'
        id:
          type: string
        index:
          type: integer
          format: int32
          minimum: 0
          nullable: true
        extra_fields:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/JSONValue'
      required: [type]

    FunctionDefinitionParam:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
        strict:
          type: boolean
        description:
          type: string
        arguments:
          type: string
          description: JSON-encoded function arguments.
      required: [name]

    Usage:
      type: object
      additionalProperties: false
      properties:
        prompt_tokens:
          type: integer
          format: int32
          minimum: 0
        completion_tokens:
          type: integer
          format: int32
          minimum: 0
        total_tokens:
          type: integer
          format: int32
          minimum: 0
        prompt_tokens_details:
          $ref: '#/components/schemas/PromptTokensDetails'
        timing_info:
          $ref: '#/components/schemas/TimingInfo'
      required:
      - prompt_tokens
      - completion_tokens
      - total_tokens
      - prompt_tokens_details

    PromptTokensDetails:
      type: object
      additionalProperties: false
      properties:
        cached_tokens:
          type: integer
          format: int32
          minimum: 0
        cache_creation_tokens:
          type: integer
          format: int32
          minimum: 0
        cache_read_tokens:
          type: integer
          format: int32
          minimum: 0
      required: [cached_tokens]

    TimingInfo:
      type: object
      additionalProperties: false
      properties:
        time_to_first_token:
          type: integer
          format: int64
          minimum: 0
          description: Go time.Duration encoded as nanoseconds.
        reasoning_duration:
          type: integer
          format: int64
          minimum: 0
          description: Go time.Duration encoded as nanoseconds.

    ModelResponseError:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
        type:
          type: string
          enum: [stream_error, api_error, flow_error, run_error]
        param:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
      required: [message, type]

    JSONValue:
      oneOf:
      - type: boolean
      - type: number
      - type: string
      - type: array
        items:
          $ref: '#/components/schemas/JSONValue'
      - type: object
        additionalProperties:
          $ref: '#/components/schemas/JSONValue'

    SecretKey:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9_]+$'
      description: Secret key name. Alphanumeric and underscores only.

    SecretValue:
      type: string
      maxLength: 49152
      description: Secret value. Max 48 KB.

    SecretHost:
      type: string
      minLength: 1
      maxLength: 253
      description: >
        Allowed request host. Use an exact hostname, wildcard hostname with a
        leading "*.", exact IPv4/IPv6 address, or IPv4/IPv6 CIDR range.
        Wildcards match any subdomain depth and do not match the apex domain.

    SecretEntry:
      type: object
      additionalProperties: false
      properties:
        key:
          $ref: '#/components/schemas/SecretKey'
        value:
          $ref: '#/components/schemas/SecretValue'
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/SecretHost'
          minItems: 1
          maxItems: 100
      required: [key, value, hosts]

    SecretListItem:
      type: object
      additionalProperties: false
      properties:
        key:
          $ref: '#/components/schemas/SecretKey'
        hosts:
          type: array
          items:
            $ref: '#/components/schemas/SecretHost'
        created_at:
          type: string
          format: date-time
        modified_at:
          type: string
          format: date-time
      required: [key, hosts, created_at, modified_at]

    PutSecretsRequest:
      type: object
      additionalProperties: false
      properties:
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/SecretEntry'
          maxItems: 100
      required: [secrets]

    PutSecretsResponse:
      type: object
      additionalProperties: false
      properties:
        stored:
          type: integer
          format: int32
          minimum: 0
          description: Number of secrets stored.
      required: [stored]

    DeleteSecretsRequest:
      type: object
      additionalProperties: false
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/SecretKey'
          maxItems: 100
      required: [keys]

    ListSecretsResponse:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SecretListItem'
        next_page_token:
          type: string
      required: [items, next_page_token]

    Environment:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/EnvironmentName'
        packages:
          type: array
          items:
            type: string
            minLength: 1
        allowed_hosts:
          type: array
          items:
            type: string
            minLength: 1
        created_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: false
          properties:
            package_count:
              type: integer
              format: int32
              minimum: 0
            allowed_host_count:
              type: integer
              format: int32
              minimum: 0
            referenced_by_agent:
              type: boolean
          required: [package_count, allowed_host_count, referenced_by_agent]
      required: [name, packages, allowed_hosts, created_at, metadata]

    ListEnvironmentsResponse:
      type: object
      additionalProperties: false
      properties:
        environments:
          type: array
          items:
            $ref: '#/components/schemas/Environment'
        next_page_token:
          type: string
      required: [environments, next_page_token]

    CreateEnvironmentRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/EnvironmentName'
        packages:
          type: array
          items:
            type: string
            minLength: 1
        allowed_hosts:
          type: array
          items:
            type: string
            minLength: 1
      required: [name]

    DeleteEnvironmentRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/EnvironmentName'
      required: [name]

    UpdateEnvironmentRequest:
      type: object
      additionalProperties: false
      properties:
        packages:
          type: array
          items:
            type: string
            minLength: 1
        allowed_hosts:
          type: array
          items:
            type: string
            minLength: 1
      required: [packages, allowed_hosts]
