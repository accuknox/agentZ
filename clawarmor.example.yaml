# ClawArmor agent runtime configuration.
#
# This file is intentionally verbose and heavily commented so it can be used
# as both an example and a reference. Empty-string values usually mean
# "disabled" or "use the provider default" unless noted otherwise.

server:
  # TCP address for the agent gRPC server.
  # Use localhost for local-only access, or 0.0.0.0 to listen on every
  # network interface.
  address: localhost:8080

  # Maximum graceful shutdown period for the agent gRPC server.
  # Use Go duration syntax, for example: 15s, 2m.
  # 0s means wait indefinitely for graceful shutdown.
  gracefulShutdownTimeout: 15s

agent:
  # High-level task guidance for the agent.
  # This is the main behavioral instruction appended to the agent prompt.
  # Leave empty to rely only on systemPrompt and the built-in defaults.
  instruction: ""

  # Global system prompt applied to every turn.
  # Use this for hard rules, role framing, and non-negotiable constraints.
  systemPrompt: ""

  # When true, inject the latest persisted session summary into the model
  # context before the incremental raw history.
  # This reduces prompt size for long conversations.
  addSessionSummary: true

  # When true, enable SDK-native context compaction logic.
  # This lets the framework try summary-backed prompt rebuilding before the
  # main LLM call when the prompt is getting too large.
  enableContextCompaction: true

  # Fraction of the model context window at which pre-turn compaction becomes
  # eligible. Must be between 0 and 1.
  # Example: 0.7 means "attempt summary-backed compaction once the prompt is
  # estimated to exceed 70% of the model window".
  contextCompactionThresholdRatio: 0.7

  # Historical tool results larger than this fraction of the model context
  # window are replaced with a compact placeholder during request construction.
  # Must be between 0 and 1. Set to 0 to disable this specific pass.
  # Example: 0.008 means "compact historical tool results once they exceed
  # about 0.8% of the model context window".
  contextCompactionToolResultMaxRatio: 0.008

  # Number of most-recent completed requests to keep in full when historical
  # tool-result compaction is enabled.
  # 0 means no recent requests are specially protected.
  contextCompactionKeepRecentRequests: 1

  # Any tool result larger than this fraction of the model context window is
  # truncated with head+tail preservation before being sent to the main model.
  # This applies even to current-request tool outputs and acts as a hard
  # safety net against giant tool payloads. Must be between 0 and 1.
  # Set to 0 to disable oversized tool-result truncation.
  # Example: 0.064 means "truncate tool results once they exceed about
  # 6.4% of the model context window".
  contextCompactionOversizedToolResultMaxRatio: 0.064

  # Raw-history fallback when addSessionSummary is false.
  # 0 means unlimited raw history.
  # When addSessionSummary is true, the summary path is preferred and this
  # value matters much less.
  maxHistoryRuns: 50

model:
  # Primary chat/completion model used for the main agent turn execution.
  name: gpt-5.4-mini

  # API key for the primary model provider.
  apiKey: ""

  # Base URL for OpenAI-compatible providers.
  # Leave empty for the provider's default endpoint.
  baseURL: ""

  # Explicit model context window in tokens.
  # Set this when the SDK does not know the model name, such as private,
  # self-hosted, or newly released models.
  # If omitted for an unknown model, ClawArmor blocks chatting instead of
  # sending turns to the LLM with an unsafe guessed window.
  contextWindow: 0

  # Sampling temperature for the primary model.
  # Lower values are more deterministic. 0 typically means "provider default"
  # in this config layer because the field is omitted from the request.
  temperature: 0.2

  # Max completion/output tokens for the primary model.
  # 0 means omit the limit and let the provider/model choose.
  maxTokens: 0

  # Stream model responses to the REPL/output when true.
  # Set false for fully buffered responses.
  stream: true

summaryModel:
  # Separate model used only for session summarization.
  # This is useful because summarization incurs cost and may be cheaper on a
  # smaller model than the main conversation model.
  # If empty, ClawArmor falls back to model.name.
  name: gpt-5.4-nano

  # API key for the summarizer model.
  # If empty, ClawArmor falls back to model.apiKey.
  apiKey: ""

  # Base URL for the summarizer model.
  # If empty and summaryModel.name or summaryModel.apiKey is set, the provider
  # default is used. If the summary model is not overridden, model.baseURL is
  # reused with the primary model settings.
  baseURL: ""

  # Explicit summarizer model context window in tokens.
  # This matters most when session.summary.mode is auto, because automatic
  # summary thresholding depends on a known context window for the active
  # summarizer model.
  # If omitted and the summarizer model is unknown, ClawArmor blocks chatting
  # until you configure the window.
  contextWindow: 0

  # Sampling temperature for summary generation.
  # Lower is generally better for stable summaries.
  # If 0, ClawArmor falls back to model.temperature.
  temperature: 0.2

  # Max output tokens for summaries.
  # Keep this smaller than the main model unless you want unusually long
  # summaries. If 0, ClawArmor falls back to model.maxTokens.
  maxTokens: 2500

memory:
  # Enable the in-process memory service.
  # This is separate from session summaries:
  # - session summaries compress a single conversation thread
  # - memory stores durable facts across turns/sessions
  enabled: true

  # Maximum number of memory entries retained.
  # 0 means "use the backend default / no explicit limit".
  limit: 0

  tools:
    # Expose the memory search tool to the agent.
    # This is typically the safest memory tool to leave enabled.
    search: true

    # Expose a direct memory load/list style tool to the agent.
    # Disabled by default to reduce prompt/tool misuse risk.
    load: false

    # Allow the agent to add new memory items.
    add: false

    # Allow the agent to modify existing memory items.
    update: false

    # Allow the agent to delete individual memory items.
    delete: false

    # Allow the agent to clear all stored memory.
    # This is destructive and should usually remain false.
    clear: false

session:
  # When true, use the external gRPC session service for persisted sessions.
  # When false, use an in-memory local session service.
  enabled: false

  # gRPC target for the external session service.
  # Only used when session.enabled is true.
  target: localhost:8081

  # Use insecure gRPC transport when true.
  # Current ClawArmor session client expects this to be true because TLS is not
  # implemented there yet.
  insecure: true

  # Timeout in milliseconds for session-service RPCs.
  timeoutMs: 5000

  # Session UUID to attach the agent to when using the external session
  # service. Required when session.enabled is true.
  sessionID: ""

  summary:
    # Master switch for summary generation and summary persistence.
    # If false, no session summaries are produced or updated.
    enabled: true

    # Summary trigger mode.
    # Supported values:
    # - auto: context-window aware summarization threshold
    # - manual: use the explicit thresholds below
    mode: auto

    # Manual-mode event-count threshold.
    # Summarize when more than this many new events exist since the previous
    # summary. 0 disables this threshold.
    eventThreshold: 20

    # Manual-mode token-count threshold on the delta conversation text.
    # 0 disables this threshold.
    tokenThreshold: 0

    # Manual-mode idle-time threshold since the last event.
    # Use Go duration syntax, for example: 30s, 5m, 1h.
    # 0s disables this threshold.
    idleThreshold: 0s

    # Best-effort maximum summary word count.
    # This is guidance to the summarizer model, not a post-generation hard cut.
    # 0 means "no explicit word cap".
    maxWords: 200

    # Approximate runes-per-token hint for summary threshold estimation.
    # 0 uses the framework default heuristic.
    # Lower values can improve threshold estimation for languages where the
    # default heuristic underestimates token usage.
    approxRunesPerToken: 0

tools:
  hostExec:
    # Enable local shell command execution tools.
    # This is powerful and unsafe if the prompt or model behavior is not well
    # constrained.
    enabled: true

    # Working-directory root exposed to host execution tools.
    # Commands should be constrained to this directory tree.
    baseDir: "."

    # Extra environment variables injected into host execution commands.
    # Keys and values are passed through as plain strings.
    baseEnv: {}

  webFetch:
    # Enable HTTP fetch tooling for the agent.
    enabled: true

    # Timeout per fetch request in milliseconds.
    timeoutMs: 30000

    # Maximum bytes allowed for a single fetched response body.
    # 0 means no explicit cap at this config layer.
    maxContentLength: 0

    # Maximum bytes allowed across all fetched response bodies in one tool call.
    # 0 means no explicit cap at this config layer.
    maxTotalContentLength: 0

  file:
    # Enable local filesystem tools.
    enabled: false

    # Root directory exposed to file tools.
    # Restrict this to the minimum directory the agent needs.
    baseDir: "."

  arxiv:
    # Enable the arXiv search tool.
    enabled: false

    # Override arXiv API base URL.
    # Leave empty to use the library default.
    baseURL: ""

    # Number of results per arXiv request.
    pageSize: 10

    # Delay between arXiv API requests in milliseconds.
    # Useful when rate-limiting or being gentle to upstream.
    delayMs: 0

    # Number of retries for transient arXiv request failures.
    numRetries: 2

  # List of OpenAPI-backed toolsets.
  # Each item creates a namespaced toolset from an OpenAPI document.
  openAPI: []
  # - enabled: true
  #   # Human-readable toolset name. Also used for namespacing tool names.
  #   name: petstore
  #   # Local OpenAPI spec file path. Use either specFile or specUrl.
  #   specFile: ./openapi/petstore.yaml
  #   # Remote OpenAPI spec URL. Leave empty when using specFile.
  #   specUrl: ""

  # List of MCP toolset connections.
  # Each item attaches one MCP server as a toolset.
  mcp: []
  # - enabled: true
  #   # Human-readable MCP toolset name.
  #   name: playwright
  #   # Transport type. Typical values depend on the MCP toolset factory.
  #   # Examples: stdio, sse, streamable_http.
  #   transport: stdio
  #   # Remote server URL for network transports.
  #   # Leave empty for stdio-based servers.
  #   serverUrl: ""
  #   # Executable used to start a stdio MCP server.
  #   command: npx
  #   # Command-line arguments for the MCP server process.
  #   args: ["@playwright/mcp@latest"]
  #   # Extra HTTP headers for network MCP transports.
  #   headers: {}
  #   # Connection or request timeout in milliseconds.
  #   timeoutMs: 30000
  #   # Whether to reconnect automatically on disconnect.
  #   reconnect: true
  #   # Maximum number of reconnect attempts when reconnect is true.
  #   reconnectMaxAttempts: 3
