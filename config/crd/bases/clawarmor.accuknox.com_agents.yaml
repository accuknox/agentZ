---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: agents.clawarmor.accuknox.com
spec:
  group: clawarmor.accuknox.com
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    shortNames:
    - agent
    singular: agent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Whether the Agent is ready
      jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - description: Agent session identifier
      jsonPath: .spec.session.id
      name: Session
      type: string
    - description: Service exposing the Agent API
      jsonPath: .status.serviceName
      name: Service
      type: string
    - description: Age of the Agent
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Agent is the Schema for the agents API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Agent.
            properties:
              agent:
                description: Agent defines identity and prompt settings for the runtime.
                properties:
                  addSessionSummary:
                    description: AddSessionSummary injects the latest persisted summary
                      into context.
                    type: boolean
                  contextCompactionKeepRecentRequests:
                    description: ContextCompactionKeepRecentRequests preserves recent
                      requests in full.
                    minimum: 0
                    type: integer
                  contextCompactionOversizedToolResultMaxRatio:
                    description: ContextCompactionOversizedToolResultMaxRatio truncates
                      large results.
                    maximum: 1
                    minimum: 0
                    type: number
                  contextCompactionThresholdRatio:
                    description: ContextCompactionThresholdRatio triggers compaction
                      by context ratio.
                    maximum: 1
                    minimum: 0
                    type: number
                  contextCompactionToolResultMaxRatio:
                    description: ContextCompactionToolResultMaxRatio compacts old
                      tool results.
                    maximum: 1
                    minimum: 0
                    type: number
                  enableContextCompaction:
                    description: EnableContextCompaction enables summary-backed context
                      compaction.
                    type: boolean
                  instruction:
                    description: Instruction is high-level task guidance appended
                      to the prompt.
                    type: string
                  maxHistoryRuns:
                    description: MaxHistoryRuns caps raw history when summaries are
                      not used.
                    minimum: 0
                    type: integer
                  systemPrompt:
                    description: SystemPrompt is global instruction applied to every
                      turn.
                    type: string
                type: object
              image:
                description: Image is the container image used for the Agent runtime.
                type: string
              imagePullPolicy:
                default: IfNotPresent
                description: ImagePullPolicy defines when Kubernetes pulls the Agent
                  image.
                type: string
              memory:
                description: Memory configures in-process memory and memory tools.
                properties:
                  enabled:
                    description: Enabled turns on in-process memory.
                    type: boolean
                  limit:
                    description: Limit caps retained memory entries.
                    minimum: 0
                    type: integer
                  tools:
                    description: Tools controls memory tool exposure.
                    properties:
                      add:
                        description: Add exposes memory creation.
                        type: boolean
                      clear:
                        description: Clear exposes memory clearing.
                        type: boolean
                      delete:
                        description: Delete exposes memory deletion.
                        type: boolean
                      load:
                        description: Load exposes memory loading.
                        type: boolean
                      search:
                        description: Search exposes memory search.
                        type: boolean
                      update:
                        description: Update exposes memory updates.
                        type: boolean
                    type: object
                type: object
              model:
                description: Model defines the primary chat model.
                properties:
                  baseURL:
                    description: BaseURL is an optional OpenAI-compatible provider
                      URL.
                    type: string
                  contextWindow:
                    description: ContextWindow is an explicit model context window.
                    minimum: 0
                    type: integer
                  maxTokens:
                    description: MaxTokens caps model output tokens.
                    minimum: 0
                    type: integer
                  name:
                    description: Name is the primary model identifier.
                    type: string
                  stream:
                    description: Stream enables streamed model responses.
                    type: boolean
                  temperature:
                    description: Temperature configures model sampling.
                    type: number
                required:
                - name
                type: object
              resources:
                description: Resources defines compute resources allocated to the
                  Agent pod.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              server:
                description: Server defines the agent gRPC server settings.
                properties:
                  address:
                    description: Address is the TCP listen address for the agent server.
                    type: string
                  gracefulShutdownTimeout:
                    description: GracefulShutdownTimeout is the maximum graceful shutdown
                      period.
                    type: string
                required:
                - address
                type: object
              session:
                description: Session configures persisted session behavior.
                properties:
                  enabled:
                    description: Enabled uses the external gRPC session service when
                      true.
                    type: boolean
                  id:
                    description: ID is the immutable UUIDv4 session identifier.
                    type: string
                  insecure:
                    description: Insecure uses insecure gRPC transport.
                    type: boolean
                  summary:
                    description: Summary defines session summarization behavior.
                    properties:
                      approxRunesPerToken:
                        description: ApproxRunesPerToken hints token estimation.
                        minimum: 0
                        type: number
                      enabled:
                        description: Enabled turns session summary generation on or
                          off.
                        type: boolean
                      eventThreshold:
                        description: EventThreshold summarizes after this many events
                          in manual mode.
                        minimum: 0
                        type: integer
                      idleThreshold:
                        description: IdleThreshold summarizes after this idle duration
                          in manual mode.
                        type: string
                      maxWords:
                        description: MaxWords is best-effort guidance for summary
                          length.
                        minimum: 0
                        type: integer
                      mode:
                        description: Mode selects auto or manual summary thresholds.
                        enum:
                        - auto
                        - manual
                        type: string
                      tokenThreshold:
                        description: TokenThreshold summarizes after this many tokens
                          in manual mode.
                        minimum: 0
                        type: integer
                    type: object
                  target:
                    description: Target is the external session service gRPC target.
                    type: string
                  timeoutMs:
                    description: TimeoutMs is the external session RPC timeout in
                      milliseconds.
                    minimum: 0
                    type: integer
                required:
                - id
                type: object
              summaryModel:
                description: SummaryModel defines the model used for session summarization.
                properties:
                  baseURL:
                    description: BaseURL is an optional OpenAI-compatible provider
                      URL.
                    type: string
                  contextWindow:
                    description: ContextWindow is an explicit summarizer model context
                      window.
                    minimum: 0
                    type: integer
                  maxTokens:
                    description: MaxTokens caps summarization output tokens.
                    minimum: 0
                    type: integer
                  name:
                    description: Name is the summarization model identifier.
                    type: string
                  temperature:
                    description: Temperature configures summarization sampling.
                    type: number
                type: object
              telemetry:
                description: Telemetry configures agent observability export.
                properties:
                  enabled:
                    description: Enabled turns on OpenTelemetry trace export.
                    type: boolean
                  traceEndpoint:
                    description: TraceEndpoint is the OTLP/gRPC trace endpoint in
                      host:port form.
                    type: string
                type: object
              tools:
                description: Tools configures optional runtime tools.
                properties:
                  arxiv:
                    description: Arxiv configures arXiv search tools.
                    properties:
                      baseURL:
                        description: BaseURL is the arXiv API base URL.
                        type: string
                      delayMs:
                        description: DelayMS delays arXiv retry/page requests.
                        minimum: 0
                        type: integer
                      enabled:
                        description: Enabled turns arXiv search on.
                        type: boolean
                      numRetries:
                        description: NumRetries caps arXiv retries.
                        minimum: 0
                        type: integer
                      pageSize:
                        description: PageSize controls arXiv result page size.
                        minimum: 0
                        type: integer
                    type: object
                  file:
                    description: File configures filesystem tools.
                    properties:
                      baseDir:
                        description: BaseDir is the filesystem root exposed to file
                          tools.
                        type: string
                      enabled:
                        description: Enabled turns file tools on.
                        type: boolean
                    type: object
                  hostExec:
                    description: HostExec configures host command execution tools.
                    properties:
                      baseDir:
                        description: BaseDir is the working-directory root for commands.
                        type: string
                      baseEnv:
                        additionalProperties:
                          type: string
                        description: BaseEnv is extra environment for commands.
                        type: object
                      enabled:
                        description: Enabled turns host execution tools on.
                        type: boolean
                    type: object
                  mcp:
                    description: MCP configures MCP toolsets.
                    items:
                      description: MCPConfig defines one MCP toolset connection.
                      properties:
                        args:
                          description: Args are local MCP server command arguments.
                          items:
                            type: string
                          type: array
                        command:
                          description: Command is the local MCP server command.
                          type: string
                        enabled:
                          description: Enabled turns this MCP connection on.
                          type: boolean
                        headers:
                          additionalProperties:
                            type: string
                          description: Headers are remote MCP request headers.
                          type: object
                        name:
                          description: Name is the MCP toolset name.
                          type: string
                        reconnect:
                          description: Reconnect enables MCP reconnect attempts.
                          type: boolean
                        reconnectMaxAttempts:
                          description: ReconnectMaxAttempt caps MCP reconnect attempts.
                          minimum: 0
                          type: integer
                        serverUrl:
                          description: ServerURL is the remote MCP server URL.
                          type: string
                        timeoutMs:
                          description: TimeoutMs is the MCP request timeout.
                          minimum: 0
                          type: integer
                        transport:
                          description: Transport selects the MCP transport.
                          type: string
                      type: object
                    type: array
                  openAPI:
                    description: OpenAPI configures OpenAPI-backed toolsets.
                    items:
                      description: OpenAPIConfig defines one OpenAPI-backed toolset
                        entry.
                      properties:
                        enabled:
                          description: Enabled turns this OpenAPI toolset on.
                          type: boolean
                        name:
                          description: Name is the toolset name.
                          type: string
                        specFile:
                          description: SpecFile is a local OpenAPI specification path.
                          type: string
                        specUrl:
                          description: SpecURL is a remote OpenAPI specification URL.
                          type: string
                      type: object
                    type: array
                  webFetch:
                    description: WebFetch configures HTTP fetch tools.
                    properties:
                      enabled:
                        description: Enabled turns web fetch tools on.
                        type: boolean
                      maxContentLength:
                        description: MaxContentLength caps one fetched response.
                        minimum: 0
                        type: integer
                      maxTotalContentLength:
                        description: MaxTotalContentLength caps all fetched responses
                          per tool call.
                        minimum: 0
                        type: integer
                      timeoutMs:
                        description: TimeoutMs is the per-request fetch timeout.
                        minimum: 0
                        type: integer
                    type: object
                type: object
            required:
            - model
            - server
            - session
            type: object
          status:
            description: status defines the observed state of Agent.
            properties:
              conditions:
                description: Conditions represent the current state of the Agent resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              configMapName:
                description: ConfigMapName is the ConfigMap mounted into the Agent
                  pod.
                type: string
              observedGeneration:
                description: ObservedGeneration is the latest reconciled generation.
                format: int64
                type: integer
              observedSessionID:
                description: ObservedSessionID is the session id applied by the controller.
                type: string
              serviceName:
                description: ServiceName is the service exposing the Agent API.
                type: string
              url:
                description: URL is the in-cluster URL of the Agent API service.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
