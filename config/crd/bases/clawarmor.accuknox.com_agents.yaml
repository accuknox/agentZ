apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: agents.clawarmor.accuknox.com
spec:
  group: clawarmor.accuknox.com
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    shortNames:
    - agent
    singular: agent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Whether the Agent is ready
      jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - description: Agent session identifier
      jsonPath: .spec.session.id
      name: Session
      type: string
    - description: Service exposing the Agent API
      jsonPath: .status.serviceName
      name: Service
      type: string
    - description: Age of the Agent
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Agent is the Schema for the agents API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Agent.
            properties:
              compaction:
                description: Compaction configures prompt rebuilding and tool-result trimming.
                properties:
                  enabled:
                    description: |-
                      Enabled lets the runtime rebuild large prompts through summaries before
                      the main model call.
                    type: boolean
                  historyToolResultRatio:
                    default: 0.008
                    description: |-
                      HistoryToolResultRatio replaces older tool results above this context
                      window fraction with compact placeholders during request construction.
                    maximum: 1
                    minimum: 0
                    type: number
                  keepRecentRequests:
                    default: 2
                    description: |-
                      KeepRecentRequests preserves the latest completed requests in full when
                      historical tool-result compaction is enabled.
                    minimum: 0
                    type: integer
                  mode:
                    default: summary
                    description: Mode selects summary-backed compaction or raw-history truncation.
                    enum:
                    - summary
                    - truncate
                    type: string
                  oversizedToolResultRatio:
                    default: 0.065
                    description: |-
                      OversizedToolResultRatio truncates any tool result above this context
                      window fraction with head and tail preservation.
                    maximum: 0.1
                    minimum: 0.05
                    type: number
                  thresholdRatio:
                    default: 0.9
                    description: |-
                      ThresholdRatio is the model context-window fraction that makes pre-turn
                      summary-backed compaction eligible.
                    maximum: 0.95
                    minimum: 0.2
                    type: number
                type: object
              env:
                description: Env defines environment variables injected into the Agent pod.
                items:
                  description: EnvVar represents an environment variable present in a Container.
                  properties:
                    name:
                      description: |-
                        Name of the environment variable.
                        May consist of any printable ASCII characters except '='.
                      type: string
                    value:
                      description: |-
                        Variable references $(VAR_NAME) are expanded
                        using the previously defined environment variables in the container and
                        any service environment variables. If a variable cannot be resolved,
                        the reference in the input string will be unchanged. Double $$ are reduced
                        to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                        "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                        Escaped references will never be expanded, regardless of whether the variable
                        exists or not.
                        Defaults to "".
                      type: string
                    valueFrom:
                      description: Source for the environment variable's value. Cannot be used if value is not empty.
                      properties:
                        configMapKeyRef:
                          description: Selects a key of a ConfigMap.
                          properties:
                            key:
                              description: The key to select.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the ConfigMap or its key must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        fieldRef:
                          description: |-
                            Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                            spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                          properties:
                            apiVersion:
                              description: Version of the schema the FieldPath is written in terms of, defaults to "v1".
                              type: string
                            fieldPath:
                              description: Path of the field to select in the specified API version.
                              type: string
                          required:
                          - fieldPath
                          type: object
                          x-kubernetes-map-type: atomic
                        fileKeyRef:
                          description: |-
                            FileKeyRef selects a key of the env file.
                            Requires the EnvFiles feature gate to be enabled.
                          properties:
                            key:
                              description: |-
                                The key within the env file. An invalid key will prevent the pod from starting.
                                The keys defined within a source may consist of any printable ASCII characters except '='.
                                During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                              type: string
                            optional:
                              default: false
                              description: |-
                                Specify whether the file or its key must be defined. If the file or key
                                does not exist, then the env var is not published.
                                If optional is set to true and the specified key does not exist,
                                the environment variable will not be set in the Pod's containers.

                                If optional is set to false and the specified key does not exist,
                                an error will be returned during Pod creation.
                              type: boolean
                            path:
                              description: |-
                                The path within the volume from which to select the file.
                                Must be relative and may not contain the '..' path or start with '..'.
                              type: string
                            volumeName:
                              description: The name of the volume mount containing the env file.
                              type: string
                          required:
                          - key
                          - path
                          - volumeName
                          type: object
                          x-kubernetes-map-type: atomic
                        resourceFieldRef:
                          description: |-
                            Selects a resource of the container: only resources limits and requests
                            (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                          properties:
                            containerName:
                              description: 'Container name: required for volumes, optional for env vars'
                              type: string
                            divisor:
                              anyOf:
                              - type: integer
                              - type: string
                              description: Specifies the output format of the exposed resources, defaults to "1"
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            resource:
                              description: 'Required: resource to select'
                              type: string
                          required:
                          - resource
                          type: object
                          x-kubernetes-map-type: atomic
                        secretKeyRef:
                          description: Selects a key of a secret in the pod's namespace
                          properties:
                            key:
                              description: The key of the secret to select from.  Must be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - name
                  type: object
                type: array
              image:
                description: Image is the container image used for the Agent runtime.
                type: string
              imagePullPolicy:
                default: IfNotPresent
                description: ImagePullPolicy defines when Kubernetes pulls the Agent image.
                type: string
              instruction:
                description: Instruction is the main behavioral guidance appended to the prompt.
                type: string
              maxHistoryRuns:
                default: 50
                description: MaxHistoryRuns caps raw history in truncate compaction mode.
                minimum: 0
                type: integer
              memory:
                description: Memory configures in-process memory and memory tools.
                properties:
                  enabled:
                    description: Enabled turns on in-process memory.
                    type: boolean
                  limit:
                    description: Limit caps retained memory entries.
                    minimum: 0
                    type: integer
                  tools:
                    description: Tools controls memory tool exposure.
                    properties:
                      add:
                        description: Add exposes memory creation.
                        type: boolean
                      clear:
                        description: Clear exposes memory clearing.
                        type: boolean
                      delete:
                        description: Delete exposes memory deletion.
                        type: boolean
                      load:
                        description: Load exposes memory loading.
                        type: boolean
                      search:
                        description: Search exposes memory search.
                        type: boolean
                      update:
                        description: Update exposes memory updates.
                        type: boolean
                    type: object
                type: object
              model:
                description: Model defines the primary chat model.
                properties:
                  baseURL:
                    description: BaseURL is an optional OpenAI-compatible provider URL.
                    type: string
                  contextWindow:
                    description: ContextWindow is an explicit model context window.
                    minimum: 0
                    type: integer
                  maxTokens:
                    description: MaxTokens caps model output tokens.
                    minimum: 0
                    type: integer
                  name:
                    description: Name is the primary model identifier.
                    type: string
                  stream:
                    description: Stream enables streamed model responses.
                    type: boolean
                  temperature:
                    default: 0.2
                    description: Temperature configures model sampling.
                    maximum: 1
                    minimum: 0
                    type: number
                  thinkingEnabled:
                    description: |-
                      ThinkingEnabled requests native thinking mode for providers that expose
                      it through OpenAI-compatible APIs.
                    type: boolean
                  thinkingTokens:
                    description: |-
                      ThinkingTokens requests the provider's thinking token budget when
                      thinking mode is enabled.
                    minimum: 0
                    type: integer
                required:
                - name
                type: object
              resources:
                description: Resources defines compute resources allocated to the Agent pod.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              server:
                description: Server defines the agent gRPC server settings.
                properties:
                  address:
                    description: Address is the TCP listen address for the agent server.
                    type: string
                  gracefulShutdownTimeout:
                    description: GracefulShutdownTimeout is the maximum graceful shutdown period.
                    type: string
                required:
                - address
                type: object
              session:
                description: Session configures persisted session behavior.
                properties:
                  enabled:
                    description: Enabled uses the external gRPC session service when true.
                    type: boolean
                  id:
                    description: ID is the immutable UUIDv4 session identifier.
                    type: string
                  insecure:
                    description: Insecure uses insecure gRPC transport.
                    type: boolean
                  summary:
                    description: Summary defines session summarization behavior.
                    properties:
                      approxRunesPerToken:
                        description: ApproxRunesPerToken hints token estimation.
                        minimum: 0
                        type: number
                      enabled:
                        description: Enabled turns session summary generation on or off.
                        type: boolean
                      eventThreshold:
                        description: EventThreshold summarizes after this many events in manual mode.
                        minimum: 0
                        type: integer
                      idleThreshold:
                        description: IdleThreshold summarizes after this idle duration in manual mode.
                        type: string
                      maxWords:
                        description: MaxWords is best-effort guidance for summary length.
                        minimum: 0
                        type: integer
                      mode:
                        description: Mode selects auto or manual summary thresholds.
                        enum:
                        - auto
                        - manual
                        type: string
                      tokenThreshold:
                        description: TokenThreshold summarizes after this many tokens in manual mode.
                        minimum: 0
                        type: integer
                    type: object
                  target:
                    description: Target is the external session service gRPC target.
                    type: string
                  timeoutMs:
                    description: TimeoutMs is the external session RPC timeout in milliseconds.
                    minimum: 0
                    type: integer
                required:
                - id
                type: object
              summaryModel:
                description: SummaryModel defines the model used for session summarization.
                properties:
                  baseURL:
                    description: BaseURL is an optional OpenAI-compatible provider URL.
                    type: string
                  contextWindow:
                    description: ContextWindow is an explicit summarizer model context window.
                    minimum: 0
                    type: integer
                  maxTokens:
                    description: MaxTokens caps summarization output tokens.
                    minimum: 0
                    type: integer
                  name:
                    description: Name is the summarization model identifier.
                    type: string
                  temperature:
                    default: 0.2
                    description: Temperature configures summarization sampling.
                    maximum: 1
                    minimum: 0
                    type: number
                type: object
              systemPrompt:
                description: SystemPrompt defines hard rules and role framing for every turn.
                maxLength: 4096
                type: string
              telemetry:
                description: Telemetry configures agent observability export.
                properties:
                  enabled:
                    description: Enabled turns on OpenTelemetry trace export.
                    type: boolean
                  traceEndpoint:
                    description: TraceEndpoint is the OTLP/gRPC trace endpoint in host:port form.
                    type: string
                type: object
              tools:
                description: Tools configures optional runtime tools.
                properties:
                  arxiv:
                    description: Arxiv configures arXiv search tools.
                    properties:
                      baseURL:
                        description: BaseURL is the arXiv API base URL.
                        type: string
                      delayMs:
                        description: DelayMS delays arXiv retry/page requests.
                        minimum: 0
                        type: integer
                      enabled:
                        default: false
                        description: Enabled turns arXiv search on.
                        type: boolean
                      numRetries:
                        description: NumRetries caps arXiv retries.
                        minimum: 0
                        type: integer
                      pageSize:
                        description: PageSize controls arXiv result page size.
                        minimum: 0
                        type: integer
                    type: object
                  file:
                    description: File configures filesystem tools.
                    properties:
                      baseDir:
                        description: BaseDir is the filesystem root exposed to file tools.
                        type: string
                      enabled:
                        default: false
                        description: Enabled turns file tools on.
                        type: boolean
                    type: object
                  hostExec:
                    description: HostExec configures host command execution tools.
                    properties:
                      baseDir:
                        description: BaseDir is the working-directory root for commands.
                        type: string
                      baseEnv:
                        additionalProperties:
                          type: string
                        description: BaseEnv is extra environment for commands.
                        type: object
                      enabled:
                        default: true
                        description: Enabled turns host execution tools on.
                        type: boolean
                    type: object
                  mcp:
                    description: MCP configures MCP toolsets.
                    items:
                      description: MCPConfig defines one MCP toolset connection.
                      properties:
                        args:
                          description: Args are local MCP server command arguments.
                          items:
                            type: string
                          type: array
                        command:
                          description: Command is the local MCP server command.
                          type: string
                        enabled:
                          description: Enabled turns this MCP connection on.
                          type: boolean
                        headers:
                          additionalProperties:
                            type: string
                          description: Headers are remote MCP request headers.
                          type: object
                        name:
                          description: Name is the MCP toolset name.
                          type: string
                        reconnect:
                          description: Reconnect enables MCP reconnect attempts.
                          type: boolean
                        reconnectMaxAttempts:
                          description: ReconnectMaxAttempt caps MCP reconnect attempts.
                          minimum: 0
                          type: integer
                        serverUrl:
                          description: ServerURL is the remote MCP server URL.
                          type: string
                        timeoutMs:
                          description: TimeoutMs is the MCP request timeout.
                          minimum: 0
                          type: integer
                        transport:
                          description: Transport selects the MCP transport.
                          type: string
                      type: object
                    type: array
                  openAPI:
                    description: OpenAPI configures OpenAPI-backed toolsets.
                    items:
                      description: OpenAPIConfig defines one OpenAPI-backed toolset entry.
                      properties:
                        enabled:
                          description: Enabled turns this OpenAPI toolset on.
                          type: boolean
                        name:
                          description: Name is the toolset name.
                          type: string
                        specFile:
                          description: SpecFile is a local OpenAPI specification path.
                          type: string
                        specUrl:
                          description: SpecURL is a remote OpenAPI specification URL.
                          type: string
                      type: object
                    type: array
                  webFetch:
                    description: WebFetch configures HTTP fetch tools.
                    properties:
                      enabled:
                        default: true
                        description: Enabled turns web fetch tools on.
                        type: boolean
                      maxContentLength:
                        description: MaxContentLength caps one fetched response.
                        minimum: 0
                        type: integer
                      maxTotalContentLength:
                        description: MaxTotalContentLength caps all fetched responses per tool call.
                        minimum: 0
                        type: integer
                      timeoutMs:
                        description: TimeoutMs is the per-request fetch timeout.
                        minimum: 0
                        type: integer
                    type: object
                type: object
            required:
            - model
            - server
            - session
            type: object
          status:
            description: status defines the observed state of Agent.
            properties:
              conditions:
                description: Conditions represent the current state of the Agent resource.
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              configMapName:
                description: ConfigMapName is the ConfigMap mounted into the Agent pod.
                type: string
              observedGeneration:
                description: ObservedGeneration is the latest reconciled generation.
                format: int64
                type: integer
              observedSessionID:
                description: ObservedSessionID is the session id applied by the controller.
                type: string
              serviceName:
                description: ServiceName is the service exposing the Agent API.
                type: string
              url:
                description: URL is the in-cluster URL of the Agent API service.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
