apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "gateway.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "gateway.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-web-jwks
          image: "{{ .Values.waitImage.repository }}:{{ .Values.waitImage.tag }}"
          imagePullPolicy: {{ .Values.waitImage.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              until wget -q -O /dev/null {{ .Values.config.externalJWTJWKSURL | quote }}; do
                sleep 2
              done
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/agentz"]
          args:
            - gateway
            - serve
            - --log-level={{ .Values.config.logLevel }}
            - --log-format={{ .Values.config.logFormat }}
            - "--addr=0.0.0.0:{{ .Values.service.port }}"
            - --namespace={{ .Values.config.namespace }}
            - --postgres-dsn={{ required "gateway.config.postgresDSN is required" .Values.config.postgresDSN }}
            - --external-jwt-jwks-url={{ required "gateway.config.externalJWTJWKSURL is required" .Values.config.externalJWTJWKSURL }}
            - --external-jwt-issuer={{ required "gateway.config.externalJWTIssuer is required" .Values.config.externalJWTIssuer }}
            - --external-jwt-audience={{ required "gateway.config.externalJWTAudience is required" .Values.config.externalJWTAudience }}
            - --internal-k8s-token-audience={{ required "gateway.config.internalK8sTokenAudience is required" .Values.config.internalK8sTokenAudience }}
            - --agent-trace-endpoint={{ required "gateway.config.agentTraceEndpoint is required" .Values.config.agentTraceEndpoint }}
            - --openbao-addr={{ .Values.config.openBaoAddr }}
            - --openbao-secret-mount-path={{ .Values.config.openBaoSecretMountPath }}
            - --openbao-k8s-auth-role={{ .Values.config.openBaoK8sAuthRole }}
            - --openbao-k8s-auth-mount-path={{ .Values.config.openBaoK8sAuthMountPath }}
            - --openbao-k8s-auth-token-path={{ .Values.config.openBaoK8sAuthTokenPath }}
            - --mcp-probe-stale-after={{ .Values.config.mcpProbeStaleAfter }}
            - --skills-s3-endpoint={{ required "gateway.config.skillsS3Endpoint is required" .Values.config.skillsS3Endpoint }}
            - --skills-s3-region={{ required "gateway.config.skillsS3Region is required" .Values.config.skillsS3Region }}
            - --skills-s3-bucket={{ required "gateway.config.skillsS3Bucket is required" .Values.config.skillsS3Bucket }}
            {{- if .Values.config.logWithSource }}
            - --log-with-source
            {{- end }}
            {{- if .Values.config.targetOverride }}
            - --target-override={{ .Values.config.targetOverride }}
            {{- end }}
            {{- if .Values.config.filesystemTargetOverride }}
            - --filesystem-target-override={{ .Values.config.filesystemTargetOverride }}
            {{- end }}
            {{- if .Values.config.agentImage }}
            - --agent-image={{ .Values.config.agentImage }}
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: AGENTZ_SKILLS_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ required "gateway.config.skillsS3AccessKeyIDSecretName is required" .Values.config.skillsS3AccessKeyIDSecretName }}
                  key: {{ required "gateway.config.skillsS3AccessKeyIDSecretKey is required" .Values.config.skillsS3AccessKeyIDSecretKey }}
            - name: AGENTZ_SKILLS_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "gateway.config.skillsS3SecretAccessKeySecretName is required" .Values.config.skillsS3SecretAccessKeySecretName }}
                  key: {{ required "gateway.config.skillsS3SecretAccessKeySecretKey is required" .Values.config.skillsS3SecretAccessKeySecretKey }}
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
