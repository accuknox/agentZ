{{- if and .Values.enabled .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gateway.fullname" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["agentz.accuknox.com"]
    resources: ["agents", "sandboxes", "inferencepools", "inferenceproviders", "mcpconnections", "secrets", "workflowruns"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["agentz.accuknox.com"]
    resources: ["tenants"]
    verbs: ["create", "get", "list"]
  - apiGroups: ["agentz.accuknox.com"]
    resources: ["workspaces"]
    verbs: ["create", "delete", "get", "update"]
  {{- if (dig "agentz" "delegationEnabled" false (.Values.global | default dict)) }}
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [agentgateway.dev]
    resources: [agentgatewaybackends, agentgatewaypolicies]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, update, patch]
  {{- end }}
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gateway.fullname" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gateway.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gateway.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if (dig "agentz" "delegationEnabled" false (.Values.global | default dict)) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: delegation-ca
  namespace: {{ printf "%s-delegations" (include "gateway.fullname" .) | trunc 63 | trimSuffix "-" }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [delegation-gateway-tls]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: delegation-ca
  namespace: {{ printf "%s-delegations" (include "gateway.fullname" .) | trunc 63 | trimSuffix "-" }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: delegation-ca
subjects:
  - kind: ServiceAccount
    name: {{ include "gateway.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
