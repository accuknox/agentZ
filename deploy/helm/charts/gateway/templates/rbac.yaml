{{- if and .Values.enabled .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gateway.fullname" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
rules:
  {{- if .Values.compute.enabled }}
  - apiGroups: ["agentz.accuknox.com"]
    resources: ["inferenceproviders", "workspaces", "skills", "tenants"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["watch"]
  - apiGroups: ["agentz.accuknox.com"]
    resources: ["agents/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["sinjector"]
    verbs: ["get"]
  {{- end }}
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["agentz.accuknox.com"]
    resources: ["agents", "sandboxes", "inferencepools", "mcpconnections", "secrets", "workflowruns"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["agentz.accuknox.com"]
    resources: ["tenants"]
    verbs: ["create", "get", "list"]
  - apiGroups: ["agentz.accuknox.com"]
    resources: ["workspaces"]
    verbs: ["create", "delete", "get", "update"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gateway.fullname" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gateway.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "gateway.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
