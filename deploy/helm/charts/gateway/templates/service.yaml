{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "gateway.selectorLabels" . | nindent 4 }}
{{- if (dig "agentz" "delegationEnabled" false (.Values.global | default dict)) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gateway.fullname" . }}-authority
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
    - name: authority
      port: 18085
      targetPort: authority
      protocol: TCP
  selector:
    {{- include "gateway.selectorLabels" . | nindent 4 }}
{{- end }}
{{- end }}
