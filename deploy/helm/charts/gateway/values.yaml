global:
  agentz:
    delegationEnabled: true
    copilotStudioEnabled: false
  # Operator-managed application credentials in the release namespace.
  secretName: agentz

enabled: true

nameOverride: ""
fullnameOverride: ""

replicaCount: 1
revisionHistoryLimit: 10
terminationGracePeriodSeconds: 30

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

image:
  repository: public.ecr.aws/k9v9d5v2/agentz
  # tag defaults to v<chart appVersion>. digest takes precedence.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

# waitImage supplies the init container that waits for the web JWKS endpoint.
waitImage:
  repository: busybox
  tag: "1.37.0"
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: true

rbac:
  create: true

podAnnotations: {}
podLabels: {}

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

waitContainerSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

service:
  type: ClusterIP
  port: 8090

waitForJWKS:
  # timeoutSeconds bounds how long startup waits for the JWKS endpoint.
  timeoutSeconds: 300

config:
  # Share the Coding GitHub App and encryption key with the web account flow.
  # global.secretName must contain CODING_GITHUB_CLIENT_SECRET and
  # CODING_GITHUB_ENCRYPTION_KEY, encoded as 64 lowercase hex characters.
  codingGithubClientID: ""
  logLevel: info
  logFormat: text
  logWithSource: false
  # externalJWTJWKSURL is required for standalone installs. Umbrella installs
  # default to the bundled web Service.
  externalJWTJWKSURL: ""
  # externalJWTIssuer is the public Better Auth URL.
  externalJWTIssuer: ""
  externalJWTAudience: agentz-gateway
  internalK8sTokenAudience: agentz-gateway
  # allowedWebOrigins lists the browser origins that may call the gateway.
  # Wildcards are rejected.
  allowedWebOrigins: []
  targetOverride: ""
  # filesystemTargetOverride can point to a local port-forward. Leave empty
  # to use each agent's Kubernetes Service on port 4097.
  filesystemTargetOverride: ""
  # agentImage is the default image for gateway-created Agent resources.
  agentImage: public.ecr.aws/k9v9d5v2/agentz/agent:v0.36.0
  # agentTraceEndpoint is the OTLP/gRPC destination exposed to agents.
  # Umbrella installs default to the bundled observer Service.
  agentTraceEndpoint: ""
  openBaoAddr: http://openbao.openbao.svc.cluster.local:8200
  openBaoSecretMountPath: kv
  openBaoK8sAuthRole: gateway
  openBaoK8sAuthMountPath: kubernetes
  openBaoK8sAuthTokenPath: /var/run/secrets/kubernetes.io/serviceaccount/token
  # mcpProbeStaleAfter is the age at which MCP probe results become stale.
  mcpProbeStaleAfter: 5m
  # Provider resource application. Configure v2 access tokens and the idtyp claim in Entra.
  copilotStudioAudience: ""
  # Public HTTPS gateway origin used for Copilot Studio webhook callbacks.
  copilotStudioBaseURL: ""
  # skillsS3Endpoint and skillsS3Bucket are required for standalone installs.
  # Umbrella installs default to the platform's shared Skill object store.
  skillsS3Endpoint: ""
  skillsS3Region: us-east-1
  skillsS3Bucket: ""

# extraArgs are appended to the gateway command.
extraArgs: []
