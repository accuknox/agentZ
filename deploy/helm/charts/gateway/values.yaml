global:
  # Operator-managed application credentials in the release namespace.
  secretName: agentz

enabled: true

nameOverride: ""
fullnameOverride: ""

replicaCount: 1
revisionHistoryLimit: 10
terminationGracePeriodSeconds: 30

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

image:
  repository: public.ecr.aws/k9v9d5v2/agentz
  tag: latest
  digest: ""
  pullPolicy: IfNotPresent

evaluator:
  image:
    repository: public.ecr.aws/k9v9d5v2/agentz/evaluator
    tag: latest
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

waitImage:
  repository: busybox
  tag: "1.37.0"
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: true

rbac:
  create: true

podAnnotations: {}
podLabels: {}

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

waitContainerSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

service:
  type: ClusterIP
  port: 8090

waitForJWKS:
  timeoutSeconds: 300

config:
  # Share the Coding GitHub App and encryption key with the web account flow.
  # global.secretName must contain CODING_GITHUB_CLIENT_SECRET and
  # CODING_GITHUB_ENCRYPTION_KEY, encoded as 64 lowercase hex characters.
  codingGithubClientID: ""
  logLevel: info
  logFormat: text
  logWithSource: false
  externalJWTJWKSURL: ""
  externalJWTIssuer: ""
  externalJWTAudience: agentz-gateway
  internalK8sTokenAudience: agentz-gateway
  allowedWebOrigins: []
  targetOverride: ""
  filesystemTargetOverride: ""
  agentImage: ""
  agentTraceEndpoint: ""
  openBaoAddr: http://openbao.openbao.svc.cluster.local:8200
  openBaoSecretMountPath: kv
  openBaoK8sAuthRole: gateway
  openBaoK8sAuthMountPath: kubernetes
  openBaoK8sAuthTokenPath: /var/run/secrets/kubernetes.io/serviceaccount/token
  mcpProbeStaleAfter: 5m
  skillsS3Endpoint: ""
  skillsS3Region: us-east-1
  skillsS3Bucket: ""

extraArgs: []
