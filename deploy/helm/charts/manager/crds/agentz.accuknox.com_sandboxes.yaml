    controller-gen.kubebuilder.io/version: v0.16.5
  name: sandboxes.agentz.accuknox.com
spec:
  group: agentz.accuknox.com
  names:
    kind: Sandbox
    listKind: SandboxList
    plural: sandboxes
    singular: sandbox
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Number of nix packages
      jsonPath: .status.packageCount
      name: Packages
      type: integer
    - description: Number of allowed hosts
      jsonPath: .status.allowedHostCount
      name: Allowed Hosts
      type: integer
    - description: Number of MCP connection references
      jsonPath: .status.mcpRefCount
      name: MCPs
      type: integer
    - description: Age of the Sandbox
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Sandbox is the Schema for the sandboxes API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Sandbox
            properties:
              allowedHosts:
                description: |-
                  AllowedHosts lists exact domains, leading wildcard domains with "*."
                  or "**.", and IPv4/IPv6 CIDRs the referencing Agent pods may reach.
                items:
                  type: string
                type: array
              mcpConnectionRefs:
                description: |-
                  MCPConnectionRefs lists external MCP connections exposed in this
                  sandbox in order.
                items:
                  description: MCPConnectionRef references one MCPConnection in the
                    same namespace.
                  properties:
                    name:
                      description: Name is the local name of the referenced MCPConnection.
                      type: string
                    tools:
                      description: |-
                        Tools lists the upstream MCP tools exposed through this sandbox
                        for the referenced connection.
                      items:
