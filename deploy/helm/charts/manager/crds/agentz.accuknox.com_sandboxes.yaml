                  configured.
                type: integer
              packageCount:
                description: PackageCount is the number of nix packages configured.
                type: integer
            required:
            - allowedHostCount
            - mcpRefCount
            - packageCount
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
