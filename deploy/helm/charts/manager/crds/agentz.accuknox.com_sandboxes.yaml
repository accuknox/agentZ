---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: sandboxes.agentz.accuknox.com
spec:
  group: agentz.accuknox.com
  names:
    kind: Sandbox
    listKind: SandboxList
    plural: sandboxes
    singular: sandbox
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Number of nix packages
      jsonPath: .status.packageCount
      name: Packages
      type: integer
    - description: Number of allowed hosts
      jsonPath: .status.allowedHostCount
      name: Allowed Hosts
      type: integer
    - description: Number of MCP connection references
      jsonPath: .status.mcpRefCount
      name: MCPs
      type: integer
    - description: Number of allowed inference models
      jsonPath: .status.modelCount
      name: Models
      type: integer
    - description: Age of the Sandbox
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Sandbox is the Schema for the sandboxes API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Sandbox
            properties:
              allowedHosts:
                description: |-
                  AllowedHosts lists exact domains, leading wildcard domains with "*."
                  or "**.", and IPv4/IPv6 CIDRs the referencing Agent pods may reach.
                items:
                  type: string
                type: array
              createdByUserID:
                description: CreatedByUserID is the immutable Better Auth User ID
                  that created the resource.
                maxLength: 128
                minLength: 1
                type: string
              inference:
                description: Inference defines the model policy inherited by referencing
                  Agents.
                properties:
                  attachmentModel:
                    description: AttachmentModel is the optional model used to inspect
                      visual files.
                    properties:
                      model:
                        description: Model is the exact upstream model identifier.
                        maxLength: 512
                        minLength: 1
                        type: string
                      provider:
                        description: Provider is the immutable InferenceProvider metadata
                          name.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                      scope:
                        description: Scope selects the current Organisation or Workspace
                          namespace.
                        enum:
                        - Organisation
                        - Workspace
                        type: string
                    required:
                    - model
                    - provider
                    - scope
                    type: object
                  defaultModel:
                    description: DefaultModel is the required primary OpenCode model.
                    properties:
                      model:
                        description: Model is the exact upstream model identifier.
                        maxLength: 512
                        minLength: 1
                        type: string
                      provider:
                        description: Provider is the immutable InferenceProvider metadata
                          name.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                      scope:
                        description: Scope selects the current Organisation or Workspace
                          namespace.
                        enum:
                        - Organisation
                        - Workspace
                        type: string
                    required:
                    - model
                    - provider
                    - scope
                    type: object
                  models:
                    description: Models is the hard provider/model allowlist.
                    items:
                      description: InferenceModelRef identifies one enabled model
                        on one provider instance.
                      properties:
                        model:
                          description: Model is the exact upstream model identifier.
                          maxLength: 512
                          minLength: 1
                          type: string
                        provider:
                          description: Provider is the immutable InferenceProvider
                            metadata name.
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        scope:
                          description: Scope selects the current Organisation or Workspace
                            namespace.
                          enum:
                          - Organisation
                          - Workspace
                          type: string
                      required:
                      - model
                      - provider
                      - scope
                      type: object
                    maxItems: 500
                    minItems: 1
                    type: array
                    x-kubernetes-list-map-keys:
                    - scope
                    - provider
                    - model
                    x-kubernetes-list-type: map
                  smallModel:
                    description: SmallModel is the optional OpenCode background-task
                      model.
                    properties:
                      model:
                        description: Model is the exact upstream model identifier.
                        maxLength: 512
                        minLength: 1
                        type: string
                      provider:
                        description: Provider is the immutable InferenceProvider metadata
                          name.
                        maxLength: 63
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                        type: string
                      scope:
                        description: Scope selects the current Organisation or Workspace
                          namespace.
                        enum:
                        - Organisation
                        - Workspace
                        type: string
                    required:
                    - model
                    - provider
                    - scope
                    type: object
                required:
                - defaultModel
                - models
                type: object
                x-kubernetes-validations:
                - message: default model must belong to the allowlist
                  rule: self.models.exists(m, m.scope == self.defaultModel.scope &&
                    m.provider == self.defaultModel.provider && m.model == self.defaultModel.model)
                - message: small model must belong to the allowlist
                  rule: '!has(self.smallModel) || self.models.exists(m, m.scope ==
                    self.smallModel.scope && m.provider == self.smallModel.provider
                    && m.model == self.smallModel.model)'
                - message: attachment model must belong to the allowlist
                  rule: '!has(self.attachmentModel) || self.models.exists(m, m.scope
                    == self.attachmentModel.scope && m.provider == self.attachmentModel.provider
                    && m.model == self.attachmentModel.model)'
              lastModifiedByUserID:
                description: LastModifiedByUserID is the Better Auth User ID that
                  last changed the resource.
                maxLength: 128
                minLength: 1
                type: string
              mcpConnectionRefs:
                description: |-
                  MCPConnectionRefs lists external MCP connections exposed in this
                  sandbox in order.
                items:
                  description: MCPConnectionRef references one MCPConnection and its
                    exposed tools.
                  properties:
                    name:
                      description: Name is the immutable Kubernetes metadata name
                        of the resource.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    scope:
                      description: Scope selects the current Organisation or Workspace
                        namespace.
                      enum:
                      - Organisation
                      - Workspace
                      type: string
                    tools:
                      description: |-
                        Tools lists the upstream MCP tools exposed through this sandbox
                        for the referenced connection.
                      items:
                        description: |-
                          SandboxMCPTool describes one upstream MCP tool exposed through a
                          sandbox.
                        properties:
                          name:
                            description: Name is the upstream MCP tool name exposed
                              through this sandbox.
                            type: string
                          requireConsent:
                            description: |-
                              RequireConsent asks the interactive user to approve this tool before
                              OpenCode runs it.
                            type: boolean
                        required:
                        - name
                        - requireConsent
                        type: object
                      type: array
                  required:
                  - name
                  - scope
                  - tools
                  type: object
                type: array
              packages:
                description: |-
                  Packages lists nix packages (e.g. "python3", "nodejs_22", "ripgrep") to
                  install into referencing Agent runtimes. Each entry is prefixed with
                  nixpkgs# automatically.
                items:
                  type: string
                type: array
              skills:
                description: Skills lists immutable Skill names exposed through this
                  sandbox.
                items:
                  description: ResourceReference identifies a resource by scope and
                    metadata name.
                  properties:
                    name:
                      description: Name is the immutable Kubernetes metadata name
                        of the resource.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    scope:
                      description: Scope selects the current Organisation or Workspace
                        namespace.
                      enum:
                      - Organisation
                      - Workspace
                      type: string
                  required:
                  - name
                  - scope
                  type: object
                maxItems: 200
                type: array
                x-kubernetes-list-map-keys:
                - scope
                - name
                x-kubernetes-list-type: map
            required:
            - createdByUserID
            - inference
            - lastModifiedByUserID
            type: object
            x-kubernetes-validations:
            - message: skill names must not exceed 63 characters
              rule: '!has(self.skills) || self.skills.all(s, size(s.name) <= 63)'
            - message: skill names must use lowercase letters, digits, and single
                hyphens
              rule: '!has(self.skills) || self.skills.all(s, s.name.matches(''^[a-z0-9]+(-[a-z0-9]+)*$''))'
            - message: createdByUserID is immutable
              rule: self.createdByUserID == oldSelf.createdByUserID
          status:
            description: status defines the observed state of Sandbox
            properties:
              allowedHostCount:
                description: AllowedHostCount is the number of allowed hosts configured.
                type: integer
              conditions:
                description: |-
                  conditions represent the current state of the Sandbox resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              inferenceReady:
                description: InferenceReady reports whether referenced providers and
                  models are ready.
                type: boolean
              mcpRefCount:
                description: MCPRefCount is the number of MCP connection references
                  configured.
                type: integer
              modelCount:
                description: ModelCount is the number of allowed inference models.
                type: integer
              packageCount:
                description: PackageCount is the number of nix packages configured.
                type: integer
            required:
            - allowedHostCount
            - mcpRefCount
            - packageCount
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
