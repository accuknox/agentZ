{{- if and .Values.enabled .Values.inference.externalSecrets.enabled }}
{{- $cfg := .Values.inference.externalSecrets }}
{{- $saNamespace := default .Release.Namespace $cfg.serviceAccount.namespace }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "manager.inferenceExternalSecretsServiceAccountName" . }}
  namespace: {{ $saNamespace }}
  labels:
    {{- include "manager.labels" . | nindent 4 }}
  {{- with $cfg.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ include "manager.inferenceSecretStoreName" . }}
  labels:
    {{- include "manager.labels" . | nindent 4 }}
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          {{- toYaml $cfg.managedNamespaceSelector | nindent 10 }}
  provider:
    vault:
      server: {{ required "manager.inference.externalSecrets.openBao.server is required" $cfg.openBao.server | quote }}
      path: {{ required "manager.inference.externalSecrets.openBao.kvMount is required" $cfg.openBao.kvMount | quote }}
      version: v2
      {{- with $cfg.openBao.caBundle }}
      caBundle: {{ . | quote }}
      {{- end }}
      {{- with $cfg.openBao.caProvider }}
      caProvider:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      auth:
        kubernetes:
          mountPath: {{ required "manager.inference.externalSecrets.openBao.kubernetesAuthMount is required" $cfg.openBao.kubernetesAuthMount | quote }}
          role: {{ required "manager.inference.externalSecrets.openBao.role is required" $cfg.openBao.role | quote }}
          serviceAccountRef:
            name: {{ include "manager.inferenceExternalSecretsServiceAccountName" . }}
            namespace: {{ $saNamespace }}
            {{- with $cfg.serviceAccount.audiences }}
            audiences:
              {{- toYaml . | nindent 14 }}
            {{- end }}
{{- end }}
