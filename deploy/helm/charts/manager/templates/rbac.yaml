{{- if and .Values.enabled .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "manager.fullname" . }}-manager-role
  labels:
    {{- include "manager.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps", "persistentvolumeclaims", "pods", "secrets", "serviceaccounts", "services"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["agentgateway.dev"]
    resources: ["agentgatewaybackends", "agentgatewayparameters", "agentgatewaypolicies"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments/status"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["create", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["agentz.accuknox.com"]
    resources: ["agents"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["agentz.accuknox.com"]
    resources: ["agents"]
    verbs:
      - create-dashboard
      - create-workflow
      - create-workflow-schedule
      - delete-dashboard
      - delete-workflow-schedule
      - delete-workflows
      - get-dashboard
      - get-workflow
      - list-dashboards
      - list-workflow-schedules
      - list-workflows
      - publish-dashboard-data
      - set-workflowrun-status
      - update-workflow-schedule
  - apiGroups: ["agentz.accuknox.com"]
    resources: ["inferencepools", "inferenceproviders", "sandboxes"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["agentz.accuknox.com"]
    resources: ["mcpconnections", "secrets"]
    verbs: ["create", "delete", "get", "list", "patch", "watch"]
  - apiGroups: ["agentz.accuknox.com"]
    resources:
      - agents/finalizers
      - inferencepools/finalizers
      - inferenceproviders/finalizers
      - mcpconnections/finalizers
      - sandboxes/finalizers
      - secrets/finalizers
      - skills/finalizers
      - workflowruns/finalizers
    verbs: ["update"]
  - apiGroups: ["agentz.accuknox.com"]
    resources:
      - agents/status
      - inferencepools/status
      - inferenceproviders/status
      - mcpconnections/status
      - sandboxes/status
      - secrets/status
      - tenants/status
      - workflowruns/status
      - workflowschedules/status
      - workspaces/status
    verbs: ["get", "patch", "update"]
  - apiGroups: ["agentz.accuknox.com"]
    resources: ["skills", "workflowruns"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["agentz.accuknox.com"]
    resources: ["tenants"]
    verbs: ["get", "list", "patch", "update", "use", "watch"]
  - apiGroups: ["agentz.accuknox.com"]
    resources: ["workflowschedules"]
    verbs: ["create", "delete", "get", "list", "update", "watch"]
  - apiGroups: ["agentz.accuknox.com"]
    resources: ["workspaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes", "referencegrants"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings", "clusterroles"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings", "roles"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "manager.fullname" . }}-manager-rolebinding
  labels:
    {{- include "manager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "manager.fullname" . }}-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ include "manager.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "manager.fullname" . }}-leader-election-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "manager.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "manager.fullname" . }}-leader-election-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "manager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "manager.fullname" . }}-leader-election-role
subjects:
  - kind: ServiceAccount
    name: {{ include "manager.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "manager.fullname" . }}-metrics-auth-role
  labels:
    {{- include "manager.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "manager.fullname" . }}-metrics-auth-rolebinding
  labels:
    {{- include "manager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "manager.fullname" . }}-metrics-auth-role
subjects:
  - kind: ServiceAccount
    name: {{ include "manager.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "manager.fullname" . }}-metrics-reader
  labels:
    {{- include "manager.labels" . | nindent 4 }}
rules:
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
{{- end }}
