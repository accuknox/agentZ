enabled: true

nameOverride: ""
fullnameOverride: ""

inference:
  externalSecrets:
    enabled: true
    storeName: ""
    refreshInterval: 1m
    serviceAccount:
      name: ""
      namespace: ""
      annotations: {}
      audiences:
        - https://kubernetes.default.svc
    openBao:
      server: http://openbao.openbao.svc.cluster.local:8200
      kvMount: kv
      kubernetesAuthMount: kubernetes
      role: agentz-inference-external-secrets
      caBundle: ""
      caProvider: {}
    managedNamespaceSelector:
      app.kubernetes.io/managed-by: agentz

replicaCount: 1
revisionHistoryLimit: 10
terminationGracePeriodSeconds: 10

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

image:
  repository: murtazau/agentz
  tag: latest
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: true

rbac:
  create: true

podAnnotations: {}
podLabels: {}

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

config:
  logLevel: info
  logFormat: text
  logWithSource: false
  metricsBindAddress: ":8443"
  healthProbeBindAddress: ":8081"
  leaderElect: true
  metricsSecure: true
  enableHTTP2: false
  workflowRunOrphanRetention: 168h
  # Image used for controller-managed workloads and agent filesystem sidecars.
  controllerImage: murtazau/agentz:latest
  agentImage: ""
  agentInitImage: ""
  gatewayURL: ""
  agentgatewayTraceMode: service
  agentgatewayTraceServiceName: ""
  agentgatewayTraceServiceNamespace: ""
  agentgatewayTraceServicePort: 4317
  agentgatewayTraceHost: ""
  agentgatewayTracePort: 4317
  nixStorePVC: nix-store
  nixStoreSize: 5Gi
  nixStoreAccessModes:
  - ReadWriteOnce
  nixStoreStorageClass: ""
  nixCacheEndpoint: https://cache.nixos.org
  skillsS3Endpoint: http://rustfs.rustfs.svc.cluster.local:9000
  skillsS3Region: us-east-1
  skillsS3Bucket: agentz
  skillsS3AccessKeyIDSecretName: agentz-skills-s3
  skillsS3AccessKeyIDSecretKey: access-key-id
  skillsS3SecretAccessKeySecretName: agentz-skills-s3
  skillsS3SecretAccessKeySecretKey: secret-access-key
  openBaoAddr: http://openbao.openbao.svc.cluster.local:8200
  managerOpenBaoAddr: ""
  openBaoSecretMountPath: kv
  openBaoK8sAuthMountPath: kubernetes
  sinjectorOpenBaoK8sAuthTokenPath: /var/run/secrets/kubernetes.io/serviceaccount/token
  managerOpenBaoK8sAuthRole: manager
  managerOpenBaoK8sAuthTokenPath: /var/run/secrets/kubernetes.io/serviceaccount/token
  managerGatewayTokenPath: /var/run/secrets/agentz/gateway/token
  managerGatewayTokenAudience: agentz-gateway
  gatewayServiceAccountName: ""
  gatewayServiceAccountNamespace: ""
  sinjectorCASecretName: sinjector
  sinjectorCASecretCertKey: tls.crt
  sinjectorCASecretKeyKey: tls.key
  sinjectorCASecretBundleKey: ca.crt
  sinjectorCACertPath: /etc/agentz/sinjector-ca/tls.crt
  sinjectorCAKeyPath: /etc/agentz/sinjector-ca/tls.key
  agentCABundlePath: /etc/agentz/sinjector-ca/ca.crt
  tenantSinjectorClusterIssuerName: selfsigned
  watchNamespace: ""
  enableWebhooks: true

service:
  metrics:
    enabled: true
    port: 8443
  webhook:
    port: 443
    targetPort: 9443

certManager:
  enabled: true
  issuerName: selfsigned-issuer
  webhookCertificateName: serving-cert
  webhookSecretName: ""

extraArgs: []
