global:
  # Operator-managed application credentials in the release namespace.
  secretName: agentz

enabled: true

nameOverride: ""
fullnameOverride: ""

# replicaCount can exceed one with leader election enabled.
replicaCount: 1
revisionHistoryLimit: 10
terminationGracePeriodSeconds: 10

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

image:
  repository: public.ecr.aws/k9v9d5v2/agentz
  # tag defaults to v<chart appVersion>. digest takes precedence.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: true

rbac:
  create: true

podAnnotations: {}
podLabels: {}

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

service:
  metrics:
    enabled: true
    port: 8443
  webhook:
    port: 443
    targetPort: 9443

browser:
  image:
    repository: public.ecr.aws/k9v9d5v2/agentz/browser
    # tag defaults to v<chart appVersion>. digest takes precedence.
    tag: ""
    digest: ""
    # reference overrides the other image fields for the worker and installer.
    reference: ""
  seccomp:
    # enabled deploys a DaemonSet to install Chromium's profile on Linux nodes.
    # The installer runs as root and writes to the node's seccomp directory.
    enabled: true
    # kubeletDirectory is the node's seccomp directory.
    kubeletDirectory: /var/lib/kubelet/seccomp
    # localhostProfile is relative to the kubelet's seccomp directory. Set it
    # for an externally managed profile and disable the installer above. With
    # the installer disabled and no profile set, browsers use RuntimeDefault.
    localhostProfile: ""
    # imagePullPolicy applies to the installer and defaults to image.pullPolicy.
    imagePullPolicy: ""

inference:
  externalSecrets:
    enabled: true
    storeName: ""
    refreshInterval: 1m
    serviceAccount:
      name: ""
      namespace: ""
      annotations: {}
      audiences:
      - https://kubernetes.default.svc
    openBao:
      server: http://openbao.openbao.svc.cluster.local:8200
      kvMount: kv
      kubernetesAuthMount: kubernetes
      role: agentz-inference-external-secrets
      caBundle: ""
      caProvider: {}
    managedNamespaceSelector:
      app.kubernetes.io/managed-by: agentz

delegation:
  # namespace defaults to the gateway's delegation namespace in umbrella
  # installs. Set it to match when overriding the gateway's name.
  namespace: ""

config:
  logLevel: info
  logFormat: text
  logWithSource: false
  metricsBindAddress: ":8443"
  healthProbeBindAddress: ":8081"
  leaderElect: true
  metricsSecure: true
  enableHTTP2: false
  # workflowRunOrphanRetention prunes orphaned terminal WorkflowRuns. Set 0
  # to disable pruning.
  workflowRunOrphanRetention: 168h
  # controllerImage defaults to the manager image for extauth, sinjector,
  # and agent filesystem sidecars.
  controllerImage: ""
  # agentImage is the default image for Agent resources created by the system.
  agentImage: public.ecr.aws/k9v9d5v2/agentz/agent:v0.36.0
  # agentInitImage supplies the init container for Nix agents.
  agentInitImage: public.ecr.aws/k9v9d5v2/agentz/init:v0.36.0
  # gatewayURL is required for standalone installs. Umbrella installs default
  # to the bundled gateway Service.
  gatewayURL: ""
  # inferenceMaxBufferSize is the body buffer for inference gateway CEL
  # authorization. Use a Kubernetes quantity from 1 to 4294967295 bytes.
  inferenceMaxBufferSize: 32Mi
  # agentgatewayTraceMode supports service and static. Umbrella installs
  # default the service name and namespace to the bundled observer.
  agentgatewayTraceMode: service
  agentgatewayTraceServiceName: ""
  agentgatewayTraceServiceNamespace: ""
  agentgatewayTraceServicePort: 4317
  agentgatewayTraceHost: ""
  agentgatewayTracePort: 4317
  # delegationTracePort is the observer port for delegated gateway exporters.
  delegationTracePort: 4318
  # nixStorePVC is the name of each scope-local PVC used by agent package jobs.
  nixStorePVC: nix-store
  nixStoreSize: 5Gi
  nixStoreAccessModes:
  - ReadWriteOnce
  nixStoreStorageClass: ""
  nixCacheEndpoint: https://cache.nixos.org
  # skillsS3Endpoint serves immutable Skill objects.
  skillsS3Endpoint: http://rustfs.rustfs.svc.cluster.local:9000
  skillsS3Region: us-east-1
  skillsS3Bucket: agentz
  openBaoAddr: http://openbao.openbao.svc.cluster.local:8200
  # managerOpenBaoAddr overrides the OpenBao address for manager provisioning.
  managerOpenBaoAddr: ""
  openBaoSecretMountPath: kv
  openBaoK8sAuthMountPath: kubernetes
  sinjectorOpenBaoK8sAuthTokenPath: /var/run/secrets/kubernetes.io/serviceaccount/token
  managerOpenBaoK8sAuthRole: manager
  managerOpenBaoK8sAuthTokenPath: /var/run/secrets/kubernetes.io/serviceaccount/token
  managerGatewayTokenPath: /var/run/secrets/agentz/gateway/token
  managerGatewayTokenAudience: agentz-gateway
  gatewayServiceAccountName: ""
  gatewayServiceAccountNamespace: ""
  sinjectorCASecretName: sinjector
  sinjectorCASecretCertKey: tls.crt
  sinjectorCASecretKeyKey: tls.key
  sinjectorCASecretBundleKey: ca.crt
  sinjectorCACertPath: /etc/agentz/sinjector-ca/tls.crt
  sinjectorCAKeyPath: /etc/agentz/sinjector-ca/tls.key
  agentCABundlePath: /etc/agentz/sinjector-ca/ca.crt
  # tenantSinjectorClusterIssuerName is the ClusterIssuer for tenant CAs.
  tenantSinjectorClusterIssuerName: selfsigned
  # tenantAgentQuota is copied to new tenants. Existing tenants and agents
  # keep their configured quotas.
  tenantAgentQuota:
    count: 2
    resources:
      cpu: "1"
      memory: 1600Mi
    defaults:
      resources:
        cpu: 500m
        memory: 800Mi
      qosClass: guaranteed
  tenantDashboardQuota:
    dashboardsPerAgent: 25
    widgetsPerDashboard: 24
    publish:
      requestBytes: 256Ki
      recordsPerRequest: 100
      requestsPerMinutePerAgent: 30
      acceptedBytesPerDay: 64Mi
      temporalRecordsPerDay: 50000
      retainedTemporalRecords: 1500000
      latestBytesPerAgent: 64Mi
    query:
      requestsPerMinutePerUser: 30
      returnedCellsPerHour: 5000000
      concurrentRequests: 4
      cellsPerRequest: 50000
      responseBytes: 2Mi
      pointsPerSeries: 500
      timeout: 5s
  # watchNamespace accepts one namespace or a comma-separated list.
  watchNamespace: ""
  enableWebhooks: true

certManager:
  # enabled creates cert-manager resources for the admission webhooks.
  enabled: true
  issuerName: selfsigned-issuer
  webhookCertificateName: serving-cert
  webhookSecretName: ""

# extraArgs are appended to the manager command.
extraArgs: []
