nameOverride: ""
fullnameOverride: ""

inference:
  externalSecrets:
    storeName: agentz-inference
    refreshInterval: 1m

replicaCount: 1

image:
  repository: murtazau/agentz
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""

rbac:
  create: true
  createUserRoles: true

podAnnotations: {}
podLabels: {}

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

config:
  logLevel: info
  logFormat: text
  logWithSource: false
  metricsBindAddress: ":8443"
  healthProbeBindAddress: ":8081"
  leaderElect: true
  metricsSecure: true
  enableHTTP2: false
  workflowRunOrphanRetention: 168h
  # Image used for controller-managed workloads and agent filesystem sidecars.
  controllerImage: controller:latest
  agentImage: ""
  agentInitImage: ""
  gatewayURL: http://gateway.agentz-system.svc.cluster.local:8090
  agentgatewayTraceMode: service
  agentgatewayTraceServiceName: observer
  agentgatewayTraceServiceNamespace: agentz-system
  agentgatewayTraceServicePort: 4317
  agentgatewayTraceHost: ""
  agentgatewayTracePort: 4317
  nixStorePVC: ""
  tenantNixStoreSize: 5Gi
  tenantNixStoreAccessModes:
  - ReadWriteOnce
  tenantNixStoreStorageClass: ""
  skillsS3Endpoint: http://rustfs.rustfs.svc.cluster.local:9000
  skillsS3Region: us-east-1
  skillsS3Bucket: agentz
  skillsS3AccessKeyIDSecretName: agentz-skills-s3
  skillsS3AccessKeyIDSecretKey: access-key-id
  skillsS3SecretAccessKeySecretName: agentz-skills-s3
  skillsS3SecretAccessKeySecretKey: secret-access-key
  openBaoAddr: http://openbao.openbao.svc.cluster.local:8200
  managerOpenBaoAddr: ""
  openBaoSecretMountPath: kv
  openBaoK8sAuthMountPath: kubernetes
  sinjectorOpenBaoK8sAuthTokenPath: /var/run/secrets/kubernetes.io/serviceaccount/token
  managerOpenBaoK8sAuthRole: manager
  managerOpenBaoK8sAuthTokenPath: /var/run/secrets/kubernetes.io/serviceaccount/token
  managerGatewayTokenPath: /var/run/secrets/agentz/gateway/token
  managerGatewayTokenAudience: agentz-gateway
  sinjectorCASecretName: sinjector
  sinjectorCASecretCertKey: tls.crt
  sinjectorCASecretKeyKey: tls.key
  sinjectorCASecretBundleKey: ca.crt
  sinjectorCACertPath: /etc/agentz/sinjector-ca/tls.crt
  sinjectorCAKeyPath: /etc/agentz/sinjector-ca/tls.key
  agentCABundlePath: /etc/agentz/sinjector-ca/ca.crt
  tenantSinjectorClusterIssuerName: ""
  watchNamespace: ""
  enableWebhooks: true

service:
  metrics:
    enabled: true
    port: 8443
  webhook:
    enabled: true
    port: 443
    targetPort: 9443

certManager:
  enabled: true
  issuerName: selfsigned-issuer
  webhookCertificateName: serving-cert
  webhookSecretName: webhook-server-cert

extraArgs: []
