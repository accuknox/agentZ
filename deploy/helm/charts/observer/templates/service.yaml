{{- if .Values.enabled }}
{{- if eq (int .Values.service.otlpGrpcPort) (int .Values.service.appGrpcPort) }}
{{- fail "observer native and app OTLP ports must differ" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "observer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observer.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: otlp-grpc
      port: {{ .Values.service.otlpGrpcPort }}
      targetPort: otlp-grpc
      protocol: TCP
    - name: app-grpc
      port: {{ .Values.service.appGrpcPort }}
      targetPort: app-grpc
      protocol: TCP
  selector:
    {{- include "observer.selectorLabels" . | nindent 4 }}
{{- end }}
