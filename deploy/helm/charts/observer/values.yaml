global:
  # Operator-managed application credentials in the release namespace.
  secretName: agentz

enabled: true

nameOverride: ""
fullnameOverride: ""

replicaCount: 1
revisionHistoryLimit: 10
terminationGracePeriodSeconds: 30

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

image:
  repository: public.ecr.aws/k9v9d5v2/agentz
  tag: latest
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: true

rbac:
  create: true

podAnnotations: {}
podLabels: {}

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

service:
  type: ClusterIP
  otlpGrpcPort: 4317
  # Reachable only from controller-managed inference and MCP gateway pods.
  appGrpcPort: 4318

config:
  logLevel: info
  logFormat: text
  logWithSource: false
  kubearmorRelayAddr: kubearmor-relay.kubearmor.svc.cluster.local:32767
  hubbleRelayAddr: hubble-relay.kube-system.svc.cluster.local:80
  # Bytes. Full content exports can exceed the default gRPC message limit.
  otlpTraceMaxMessageSize: 134217728
  batchSize: 500
  flushInterval: 1s

extraArgs: []
