apiVersion: v1
kind: Secret
metadata:
  name: {{ include "web.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "web.labels" . | nindent 4 }}
type: Opaque
stringData:
  MCP_OAUTH_COOKIE_SECRET: {{ required "web.secrets.mcpOAuthCookieSecret is required" .Values.secrets.mcpOAuthCookieSecret | quote }}
  {{- if .Values.secrets.nixosSearchESPassword }}
  NIXOS_SEARCH_ES_PASSWORD: {{ .Values.secrets.nixosSearchESPassword | quote }}
  {{- end }}
