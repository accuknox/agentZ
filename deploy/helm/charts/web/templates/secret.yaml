apiVersion: v1
kind: Secret
metadata:
  name: {{ include "web.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "web.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "web.secrets.databaseURL is required" .Values.secrets.databaseURL | quote }}
  BETTER_AUTH_SECRET: {{ required "web.secrets.betterAuthSecret is required" .Values.secrets.betterAuthSecret | quote }}
  MCP_OAUTH_COOKIE_SECRET: {{ required "web.secrets.mcpOAuthCookieSecret is required" .Values.secrets.mcpOAuthCookieSecret | quote }}
  {{- if .Values.secrets.githubClientSecret }}
  GITHUB_CLIENT_SECRET: {{ .Values.secrets.githubClientSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.googleClientSecret }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.organizationAssetsS3AccessKeyID }}
  ORGANIZATION_ASSETS_S3_ACCESS_KEY_ID: {{ .Values.secrets.organizationAssetsS3AccessKeyID | quote }}
  ORGANIZATION_ASSETS_S3_SECRET_ACCESS_KEY: {{ .Values.secrets.organizationAssetsS3SecretAccessKey | quote }}
  {{- end }}
  {{- if .Values.secrets.organizationAssetsS3SessionToken }}
  ORGANIZATION_ASSETS_S3_SESSION_TOKEN: {{ .Values.secrets.organizationAssetsS3SessionToken | quote }}
  {{- end }}
  {{- if .Values.secrets.nixosSearchESPassword }}
  NIXOS_SEARCH_ES_PASSWORD: {{ .Values.secrets.nixosSearchESPassword | quote }}
  {{- end }}
