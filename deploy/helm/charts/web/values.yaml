nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  repository: murtazau/agentz-web
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""

podAnnotations: {}
podLabels: {}

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

service:
  type: ClusterIP
  port: 3000

env:
  # Required public Better Auth issuer URL.
  betterAuthURL: ""
  # Required public gateway base URL used by browser clients.
  gatewayBaseURL: ""
  # Optional internal gateway base URL used only by server-side web requests.
  internalGatewayBaseURL: ""
  # Audience for Better Auth JWTs consumed by the gateway.
  gatewayJWTAudience: agentz-gateway
  # Enable Better Auth email/password sign-in and sign-up.
  enableEmailPasswordAuth: false
  # Optional comma-separated allowlist for email/password auth.
  emailPasswordAuthAllowedUser: ""
  # Optional GitHub OAuth client ID.
  githubClientID: ""
  # Optional GitHub allow-list user ID.
  githubAllowedUserID: ""
  # Optional GitHub organization gate.
  githubOrg: ""
  # Optional GitHub team slug gate.
  githubTeamSlug: ""
  # Optional Google OAuth client ID.
  googleClientID: ""
  # Optional comma-separated Google email-domain allow list.
  googleAllowedEmailDomains: ""
  # Optional custom S3-compatible API endpoint. Leave empty for AWS S3.
  organizationAssetsS3Endpoint: ""
  # S3-compatible region for public Organisation profile images.
  organizationAssetsS3Region: ""
  # S3-compatible bucket for public Organisation profile images.
  organizationAssetsS3Bucket: ""
  # Public base URL for immutable Organisation profile images.
  organizationAssetsPublicBaseURL: ""
  # Use path-style S3 addressing for providers such as MinIO.
  organizationAssetsS3ForcePathStyle: false
  # Optional NixOS search Elasticsearch endpoint.
  nixosSearchESURL: ""
  # Optional NixOS search Elasticsearch username.
  nixosSearchESUsername: ""
  # Optional NixOS search schema version.
  nixosSearchESSchemaVersion: ""
  # Optional NixOS search branch.
  nixosSearchESBranch: ""


secrets:
  # Required database DSN for Better Auth and Drizzle.
  databaseURL: ""
  # Required Better Auth secret.
  betterAuthSecret: ""
  # Required secret used to protect MCP OAuth flow cookies.
  mcpOAuthCookieSecret: ""
  # Optional GitHub OAuth client secret.
  githubClientSecret: ""
  # Optional Google OAuth client secret.
  googleClientSecret: ""
  # Optional static S3-compatible access key ID. The default provider chain is used when empty.
  organizationAssetsS3AccessKeyID: ""
  # Optional static S3-compatible secret access key.
  organizationAssetsS3SecretAccessKey: ""
  # Optional static S3-compatible session token.
  organizationAssetsS3SessionToken: ""
  # Optional NixOS search Elasticsearch password.
  nixosSearchESPassword: ""
