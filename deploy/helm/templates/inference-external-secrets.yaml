{{- if .Values.global.inference.externalSecrets.enabled }}
{{- $cfg := .Values.global.inference.externalSecrets }}
{{- $saNamespace := default .Release.Namespace $cfg.serviceAccount.namespace }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ required "global.inference.externalSecrets.serviceAccount.name is required" $cfg.serviceAccount.name }}
  namespace: {{ $saNamespace }}
  labels:
    {{- include "agentz.labels" . | nindent 4 }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ required "global.inference.externalSecrets.storeName is required" $cfg.storeName }}
  labels:
    {{- include "agentz.labels" . | nindent 4 }}
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          {{- toYaml $cfg.tenantNamespaceSelector | nindent 10 }}
  provider:
    vault:
      server: {{ required "global.inference.externalSecrets.openBao.server is required" $cfg.openBao.server | quote }}
      path: {{ required "global.inference.externalSecrets.openBao.kvMount is required" $cfg.openBao.kvMount | quote }}
      version: v2
      {{- with $cfg.openBao.caBundle }}
      caBundle: {{ . | quote }}
      {{- end }}
      {{- with $cfg.openBao.caProvider }}
      caProvider:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      auth:
        kubernetes:
          mountPath: {{ required "global.inference.externalSecrets.openBao.kubernetesAuthMount is required" $cfg.openBao.kubernetesAuthMount | quote }}
          role: {{ required "global.inference.externalSecrets.openBao.role is required" $cfg.openBao.role | quote }}
          serviceAccountRef:
            name: {{ $cfg.serviceAccount.name }}
            namespace: {{ $saNamespace }}
            {{- with $cfg.serviceAccount.audiences }}
            audiences:
              {{- toYaml . | nindent 14 }}
            {{- end }}
{{- end }}
