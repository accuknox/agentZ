{{- if .Values.ingress.enabled }}
{{- if not .Values.gateway.enabled }}
{{- fail "ingress.enabled requires gateway.enabled=true" }}
{{- end }}
{{- if not .Values.web.enabled }}
{{- fail "ingress.enabled requires web.enabled=true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentz.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: {{ include "agentz.webFullname" $ }}
                port:
                  number: {{ $.Values.web.service.port }}
          - path: /api/account
            pathType: Prefix
            backend:
              service:
                name: {{ include "agentz.webFullname" $ }}
                port:
                  number: {{ $.Values.web.service.port }}
          - path: /api/gateway
            pathType: Prefix
            backend:
              service:
                name: {{ include "agentz.webFullname" $ }}
                port:
                  number: {{ $.Values.web.service.port }}
          - path: /api/message-actors
            pathType: Prefix
            backend:
              service:
                name: {{ include "agentz.webFullname" $ }}
                port:
                  number: {{ $.Values.web.service.port }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "agentz.gatewayFullname" $ }}
                port:
                  number: {{ $.Values.gateway.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "agentz.webFullname" $ }}
                port:
                  number: {{ $.Values.web.service.port }}
    {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
