{{- if .Values.migrations.enabled }}
{{- range $name := list "web" "gateway" }}
{{- $image := (index $.Values $name).image }}
{{- if and (not $image.digest) (or (not $image.tag) (eq $image.tag "latest")) }}
{{- fail (printf "%s.image requires an immutable release tag or digest when migrations.enabled=true" $name) }}
{{- end }}
{{- end }}
{{- $goImage := printf "%s:%s" .Values.gateway.image.repository .Values.gateway.image.tag }}
{{- if .Values.gateway.image.digest }}
{{- $goImage = printf "%s@%s" .Values.gateway.image.repository .Values.gateway.image.digest }}
{{- end }}
{{- $webImage := printf "%s:%s" .Values.web.image.repository .Values.web.image.tag }}
{{- if .Values.web.image.digest }}
{{- $webImage = printf "%s@%s" .Values.web.image.repository .Values.web.image.digest }}
{{- end }}
{{- if .Values.observer.enabled }}
{{- $observerImage := printf "%s:%s" .Values.observer.image.repository .Values.observer.image.tag }}
{{- if .Values.observer.image.digest }}
{{- $observerImage = printf "%s@%s" .Values.observer.image.repository .Values.observer.image.digest }}
{{- end }}
{{- if ne $goImage $observerImage }}
{{- fail "observer.image must match gateway.image when migrations.enabled=true" }}
{{- end }}
{{- end }}
{{- $name := printf "%s-migrate" .Release.Name }}
{{- $secretName := default .Values.postgres.secretName .Values.migrations.secretName }}
{{- $secretKey := default .Values.postgres.secretKey .Values.migrations.secretKey }}
{{- if and .Values.postgres.createSecret (eq $secretName .Values.postgres.secretName) }}
{{- $secretName = printf "%s-db-hook" .Release.Name }}
# Ordinary release Secrets do not exist during pre-install.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentz.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
stringData:
  {{ $secretKey }}: {{ required "postgres.databaseURL is required when postgres.createSecret=true" .Values.postgres.databaseURL | quote }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentz.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    # Drizzle Kit does not lock migrations. Keep failed/running Jobs so Helm
    # cannot replace one while its Pod still has an active database session.
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  podReplacementPolicy: Failed
  activeDeadlineSeconds: {{ add (mul .Values.migrations.timeoutSeconds 2) 60 }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "agentz.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with concat .Values.web.imagePullSecrets .Values.gateway.imagePullSecrets | uniq }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: web-migrations
          image: {{ $webImage | quote }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          command: ["bun", "node_modules/drizzle-kit/bin.cjs", "migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "postgres.secretName or migrations.secretName is required" $secretName }}
                  key: {{ required "postgres.secretKey or migrations.secretKey is required" $secretKey }}
          securityContext:
            {{- toYaml .Values.web.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
      containers:
        - name: go-migrations
          image: {{ $goImage | quote }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          command: ["/agentz"]
          args: ["migrate", {{ printf "--timeout=%vs" .Values.migrations.timeoutSeconds | quote }}]
          env:
            - name: AGENTZ_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: {{ $secretKey }}
          securityContext:
            {{- toYaml .Values.gateway.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
      {{- with .Values.migrations.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrations.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrations.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
