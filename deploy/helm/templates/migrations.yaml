{{- if .Values.migrations.enabled }}
{{- $names := list "web" "gateway" }}
{{- if .Values.observer.enabled }}
{{- $names = append $names "observer" }}
{{- end }}
{{- $images := dict }}
{{- range $name := $names }}
{{- $image := (index $.Values $name).image }}
{{- if $image.digest }}
{{- $_ := set $images $name (printf "%s@%s" $image.repository $image.digest) }}
{{- else }}
{{- $appVersion := $.Chart.AppVersion }}
{{- with index $.Subcharts $name }}
{{- $appVersion = .Chart.AppVersion }}
{{- end }}
{{- $tag := default (printf "v%s" $appVersion) $image.tag }}
{{- if eq $tag "latest" }}
{{- fail (printf "%s.image requires an immutable release tag or digest when migrations.enabled=true" $name) }}
{{- end }}
{{- $_ := set $images $name (printf "%s:%s" $image.repository $tag) }}
{{- end }}
{{- end }}
{{- if and .Values.observer.enabled (ne $images.gateway $images.observer) }}
{{- fail "observer.image must match gateway.image when migrations.enabled=true" }}
{{- end }}
{{- $name := printf "%s-migrate" .Release.Name }}
{{- $secretName := required "global.secretName is required" .Values.global.secretName }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentz.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    # Drizzle Kit does not lock migrations. Keep failed/running Jobs so Helm
    # cannot replace one while its Pod still has an active database session.
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  podReplacementPolicy: Failed
  activeDeadlineSeconds: {{ add (mul .Values.migrations.timeoutSeconds 2) 60 }}
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "agentz.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with concat .Values.web.imagePullSecrets .Values.gateway.imagePullSecrets | uniq }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: web-migrations
          image: {{ $images.web | quote }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          command: ["bun", "node_modules/drizzle-kit/bin.cjs", "migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: DATABASE_URL
          securityContext:
            {{- toYaml .Values.web.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
      containers:
        - name: go-migrations
          image: {{ $images.gateway | quote }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          command: ["/agentz"]
          args: ["migrate", {{ printf "--timeout=%vs" .Values.migrations.timeoutSeconds | quote }}]
          env:
            - name: AGENTZ_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: AGENTZ_POSTGRES_DSN
          securityContext:
            {{- toYaml .Values.gateway.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
      {{- with .Values.migrations.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrations.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.migrations.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
