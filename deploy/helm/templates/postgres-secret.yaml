{{- if .Values.postgres.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ required "postgres.secretName is required" .Values.postgres.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentz.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ required "postgres.secretKey is required" .Values.postgres.secretKey }}: {{ required "postgres.databaseURL is required when postgres.createSecret=true" .Values.postgres.databaseURL | quote }}
{{- end }}
