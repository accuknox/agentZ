{{- if .Values.relay.enabled }}
{{- if not .Values.spire.enabled }}
{{- fail "relay.enabled requires spire.enabled" }}
{{- end }}
{{- if not .Values.gateway.config.relayAddress }}
{{- fail "relay.enabled requires gateway.config.relayAddress (the relay internal Service on port 9444)" }}
{{- end }}
{{- if ne .Values.gateway.config.relayTrustDomain .Values.spire.trustDomain }}
{{- fail "gateway.config.relayTrustDomain must match spire.trustDomain" }}
{{- end }}
{{- $name := printf "%s-relay" .Release.Name }}
{{- $sa := default $name .Values.relay.serviceAccountName }}
{{- $gateway := include "agentz.gatewayFullname" . }}
{{- $gatewayURL := default (printf "http://%s.%s.svc.cluster.local:%v" $gateway .Release.Namespace .Values.gateway.service.port) .Values.relay.config.gatewayURL }}
{{- $trace := default (printf "%s-observer.%s.svc.cluster.local:4317" .Release.Name .Release.Namespace) .Values.relay.config.agentTraceEndpoint }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
rules:
  - apiGroups: ["agentz.accuknox.com"]
    resources: ["agents", "sandboxes", "mcpconnections", "inferencepools", "inferenceproviders", "workspaces", "skills", "tenants", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["agentz.accuknox.com"]
    resources: ["agents/status"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.relay.config.proxyCASecretName | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: relay
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: control
      port: 9444
      targetPort: control
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-hosts" $name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.relay.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.relay.service.type }}
  selector:
    app.kubernetes.io/name: relay
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: hosts
      port: 9443
      targetPort: hosts
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  serviceName: {{ $name }}
  selector:
    matchLabels:
      app.kubernetes.io/name: relay
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: relay
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ $sa }}
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: "{{ .Values.relay.image.repository }}{{ if .Values.relay.image.digest }}@{{ .Values.relay.image.digest }}{{ else }}:{{ .Values.relay.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.relay.image.pullPolicy }}
          command: ["/agentz"]
          args:
            - relay
            - serve
            - --addr=:9443
            - --control-addr=:9444
            - --health-addr=:8082
            - --spire-address={{ .Release.Name }}-spire:8081
            - --spire-public-address={{ required "spire.publicAddress is required" .Values.spire.publicAddress }}
            - --public-address={{ required "relay.publicAddress is required" .Values.relay.publicAddress }}
            - --trust-domain={{ .Values.spire.trustDomain }}
            - --identity-cert=/etc/agentz/identity/tls.crt
            - --identity-key=/etc/agentz/identity/tls.key
            - --trust-bundle=/etc/agentz/identity/ca.crt
            - --gateway-url={{ $gatewayURL }}
            - --internal-k8s-token-audience={{ .Values.relay.config.internalK8sTokenAudience }}
            - --proxy-ca-secret-name={{ .Values.relay.config.proxyCASecretName }}
            - --proxy-ca-secret-key={{ .Values.relay.config.proxyCASecretKey }}
            - --agent-trace-endpoint={{ $trace }}
            - --postgres-dsn=$(AGENTZ_POSTGRES_DSN)
            - --skills-s3-endpoint={{ required "relay.config.skillsS3Endpoint is required" .Values.relay.config.skillsS3Endpoint }}
            - --skills-s3-region={{ .Values.relay.config.skillsS3Region }}
            - --skills-s3-bucket={{ required "relay.config.skillsS3Bucket is required" .Values.relay.config.skillsS3Bucket }}
          env:
            {{- range $key := list "AGENTZ_POSTGRES_DSN" "AGENTZ_SKILLS_S3_ACCESS_KEY_ID" "AGENTZ_SKILLS_S3_SECRET_ACCESS_KEY" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.secretName }}
                  key: {{ $key }}
            {{- end }}
          ports:
            - name: hosts
              containerPort: 9443
            - name: control
              containerPort: 9444
            - name: health
              containerPort: 8082
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.relay.resources | nindent 12 }}
          volumeMounts:
            - name: identity
              mountPath: /etc/agentz/identity
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: identity
          secret:
            secretName: {{ $name }}-identity
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
      {{- with .Values.relay.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.relay.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.relay.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
