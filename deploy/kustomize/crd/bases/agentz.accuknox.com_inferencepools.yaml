apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: inferencepools.agentz.accuknox.com
spec:
  group: agentz.accuknox.com
  names:
    kind: InferencePool
    listKind: InferencePoolList
    plural: inferencepools
    shortNames:
    - ipl
    singular: inferencepool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Control-plane state
      jsonPath: .status.state
      name: State
      type: string
    - description: Automatic failover
      jsonPath: .spec.automaticFailover
      name: Failover
      type: boolean
    - description: Age of the Pool
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: InferencePool is one tenant-scoped logical model with ordered fallbacks.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired Pool membership and routing behavior.
            properties:
              automaticFailover:
                description: AutomaticFailover enables passive health eviction between priority groups.
                type: boolean
              creatorUserID:
                description: |-
                  CreatorUserID is the immutable Better Auth User ID that created the
                  InferencePool.
                maxLength: 128
                minLength: 1
                type: string
              displayName:
                description: DisplayName is the editable human-readable Pool label.
                maxLength: 128
                minLength: 1
                type: string
              members:
                description: Members is the ordered provider-model fallback chain.
                items:
                  description: InferencePoolMember references one enabled model on a provider.
                  properties:
                    model:
                      description: Model is the exact upstream model identifier.
                      maxLength: 512
                      minLength: 1
                      type: string
                    provider:
                      description: Provider is the immutable InferenceProvider metadata name.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    scope:
                      description: Scope selects the current Organisation or Workspace namespace.
                      enum:
                      - Organisation
                      - Workspace
                      type: string
                  required:
                  - model
                  - provider
                  - scope
                  type: object
                maxItems: 8
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
            required:
            - automaticFailover
            - displayName
            - members
            type: object
            x-kubernetes-validations:
            - message: pool members must be unique scoped provider-model references
              rule: self.members.all(m, self.members.exists_one(n, n.scope == m.scope && n.provider == m.provider && n.model == m.model))
            - message: creatorUserID is immutable
              rule: '!has(oldSelf.creatorUserID) || (has(self.creatorUserID) && self.creatorUserID == oldSelf.creatorUserID)'
          status:
            description: Status describes derived readiness and compatibility.
            properties:
              conditions:
                description: Conditions represent Pool readiness dimensions.
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              contract:
                description: Contract is the conservative intersection of all members.
                properties:
                  api:
                    description: API is the request format accepted by every member.
                    enum:
                    - ChatCompletions
                    - Responses
                    - Messages
                    type: string
                  capabilities:
                    description: Capabilities contains features supported by every member.
                    properties:
                      attachment:
                        description: Attachment reports whether file attachments are supported.
                        type: boolean
                      reasoning:
                        description: Reasoning reports whether reasoning controls are supported.
                        type: boolean
                      temperature:
                        description: Temperature reports whether temperature controls are supported.
                        type: boolean
                      toolCall:
                        description: ToolCall reports whether tool calls are supported.
                        type: boolean
                    required:
                    - attachment
                    - reasoning
                    - temperature
                    - toolCall
                    type: object
                  limits:
                    description: Limits contains the minimum safe token limits across members.
                    properties:
                      context:
                        description: Context is the total context-window size.
                        format: int32
                        maximum: 2147483647
                        minimum: 1
                        type: integer
                      input:
                        description: Input is the optional maximum input-token count.
                        format: int32
                        maximum: 2147483647
                        minimum: 1
                        type: integer
                      output:
                        description: Output is the maximum output-token count.
                        format: int32
                        maximum: 2147483647
                        minimum: 1
                        type: integer
                    required:
                    - context
                    - output
                    type: object
                  modalities:
                    description: Modalities contains media supported by every member.
                    properties:
                      input:
                        description: Input lists supported input media.
                        items:
                          description: InferenceModelModality describes input and output media understood by OpenCode.
                          enum:
                          - text
                          - audio
                          - image
                          - video
                          - pdf
                          type: string
                        maxItems: 5
                        minItems: 1
                        type: array
                        x-kubernetes-list-type: set
                      output:
                        description: Output lists supported output media.
                        items:
                          description: InferenceModelModality describes input and output media understood by OpenCode.
                          enum:
                          - text
                          - audio
                          - image
                          - video
                          - pdf
                          type: string
                        maxItems: 5
                        minItems: 1
                        type: array
                        x-kubernetes-list-type: set
                    required:
                    - input
                    - output
                    type: object
                required:
                - api
                - capabilities
                - limits
                - modalities
                type: object
              members:
                description: Members preserves desired order while reporting readiness.
                items:
                  description: InferencePoolMemberStatus reports one member's control-plane readiness.
                  properties:
                    message:
                      description: Message provides human-readable readiness detail.
                      type: string
                    model:
                      description: Model is the referenced upstream model ID.
                      type: string
                    protocol:
                      description: Protocol is the member's request family.
                      enum:
                      - OpenAI
                      - Anthropic
                      type: string
                    provider:
                      description: Provider is the referenced InferenceProvider name.
                      type: string
                    ready:
                      description: Ready reports whether the referenced Provider is Ready.
                      type: boolean
                    reason:
                      description: Reason is a stable readiness reason.
                      type: string
                    scope:
                      description: Scope identifies the referenced provider's infrastructure scope.
                      enum:
                      - Organisation
                      - Workspace
                      type: string
                  required:
                  - message
                  - model
                  - protocol
                  - provider
                  - ready
                  - reason
                  - scope
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              observedGeneration:
                description: ObservedGeneration is the latest reconciled generation.
                format: int64
                type: integer
              protocol:
                description: Protocol is the primary member's request family.
                enum:
                - OpenAI
                - Anthropic
                type: string
              state:
                description: State summarizes accepted, ready, partially degraded, or degraded state.
                enum:
                - Accepted
                - Ready
                - PartiallyDegraded
                - Degraded
                type: string
              warnings:
                description: Warnings contains non-degrading compatibility limitations.
                items:
                  description: InferencePoolWarning describes a non-degrading compatibility limitation.
                  properties:
                    code:
                      description: Code is the stable machine-readable warning identity.
                      enum:
                      - MixedProtocols
                      type: string
                    message:
                      description: Message explains the compatibility limitation.
                      type: string
                  required:
                  - code
                  - message
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - code
                x-kubernetes-list-type: map
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
