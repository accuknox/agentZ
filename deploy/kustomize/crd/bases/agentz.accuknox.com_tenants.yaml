                        x-kubernetes-int-or-string: true
                      returnedCellsPerHour:
                        description: ReturnedCellsPerHour limits cells returned in this Tenant per hour.
                        format: int64
                        minimum: 1
                        type: integer
                      timeout:
                        description: Timeout limits PostgreSQL execution time for one query.
