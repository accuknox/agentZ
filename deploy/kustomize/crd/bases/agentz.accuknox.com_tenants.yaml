                    required:
                    - cellsPerRequest
                    - concurrentRequests
                    - pointsPerSeries
                    - requestsPerMinutePerUser
                    - responseBytes
                    - returnedCellsPerHour
                    - timeout
                    type: object
                  widgetsPerDashboard:
                    description: WidgetsPerDashboard is the maximum number of widgets in one dashboard.
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - dashboardsPerAgent
                - publish
                - query
                - widgetsPerDashboard
