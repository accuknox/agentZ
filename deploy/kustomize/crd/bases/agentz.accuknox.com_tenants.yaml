                    - recordsPerRequest
                    - requestBytes
                    - requestsPerMinutePerAgent
                    - retainedTemporalRecords
                    - temporalRecordsPerDay
                    type: object
                  query:
                    description: Query limits dashboard reads.
                    properties:
                      cellsPerRequest:
                        description: CellsPerRequest limits cells returned by one query.
                        format: int32
                        minimum: 1
                        type: integer
                      concurrentRequests:
                        description: ConcurrentRequests limits active dashboard queries in this Tenant.
                        format: int32
                        minimum: 1
                        type: integer
                      pointsPerSeries:
                        description: PointsPerSeries limits returned points for one chart series.
                        format: int32
                        minimum: 1
                        type: integer
                      requestsPerMinutePerUser:
                        description: RequestsPerMinutePerUser limits query attempts by one user.
                        format: int32
                        minimum: 1
                        type: integer
                      responseBytes:
