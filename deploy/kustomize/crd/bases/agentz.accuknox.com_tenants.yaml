                        - type: integer
                        - type: string
                        description: RequestBytes is the maximum JSON request size.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      requestsPerMinutePerAgent:
                        description: RequestsPerMinutePerAgent limits publish attempts by one Agent.
                        format: int32
                        minimum: 1
                        type: integer
                      retainedTemporalRecords:
                        description: RetainedTemporalRecords limits temporal records retained in this Tenant.
                        format: int64
                        minimum: 1
                        type: integer
                      temporalRecordsPerDay:
                        description: TemporalRecordsPerDay limits temporal records accepted from one Agent per day.
                        format: int64
                        minimum: 1
                        type: integer
                    required:
