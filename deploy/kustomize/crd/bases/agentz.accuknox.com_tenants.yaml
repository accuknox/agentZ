    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Tenant is the Schema for the tenants API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Tenant.
            properties:
              agentQuota:
                description: |-
                  AgentQuota limits aggregate Agent allocations across every Workspace in
                  this Organisation. Defaults are copied to new Agents and never change
                  existing Agent resources.
                properties:
                  count:
                    description: Count is the maximum number of Agents across the Organisation.
                    format: int32
                    minimum: 1
                    type: integer
                  defaults:
                    description: Defaults is copied to Agents created without explicit resources.
                    properties:
                      qosClass:
                        description: QoSClass determines how Resources are written to a new Agent.
                        enum:
                        - Guaranteed
                        - Burstable
                        - BestEffort
                        type: string
                      resources:
                        description: Resources is the default whole-Pod CPU and memory allocation.
                        properties:
                          cpu:
                            anyOf:
                            - type: integer
                            - type: string
                            description: CPU is measured in Kubernetes CPU units.
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
