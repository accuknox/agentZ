apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: agentz
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: agentz
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: agentz
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: agentz
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /agentz
        args:
        - manager
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --workflowrun-orphan-retention=168h
        - --controller-image=controller:latest
        - --gateway-url=http://gateway.agentz-system.svc.cluster.local:8090
        - --agentgateway-trace-mode=service
        - --agentgateway-trace-service-name=observer
        - --agentgateway-trace-service-namespace=agentz-system
        - --agentgateway-trace-service-port=4317
        - --manager-gateway-token-path=/var/run/secrets/agentz/gateway/token
        - --manager-gateway-token-audience=agentz-gateway
        - --manager-service-account-name=controller-manager
        - --manager-service-account-namespace=system
        - --nix-store-pvc=nix-store
        - --tenant-nix-store-size=5Gi
        - --tenant-nix-store-access-mode=ReadWriteOnce
        - --skills-s3-endpoint=http://rustfs.rustfs.svc.cluster.local:9000
        - --skills-s3-region=us-east-1
        - --skills-s3-bucket=agentz
        - --tenant-sinjector-clusterissuer-name=selfsigned
        env:
        - name: AGENTZ_SKILLS_S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: agentz-skills-s3
              key: access-key-id
        - name: AGENTZ_SKILLS_S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: agentz-skills-s3
              key: secret-access-key
        image: controller:latest
        name: manager
        ports: []
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts:
        - mountPath: /var/run/secrets/agentz/gateway
          name: gateway-token
          readOnly: true
      volumes:
      - name: gateway-token
        projected:
          sources:
          - serviceAccountToken:
              audience: agentz-gateway
              expirationSeconds: 3600
              path: token
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
