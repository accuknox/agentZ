apiVersion: agentz.accuknox.com/v1alpha1
kind: MCPConnection
metadata:
  labels:
    app.kubernetes.io/name: agentz
    app.kubernetes.io/managed-by: kustomize
  name: slack
spec:
  endpoint:
    url: https://example.com/mcp
    timeout: 30s
    headers:
      x-workspace: demo
  auth:
    bearer:
      secretRef:
        path: secret/data/demo/slack/bearer
        key: authorization
