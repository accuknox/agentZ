apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-clawarmor-accuknox-com-v1alpha1-agent
  failurePolicy: Fail
  name: magent-v1alpha1.kb.io
  rules:
  - apiGroups:
    - clawarmor.accuknox.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - agents
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-clawarmor-accuknox-com-v1alpha1-environment
