syntax = "proto3";

package accuknox.clawarmor.agent.gateway.v1;

option go_package = "github.com/accuknox/clawarmor/internal/agent/gateway/proto;gatewaypb";

service AgentGatewayService {
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc SubscribeSession(SubscribeSessionRequest) returns (stream SessionStreamEvent);
  rpc InterruptSession(InterruptSessionRequest) returns (InterruptSessionResponse);
  rpc CompactSession(CompactSessionRequest) returns (CompactSessionResponse);
  rpc ListAgentStatus(ListAgentStatusRequest) returns (ListAgentStatusResponse);
  rpc WatchAgentStatus(WatchAgentStatusRequest) returns (stream WatchAgentStatusResponse);
}

message SendMessageRequest {
  string session_id = 1;
  string prompt = 2;
}

message SendMessageResponse {
  string session_id = 1;
  string run_id = 2;
  string request_id = 3;
}

message SubscribeSessionRequest {
  string session_id = 1;
}

message SessionStreamEvent {
  int64 sequence = 1;
  string session_id = 2;
  string run_id = 3;
  string request_id = 4;
  EventType type = 5;
  string content = 6;
  string tool_name = 7;
  string tool_payload = 8;
  string error = 9;
}

message InterruptSessionRequest {
  string session_id = 1;
}

message InterruptSessionResponse {
  bool interrupted = 1;
}

message CompactSessionRequest {
  string session_id = 1;
}

message CompactSessionResponse {
  string message = 1;
}

message ListAgentStatusRequest {
  repeated string session_ids = 1;
}

message ListAgentStatusResponse {
  repeated AgentStatus statuses = 1;
}

message WatchAgentStatusRequest {
  repeated string session_ids = 1;
}

message WatchAgentStatusResponse {
  repeated AgentStatus statuses = 1;
}

message AgentStatus {
  string session_id = 1;
  string agent_name = 2;
  string namespace = 3;
  AgentPhase phase = 4;
  string reason = 5;
  string message = 6;
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_RUN_STARTED = 1;
  EVENT_TYPE_ASSISTANT_DELTA = 2;
  EVENT_TYPE_ASSISTANT_MESSAGE = 3;
  EVENT_TYPE_TOOL_CALL = 4;
  EVENT_TYPE_TOOL_RESULT = 5;
  EVENT_TYPE_RUN_COMPLETED = 6;
  EVENT_TYPE_RUN_INTERRUPTED = 7;
  EVENT_TYPE_RUN_ERROR = 8;
}

enum AgentPhase {
  AGENT_PHASE_UNSPECIFIED = 0;
  AGENT_PHASE_READY = 1;
  AGENT_PHASE_PROGRESSING = 2;
  AGENT_PHASE_DEGRADED = 3;
  AGENT_PHASE_NOT_FOUND = 4;
}
