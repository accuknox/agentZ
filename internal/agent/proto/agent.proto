syntax = "proto3";

package accuknox.clawarmor.agent.v1;

option go_package = "github.com/accuknox/clawarmor/internal/agent/proto;agentpb";

import "google/protobuf/empty.proto";

service AgentService {
  rpc SendUserMessage(SendUserMessageRequest) returns (SendUserMessageResponse);
  rpc StreamRun(StreamRunRequest) returns (stream AgentEvent);
  rpc Interrupt(InterruptRequest) returns (InterruptResponse);
  rpc Compact(CompactRequest) returns (CompactResponse);
  rpc GetActiveRunStatus(google.protobuf.Empty) returns (GetActiveRunStatusResponse);
}

message SendUserMessageRequest {
  string prompt = 1;
}

message SendUserMessageResponse {
  string session_id = 1;
  string run_id = 2;
  string request_id = 3;
}

message StreamRunRequest {
  string run_id = 1;
}

message InterruptRequest {
  string run_id = 1;
}

message InterruptResponse {
  bool interrupted = 1;
}

message CompactRequest {}

message CompactResponse {
  string message = 1;
}

message GetActiveRunStatusResponse {
  RunStatus status = 1;
}

message RunStatus {
  string session_id = 1;
  string run_id = 2;
  string request_id = 3;
  RunState state = 4;
  string error = 5;
}

enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_RUNNING = 1;
  RUN_STATE_COMPLETED = 2;
  RUN_STATE_INTERRUPTED = 3;
  RUN_STATE_FAILED = 4;
}

message AgentEvent {
  string session_id = 1;
  string run_id = 2;
  string request_id = 3;
  EventType type = 4;
  string content = 5;
  string tool_name = 6;
  string tool_payload = 7;
  string error = 8;
  string reasoning_content = 9;
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_RUN_STARTED = 1;
  EVENT_TYPE_ASSISTANT_DELTA = 2;
  EVENT_TYPE_ASSISTANT_MESSAGE = 3;
  EVENT_TYPE_TOOL_CALL = 4;
  EVENT_TYPE_TOOL_RESULT = 5;
  EVENT_TYPE_RUN_COMPLETED = 6;
  EVENT_TYPE_RUN_INTERRUPTED = 7;
  EVENT_TYPE_RUN_ERROR = 8;
}
