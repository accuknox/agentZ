syntax = "proto3";
package agentz.compute.v1;
option go_package = "github.com/accuknox/agentz/internal/compute/proto;computev1";

// Compute accepts only outbound connections initiated by enrolled hosts.
service Compute {
  rpc Control(stream Heartbeat) returns (stream Command);
  rpc Data(stream DataFrame) returns (stream DataFrame);
  rpc Forward(stream DataFrame) returns (stream DataFrame);
}
message Heartbeat {
  string generation = 1;
  bool ready = 2;
  string error = 3;
  string version = 4;
  string work_directory = 5;
  string hostname = 6;
}
message Command {
  oneof body {
    Runtime runtime = 1;
    Open open = 2;
  }
}
// Runtime is compiled by the backend. Configuration is not a shell program.
message Runtime {
  string generation = 1;
  bytes configuration = 2;
}
message Open {
  string id = 1;
  Service service = 2;
}
enum Service {
  SERVICE_UNSPECIFIED = 0;
  SERVICE_OPENCODE = 1;
  SERVICE_FILESYSTEM = 2;
  SERVICE_MCP = 3;
  SERVICE_INFERENCE = 4;
  SERVICE_SECRET_PROXY = 5;
  SERVICE_PLATFORM = 6;
  reserved 7;
  reserved "SERVICE_GIT";
  SERVICE_TELEMETRY = 8;
  SERVICE_TRACES = 9;
}
// The first client frame identifies the pending connection. Subsequent frames
// contain at most 32 KiB. There is no replay or resumable byte-stream contract.
message DataFrame {
  string id = 1;
  bytes data = 2;
  string error = 3;
  Service service = 4;
}
