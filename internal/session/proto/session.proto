syntax = "proto3";

package accuknox.clawarmor.session.v1;

option go_package = "github.com/accuknox/clawarmor/internal/session/proto;sessionpb";

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

service SessionService {
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc GetChatHistory(GetChatHistoryRequest) returns (GetChatHistoryResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc DeleteSession(DeleteSessionRequest) returns (google.protobuf.Empty);
  rpc AppendEvent(AppendEventRequest) returns (AppendEventResponse);
  rpc UpdateSessionState(UpdateSessionStateRequest) returns (google.protobuf.Empty);
  rpc DeleteSessionState(DeleteSessionStateRequest) returns (google.protobuf.Empty);
  rpc ListSessionStates(ListSessionStatesRequest) returns (ListSessionStatesResponse);
  rpc UpsertSessionSummary(UpsertSessionSummaryRequest) returns (google.protobuf.Empty);
  rpc ListSessionSummaries(ListSessionSummariesRequest) returns (ListSessionSummariesResponse);
}

message SessionMeta {
  string session_id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp updated_at = 3;
  string agent_name = 4;
}

message StateEntry {
  string key = 1;
  bytes value = 2;
}

message SessionEvent {
  int64 seq = 1;
  string event_id = 2;
  google.protobuf.Timestamp event_ts = 3;
  google.protobuf.Struct payload = 4;
}

message SessionSummary {
  string filter_key = 1;
  string summary = 2;
  repeated string topics = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message CreateSessionRequest {
  string session_id = 1;
  string agent_name = 2;
}

message CreateSessionResponse {
  SessionMeta session = 1;
}

message GetSessionRequest {
  string session_id = 1;
  int32 event_num = 2;
  google.protobuf.Timestamp event_time = 3;
  int64 event_page_before_seq = 4;
  int32 event_page_limit = 5;
}

message GetSessionResponse {
  SessionMeta session = 1;
  repeated StateEntry session_states = 2;
  repeated SessionEvent events = 3;
  repeated SessionSummary summaries = 4;
}

message ChatToolCall {
  string id = 1;
  string name = 2;
  string arguments = 3;
}

message ChatHistoryItem {
  int64 seq = 1;
  string event_id = 2;
  google.protobuf.Timestamp event_ts = 3;
  string request_id = 4;
  string invocation_id = 5;
  string author = 6;
  string role = 7;
  string content = 8;
  string reasoning_content = 9;
  repeated ChatToolCall tool_calls = 10;
  string tool_call_id = 11;
  string tool_name = 12;
  string error = 13;
}

message GetChatHistoryRequest {
  string session_id = 1;
  int32 page_size = 2;
  int64 before_seq = 3;
}

message GetChatHistoryResponse {
  repeated ChatHistoryItem items = 1;
  int64 next_before_seq = 2;
  bool has_more = 3;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated SessionMeta sessions = 1;
}

message DeleteSessionRequest {
  string session_id = 1;
}

message AppendEventRequest {
  string session_id = 1;
  SessionEvent event = 2;
}

message AppendEventResponse {
  SessionEvent event = 1;
}

message UpdateSessionStateRequest {
  string session_id = 1;
  repeated StateEntry entries = 2;
}

message DeleteSessionStateRequest {
  string session_id = 1;
  string key = 2;
}

message ListSessionStatesRequest {
  string session_id = 1;
}

message ListSessionStatesResponse {
  repeated StateEntry entries = 1;
}

message UpsertSessionSummaryRequest {
  string session_id = 1;
  SessionSummary summary = 2;
}

message ListSessionSummariesRequest {
  string session_id = 1;
}

message ListSessionSummariesResponse {
  repeated SessionSummary summaries = 1;
}
