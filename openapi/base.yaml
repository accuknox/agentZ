        scope:
          $ref: '#/components/schemas/ResourceScope'
        endpoint:
          $ref: '#/components/schemas/MCPConnectionEndpoint'
        auth:
          $ref: '#/components/schemas/MCPConnectionAuth'
        created_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/MCPConnectionLifecycle'
        reason:
          $ref: '#/components/schemas/MCPConnectionReason'
        message:
          type: string
        tool_catalog_ready:
          type: boolean
        tools:
          type: array
          items:
            $ref: '#/components/schemas/MCPConnectionTool'
      required: [name, scope, endpoint, auth, created_at, status, reason, message, tool_catalog_ready, tools, can_delete]

    MCPConnectionSummary:
      type: object
      additionalProperties: false
      properties:
        can_delete:
          type: boolean
          description: Whether the current principal may delete this connection in the selected scope.
        name:
          $ref: '#/components/schemas/MCPConnectionName'
        scope:
          $ref: '#/components/schemas/ResourceScope'
        auth_mode:
          type: string
        endpoint_url:
          type: string
        created_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/MCPConnectionLifecycle'
        reason:
          $ref: '#/components/schemas/MCPConnectionReason'
        message:
          type: string
        tool_catalog_ready:
