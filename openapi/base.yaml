          minimum: 0
      required: [name, scope, auth_mode, endpoint_url, created_at, status, reason, message, tool_catalog_ready, tool_count, can_delete]

    MCPConnectionEndpoint:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          minLength: 1
        timeout:
          type: string
          minLength: 1
        insecure_skip_verify:
          type: boolean
        headers:
          type: object
          additionalProperties:
            type: string
      required: [url, insecure_skip_verify, headers]

    MCPConnectionAuth:
      type: object
      additionalProperties: false
      properties:
        bearer:
          $ref: '#/components/schemas/MCPConnectionBearerAuth'
        oauth:
          $ref: '#/components/schemas/MCPConnectionOAuthAuth'

    MCPConnectionBearerAuth:
      type: object
      additionalProperties: false
      properties:
        location:
          $ref: '#/components/schemas/MCPConnectionAuthLocation'

    MCPConnectionOAuthAuth:
      type: object
      additionalProperties: false
      properties:
        issuer:
          type: string
        authorization_endpoint:
          type: string
        token_endpoint:
          type: string
        registration_endpoint:
          type: string
        resource:
          type: string
        scopes:
          type: array
          items:
            type: string
            minLength: 1
        location:
          $ref: '#/components/schemas/MCPConnectionAuthLocation'

    MCPConnectionAuthLocation:
      type: object
      additionalProperties: false
      properties:
        header:
          $ref: '#/components/schemas/MCPConnectionHeaderLocation'
        query_parameter:
          $ref: '#/components/schemas/MCPConnectionQueryParameterLocation'
        cookie:
