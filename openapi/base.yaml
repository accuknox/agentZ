openapi: 3.0.3
info:
  title: AgentZ HTTP API
  version: 0.1.0
  description: HTTP API for AgentZ agents, lens, secrets, and sandboxes.
servers:
- url: /
  description: Current origin
security:
- GatewayBearer: []
tags:
- name: agents
  description: Agent lifecycle and status APIs.
- name: tenants
  description: Tenant bootstrap and readiness APIs.
- name: workspaces
  description: Workspace provisioning and navigation APIs.
- name: event-trail
  description: Organisation event trail investigation APIs.
- name: lens
  description: Trace, span, and OS observability APIs.
- name: secrets
  description: Session secret management APIs.
- name: sandboxes
  description: Sandbox resource management APIs.
- name: inference
  description: Tenant inference provider, model, and pool APIs.
- name: skills
  description: Immutable skill catalog and attachment APIs.
- name: mcp-connections
  description: MCPConnection resource and credential management APIs.
- name: workflows
  description: Workflow definition management APIs.
- name: workflow-schedules
  description: Workflow schedule management APIs.
- name: workflow-runs
  description: Workflow run browsing and status APIs.
- name: workflow-webhooks
  description: Workflow webhook invocation and trigger listing APIs.

paths:
  /api/event-trail-event:
    get:
      operationId: listEventTrailEvents
      summary: List Organisation event trail events.
      description: >
        Lists rolling event trail history in the selected scope. An active
        Superadmin may read Organisation-wide or Workspace events; an active
        Workspace Admin may read only the Workspace bound into the bearer.
      tags: [event-trail]
      parameters:
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      - $ref: '#/components/parameters/EventTrailActorTypeQuery'
      - $ref: '#/components/parameters/EventTrailActorIDQuery'
      - $ref: '#/components/parameters/EventTrailCategoryQuery'
      - $ref: '#/components/parameters/EventTrailWorkspaceIDQuery'
      - $ref: '#/components/parameters/EventTrailTargetTypeQuery'
      - $ref: '#/components/parameters/EventTrailResultQuery'
      - $ref: '#/components/parameters/EventTrailCreatedAfterQuery'
      - $ref: '#/components/parameters/EventTrailCreatedBeforeQuery'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated scoped event trail events and filter options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEventTrailEventsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/event-trail-event/{eventId}:
    get:
      operationId: getEventTrailEvent
      summary: Get an Organisation event trail event.
      description: >
        Returns one event from the selected scope's rolling event trail history.
        Workspace Admins are restricted to the Workspace bound into the
        bearer; Superadmins may read Organisation-wide events.
      tags: [event-trail]
      parameters:
      - $ref: '#/components/parameters/EventTrailEventIDPath'
      - $ref: '#/components/parameters/WorkspaceIDHeader'
      responses:
        '200':
          description: Scoped event trail event detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTrailEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/tenant:
    get:
      operationId: getTenant
      summary: Get the current tenant bootstrap state.
      tags: [tenants]
      responses:
        '200':
          description: Tenant bootstrap state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: ensureTenant
      summary: Create the current tenant resource when missing.
      description: >
        Ensures a Tenant custom resource exists for the bearer token's active
        Better Auth organization. The request returns immediately with the
        current bootstrap state and does not wait for the tenant to become
        ready.
      tags: [tenants]
      responses:
        '200':
          description: Tenant exists and current bootstrap state is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workspace:
    get:
      operationId: listWorkspaces
      summary: List accessible Workspaces.
      description: >
        Lists nondeleted Workspaces accessible to the current active
        Organisation membership. Superadmins receive every Workspace.
      tags: [workspaces]
      responses:
        '200':
          description: Accessible Workspaces and navigation capabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkspacesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createWorkspace
      summary: Create a Workspace.
      description: >
        Creates the complete relational Workspace aggregate and starts
        cluster provisioning. Only an active Superadmin may create a
        Workspace or assign its initial Workspace Admins.
      tags: [workspaces]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '201':
          description: Workspace creation was accepted for provisioning.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workspace/member-candidate:
    get:
      operationId: listWorkspaceMemberCandidates
      summary: List eligible initial Workspace Admins.
      description: >
        Lists active, non-Superadmin members of the current Organisation.
        Only an active Superadmin may inspect the candidates.
      tags: [workspaces]
      responses:
        '200':
          description: Eligible Workspace Admin candidates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkspaceMemberCandidatesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workspace/slug/{workspaceSlug}:
    get:
      operationId: resolveWorkspaceSlug
      summary: Resolve an accessible Workspace slug.
      description: >
        Resolves current and historical slugs inside the active Organisation
        without exposing inaccessible Workspace identity.
      tags: [workspaces]
      parameters:
      - $ref: '#/components/parameters/WorkspaceSlugPath'
      responses:
        '200':
          description: Accessible Workspace and canonical slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workspace/{workspaceId}:
    get:
      operationId: getWorkspace
      summary: Get an accessible Workspace.
      tags: [workspaces]
      parameters:
      - $ref: '#/components/parameters/WorkspaceIDPath'
      responses:
        '200':
          description: Accessible Workspace lifecycle state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workspace/{workspaceId}/inherited-resource/{resourceType}:
    get:
      operationId: listWorkspaceInheritedResources
      summary: List Organisation resources available for Workspace inheritance.
      description: Only an active Superadmin may browse and manage inheritance.
      tags: [workspaces]
      parameters:
      - $ref: '#/components/parameters/WorkspaceIDPath'
      - $ref: '#/components/parameters/InheritedResourceTypePath'
      responses:
        '200':
          description: Organisation resource selection state and consumers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkspaceInheritedResourcesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: replaceWorkspaceInheritedResources
      summary: Replace one type of explicitly inherited Organisation resource.
      description: Consumed resources cannot be unselected.
      tags: [workspaces]
      parameters:
      - $ref: '#/components/parameters/WorkspaceIDPath'
      - $ref: '#/components/parameters/InheritedResourceTypePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceWorkspaceInheritedResourcesRequest'
      responses:
        '200':
          description: Updated Organisation resource selection state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkspaceInheritedResourcesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workspace/{workspaceId}/retry:
    post:
      operationId: retryWorkspace
      summary: Retry failed Workspace provisioning.
      description: Only an active Superadmin may retry a failed Workspace.
      tags: [workspaces]
      parameters:
      - $ref: '#/components/parameters/WorkspaceIDPath'
      responses:
        '200':
          description: Workspace returned to provisioning.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workspace/{workspaceId}/lifecycle:
    patch:
      operationId: updateWorkspaceLifecycle
      summary: Record observed Workspace lifecycle state.
      description: >
        Accepts a controller-observed terminal state for the current
        provisioning attempt. Stale attempts cannot overwrite current state.
      tags: [workspaces]
      parameters:
      - $ref: '#/components/parameters/WorkspaceIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceLifecycleRequest'
      responses:
        '204':
          description: Lifecycle observation recorded or already current.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/agent:
    get:
      operationId: listAgents
      summary: List paginated agent summaries.
      tags: [agents]
      parameters:
      - $ref: '#/components/parameters/AgentNameFilterQuery'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated agent summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAgentsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createAgent
      summary: Create an Agent resource.
      description: >
        Creates an agent record and Agent custom resource. The request returns
        after the Agent resource is created and does not wait for the Agent to
        become ready.
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '201':
          description: Agent resource created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/agent/{agentName}:
    put:
      operationId: updateAgent
      summary: Update an Agent resource.
      description: >
        Updates mutable Agent fields for an existing Agent. The agent name in
        the path identifies the Agent and is immutable.
      tags: [agents]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '200':
          description: Agent resource updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteAgent
      summary: Delete an Agent resource.
      tags: [agents]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      responses:
        '204':
          description: Agent was deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/agent/watch:
    post:
      operationId: watchAgents
      summary: Watch agent status changes.
      description: >
        Returns an SSE stream. Each event data payload is a JSON object matching
        WatchAgentsEvent. If agent_names is omitted or empty, all known agents
        are watched.
      tags: [agents]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchAgentsRequest'
      responses:
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '200':
          description: Stream of agent status changes.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/WatchAgentsEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/agent/{agentName}/fs/file:
    get:
      operationId: readAgentFile
      summary: Read a text file from the agent workspace.
      tags: [agents]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - $ref: '#/components/parameters/FilePathQuery'
      responses:
        '200':
          description: File content and metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentFile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createAgentFile
      summary: Create an empty file in the agent workspace.
      tags: [agents]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentFileRequest'
      responses:
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '201':
          description: File created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentFileMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: writeAgentFile
      summary: Atomically write a text file in the agent workspace.
      tags: [agents]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteAgentFileRequest'
      responses:
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '200':
          description: File written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentFileMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: File changed since it was read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentFileConflict'
        '413':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/agent/{agentName}/fs/stat:
    get:
      operationId: statAgentFile
      summary: Read agent workspace entry metadata.
      tags: [agents]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - $ref: '#/components/parameters/FilePathQuery'
      responses:
        '200':
          description: Entry metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentFileMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/agent/{agentName}/fs/raw:
    get:
      operationId: readAgentFileRaw
      summary: Stream an agent workspace file without text decoding.
      tags: [agents]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - $ref: '#/components/parameters/FilePathQuery'
      responses:
        '200':
          description: Raw file content.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: writeAgentFileRaw
      summary: Atomically write an agent workspace file without text encoding.
      tags: [agents]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - $ref: '#/components/parameters/FilePathQuery'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: File written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentFileMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/agent/{agentName}/owner:
    get:
      operationId: getAgentOwner
      summary: Read Agent ownership metadata.
      tags: [agents]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      responses:
        '200':
          description: Agent ownership metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentOwner'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: transferAgentOwner
      summary: Transfer Agent ownership.
      tags: [agents]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferAgentOwnerRequest'
      responses:
        '200':
          description: Agent owner transferred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentOwner'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/agent/{agentName}/share:
    get:
      operationId: listAgentShares
      summary: List Agent Shares.
      tags: [agents]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      responses:
        '200':
          description: Agent Shares for the selected Agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAgentSharesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: upsertAgentShare
      summary: Create or replace an Agent Share.
      description: >
        Creates or replaces one User or Team Agent Share. UseShared grants full
        non-secret Agent and workflow control.
      tags: [agents]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertAgentShareRequest'
      responses:
        '200':
          description: Agent Share created or replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentShare'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/agent/{agentName}/share/{shareId}:
    delete:
      operationId: deleteAgentShare
      summary: Delete an Agent Share.
      tags: [agents]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - $ref: '#/components/parameters/AgentShareIDPath'
      responses:
        '204':
          description: Agent Share deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/agent/{agentName}/fs/directory:
    post:
      operationId: createAgentDirectory
      summary: Create a directory in the agent workspace.
      tags: [agents]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentDirectoryRequest'
      responses:
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '201':
          description: Directory created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentFileMetadata'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/agent/{agentName}/fs/rename:
    post:
