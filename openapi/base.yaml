openapi: 3.0.3
info:
  title: ClawArmor HTTP API
  version: 0.1.0
  description: HTTP API for ClawArmor agents, lens, secrets, and environments.
servers:
- url: /
  description: Current origin
security:
- GatewayBearer: []
tags:
- name: agents
  description: Agent lifecycle and status APIs.
- name: tenants
  description: Tenant bootstrap and readiness APIs.
- name: lens
  description: Trace, span, and OS observability APIs.
- name: secrets
  description: Session secret management APIs.
- name: environments
  description: Environment resource management APIs.
- name: mcp-connections
  description: MCPConnection resource and credential management APIs.
- name: workflows
  description: Workflow definition management APIs.
- name: workflow-schedules
  description: Workflow schedule management APIs.

paths:
  /api/tenant:
    get:
      operationId: getTenant
      summary: Get the current tenant bootstrap state.
      tags: [tenants]
      responses:
        '200':
          description: Tenant bootstrap state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: ensureTenant
      summary: Create the current tenant resource when missing.
      description: >
        Ensures a Tenant custom resource exists for the bearer token's active
        Better Auth organization. The request returns immediately with the
        current bootstrap state and does not wait for the tenant to become
        ready.
      tags: [tenants]
      responses:
        '200':
          description: Tenant exists and current bootstrap state is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/agent:
    get:
      operationId: listAgents
      summary: List paginated agent summaries.
      tags: [agents]
      parameters:
      - $ref: '#/components/parameters/AgentNameFilterQuery'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated agent summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAgentsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createAgent
      summary: Create an Agent resource.
      description: >
        Creates an agent record and Agent custom resource. The request returns
        after the Agent resource is created and does not wait for the Agent to
        become ready.
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        '201':
          description: Agent resource created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/agent/{agentName}:
    put:
      operationId: updateAgent
      summary: Update an Agent resource.
      description: >
        Updates mutable Agent fields for an existing Agent. The agent name in
        the path identifies the Agent and is immutable.
      tags: [agents]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        '200':
          description: Agent resource updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteAgent
      summary: Delete an Agent resource.
      tags: [agents]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      responses:
        '204':
          description: Agent was deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/agent/watch:
    post:
      operationId: watchAgents
      summary: Watch agent status changes.
      description: >
        Returns an SSE stream. Each event data payload is a JSON object matching
        WatchAgentsEvent. If agent_names is omitted or empty, all known agents
        are watched.
      tags: [agents]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchAgentsRequest'
      responses:
        '200':
          description: Stream of agent status changes.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/WatchAgentsEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/lens/{agentName}/{sessionID}/trace:
    get:
      operationId: listTraceSessions
      summary: List paginated per-session trace summaries.
      tags: [lens]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - name: sessionID
        in: path
        required: true
        description: Session identifier scoped to one agent.
        schema:
          type: string
          minLength: 1
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      - $ref: '#/components/parameters/StartedAfterQuery'
      - $ref: '#/components/parameters/StartedBeforeQuery'
      responses:
        '200':
          description: Paginated per-session trace summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTraceSessionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/lens/{agentName}/{sessionID}/trace/{traceID}/span:
    get:
      operationId: listSpans
      summary: List paginated spans for a trace.
      tags: [lens]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - name: sessionID
        in: path
        required: true
        description: Session identifier scoped to one agent.
        schema:
          type: string
          minLength: 1
      - name: traceID
        in: path
        required: true
        description: Trace identifier scoped to one session.
        schema:
          $ref: '#/components/schemas/TraceID'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated spans for a trace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSpansResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/lens/{agentName}/{sessionID}/trace/{traceID}/span/{spanID}:
    get:
      operationId: getSpanDetail
      summary: Get span details and correlated OS observability.
      tags: [lens]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - name: sessionID
        in: path
        required: true
        description: Session identifier scoped to one agent.
        schema:
          type: string
          minLength: 1
      - name: traceID
        in: path
        required: true
        description: Trace identifier scoped to one session.
        schema:
          $ref: '#/components/schemas/TraceID'
      - name: spanID
        in: path
        required: true
        description: Span identifier scoped to one trace.
        schema:
          $ref: '#/components/schemas/SpanID'
      responses:
        '200':
          description: Span detail with payload and correlated events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpanDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/lens/{agentName}/observability/process:
    get:
      operationId: listProcessObservability
      summary: List paginated process observability events.
      tags: [lens]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      - $ref: '#/components/parameters/EventTimeAfterQuery'
      - $ref: '#/components/parameters/EventTimeBeforeQuery'
      - $ref: '#/components/parameters/ActionQuery'
      - $ref: '#/components/parameters/AggregatedQuery'
      responses:
        '200':
          description: Paginated process observability events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProcessObservabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/lens/{agentName}/observability/file:
    get:
      operationId: listFileObservability
      summary: List paginated file observability events.
      tags: [lens]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      - $ref: '#/components/parameters/EventTimeAfterQuery'
      - $ref: '#/components/parameters/EventTimeBeforeQuery'
      - $ref: '#/components/parameters/ActionQuery'
      - $ref: '#/components/parameters/AggregatedQuery'
      responses:
        '200':
          description: Paginated file observability events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFileObservabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/lens/{agentName}/observability/network:
    get:
      operationId: listNetworkObservability
      summary: List paginated network observability events.
      tags: [lens]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      - $ref: '#/components/parameters/EventTimeAfterQuery'
      - $ref: '#/components/parameters/EventTimeBeforeQuery'
      - $ref: '#/components/parameters/ActionQuery'
      - $ref: '#/components/parameters/AggregatedQuery'
      responses:
        '200':
          description: Paginated network observability events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListNetworkObservabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/lens/{agentName}/mcp/graph:
    get:
      operationId: getMCPGraph
      summary: Get MCP observability graph data for one agent and date range.
      tags: [lens]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - $ref: '#/components/parameters/FromDateQuery'
      - $ref: '#/components/parameters/ToDateQuery'
      responses:
        '200':
          description: Graph-ready MCP observability for one agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPGraphResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/secret/{agentName}:
    get:
      operationId: listSecrets
      summary: List secret keys for an agent.
      description: >
        Returns a paginated list of secret keys with created and last modified
        timestamps. Secret values are never included in the response.
      tags: [secrets]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated secret keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSecretsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: putSecret
      summary: Store or overwrite secrets for an agent.
      description: >
        Creates or overwrites key-value secrets under the agent. Each secret
        is bound to one or more hosts and is only injected for matching CONNECT
        destinations.
        Keys may contain alphanumeric characters and underscores, up to 128
        characters. Values are limited to 48 KB each. Hosts may be exact
        hostnames, wildcard hostnames with a leading "*." or "**.", exact
        IPv4/IPv6 addresses, or IPv4/IPv6 CIDR ranges. "*." matches exactly
        one subdomain label, while "**." matches any subdomain depth.
      tags: [secrets]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutSecretsRequest'
      responses:
        '201':
          description: Secrets stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutSecretsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/secret/{agentName}/delete:
    post:
      operationId: deleteSecret
      summary: Delete secrets for an agent.
      description: >
        Deletes the specified secret keys for the agent. Missing keys are
        ignored.
      tags: [secrets]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteSecretsRequest'
      responses:
        '204':
          description: Secrets deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/environment:
    get:
      operationId: listEnvironments
      summary: List paginated Environment resources.
      tags: [environments]
      parameters:
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated environments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvironmentsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createEnvironment
      summary: Create an Environment resource.
      tags: [environments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnvironmentRequest'
      responses:
        '201':
          description: Environment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/environment/{environmentName}:
    put:
      operationId: updateEnvironment
      summary: Update an Environment resource.
      description: >
        Updates the packages list for an existing Environment. The name in the
        path identifies the Environment.
      tags: [environments]
      parameters:
      - name: environmentName
        in: path
        required: true
        description: Environment resource name.
        schema:
          $ref: '#/components/schemas/EnvironmentName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEnvironmentRequest'
      responses:
        '200':
          description: Environment updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteEnvironment
      summary: Delete an Environment resource.
      tags: [environments]
      parameters:
      - name: environmentName
        in: path
        required: true
        description: Environment resource name.
        schema:
          $ref: '#/components/schemas/EnvironmentName'
      responses:
        '204':
          description: Environment deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/mcp-connection:
    get:
      operationId: listMCPConnections
      summary: List paginated MCPConnection resources.
      tags: [mcp-connections]
      parameters:
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated MCPConnections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMCPConnectionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createMCPConnection
      summary: Create an MCPConnection resource.
      tags: [mcp-connections]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMCPConnectionRequest'
      responses:
        '201':
          description: MCPConnection created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPConnectionDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/mcp-connection/{name}:
    get:
      operationId: getMCPConnection
      summary: Get an MCPConnection resource.
      tags: [mcp-connections]
      parameters:
      - $ref: '#/components/parameters/MCPConnectionNamePath'
      responses:
        '200':
          description: MCPConnection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPConnectionDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteMCPConnection
      summary: Delete an MCPConnection resource.
      tags: [mcp-connections]
      parameters:
      - $ref: '#/components/parameters/MCPConnectionNamePath'
      responses:
        '204':
          description: MCPConnection deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/mcp-connection/watch:
    post:
      operationId: watchMCPConnections
      summary: Watch MCP connection status changes.
      description: >
        Returns an SSE stream. Each event data payload is a JSON object matching
        WatchMCPConnectionsEvent. If names is omitted or empty, all MCP
        connections are watched.
      tags: [mcp-connections]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchMCPConnectionsRequest'
      responses:
        '200':
          description: Stream of MCP connection updates.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/WatchMCPConnectionsEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workflow/{agentName}:
    get:
      operationId: listWorkflowSummaries
      summary: List workflow summaries.
      description: >
        Lists saved workflow metadata for a single agent without loading the
        full workflow graph.
      tags: [workflows]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      responses:
        '200':
          description: Workflow summaries for one agent.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createWorkflow
      summary: Create a workflow definition.
      description: >
        Creates a normalized workflow DAG for a single agent. The workflow
        definition is stored as metadata, nodes, and edges, and later retrieval
        can derive a markdown execution playbook from the structured graph.
      tags: [workflows]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowRequest'
      responses:
        '201':
          description: Workflow created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteWorkflows
      summary: Delete workflow definitions.
      description: >
        Deletes multiple persisted workflow DAGs for one agent in a single
        request. Deletion is strict: if any requested workflow name does not
        exist, the request fails and no workflows are deleted.
      tags: [workflows]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteWorkflowsRequest'
      responses:
        '204':
          description: Workflows deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workflow/{agentName}/{workflowName}:
    get:
      operationId: getWorkflow
      summary: Get a workflow definition.
      description: >
        Retrieves a persisted workflow DAG for a single agent. The response
        preserves the normalized workflow structure so clients can derive a
        detailed execution playbook from the graph.
      tags: [workflows]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - name: workflowName
        in: path
        required: true
        description: Workflow name scoped to one agent.
        schema:
          $ref: '#/components/schemas/WorkflowName'
      responses:
        '200':
          description: Workflow definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workflow/{agentName}/schedule:
    get:
      operationId: listAgentWorkflowSchedules
      summary: List workflow schedules for one agent.
      description: >
        Lists paginated workflow schedules for one agent across all workflows.
      tags: [workflow-schedules]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated workflow schedules for one agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkflowSchedulesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workflow/{agentName}/{workflowName}/schedule:
    get:
      operationId: listWorkflowSchedules
      summary: List workflow schedules.
      description: >
        Lists paginated workflow schedules for one workflow definition.
      tags: [workflow-schedules]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - name: workflowName
        in: path
        required: true
        description: Workflow name scoped to one agent.
        schema:
          $ref: '#/components/schemas/WorkflowName'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated workflow schedules for one workflow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkflowSchedulesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createWorkflowSchedule
      summary: Create a workflow schedule.
      description: >
        Creates a WorkflowSchedule resource for one agent workflow pair. The
        gateway forwards schedule validation to the existing Kubernetes webhook.
      tags: [workflow-schedules]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - name: workflowName
        in: path
        required: true
        description: Workflow name scoped to one agent.
        schema:
          $ref: '#/components/schemas/WorkflowName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowScheduleRequest'
      responses:
        '201':
          description: Workflow schedule created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowSchedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workflow/{agentName}/{workflowName}/schedule/{scheduleName}:
    put:
      operationId: updateWorkflowSchedule
      summary: Update a workflow schedule.
      description: >
        Replaces all mutable workflow schedule fields for one existing schedule.
      tags: [workflow-schedules]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - name: workflowName
        in: path
        required: true
        description: Workflow name scoped to one agent.
        schema:
          $ref: '#/components/schemas/WorkflowName'
      - name: scheduleName
        in: path
        required: true
        description: WorkflowSchedule resource name.
        schema:
          $ref: '#/components/schemas/WorkflowScheduleName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkflowScheduleRequest'
      responses:
        '200':
          description: Workflow schedule updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowSchedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteWorkflowSchedule
      summary: Delete a workflow schedule.
      description: >
        Deletes one workflow schedule addressed by agent, workflow, and
        schedule name.
      tags: [workflow-schedules]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - name: workflowName
        in: path
        required: true
        description: Workflow name scoped to one agent.
        schema:
          $ref: '#/components/schemas/WorkflowName'
      - name: scheduleName
        in: path
        required: true
        description: WorkflowSchedule resource name.
        schema:
          $ref: '#/components/schemas/WorkflowScheduleName'
      responses:
        '204':
          description: Workflow schedule deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workflow/{agentName}/{workflowName}/schedule/{scheduleName}/run:
    get:
      operationId: listWorkflowRuns
      summary: List workflow runs for a workflow schedule.
      description: >
        Lists paginated workflow runs created from the addressed
        WorkflowSchedule.
      tags: [workflow-schedules]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - name: workflowName
        in: path
        required: true
        description: Workflow name scoped to one agent.
        schema:
          $ref: '#/components/schemas/WorkflowName'
      - name: scheduleName
        in: path
        required: true
        description: WorkflowSchedule resource name.
        schema:
          $ref: '#/components/schemas/WorkflowScheduleName'
      - name: status
        in: query
        required: false
        description: Optional WorkflowRun phase filter.
        schema:
          $ref: '#/components/schemas/WorkflowRunStatus'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated workflow runs for one workflow schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkflowRunsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createWorkflowRun
      summary: Trigger one workflow run from a workflow schedule.
      description: >
        Creates one WorkflowRun from the addressed WorkflowSchedule without
        overriding any schedule-derived execution fields.
      tags: [workflow-schedules]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - name: workflowName
        in: path
        required: true
        description: Workflow name scoped to one agent.
        schema:
          $ref: '#/components/schemas/WorkflowName'
      - name: scheduleName
        in: path
        required: true
        description: WorkflowSchedule resource name.
        schema:
          $ref: '#/components/schemas/WorkflowScheduleName'
      responses:
        '202':
          description: Workflow run accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workflow/{agentName}/{workflowName}/schedule/{scheduleName}/run/watch:
    post:
      operationId: watchWorkflowRuns
      summary: Watch workflow runs for a workflow schedule.
      description: >
        Returns an SSE stream. Each event data payload is a JSON object matching
        WatchWorkflowRunsEvent. If run_names is omitted or empty, all runs for
        the addressed WorkflowSchedule are watched.
      tags: [workflow-schedules]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - name: workflowName
        in: path
        required: true
        description: Workflow name scoped to one agent.
        schema:
          $ref: '#/components/schemas/WorkflowName'
      - name: scheduleName
        in: path
        required: true
        description: WorkflowSchedule resource name.
        schema:
          $ref: '#/components/schemas/WorkflowScheduleName'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchWorkflowRunsRequest'
      responses:
        '200':
          description: Stream of workflow run updates.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/WatchWorkflowRunsEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workflow/{agentName}/{workflowName}/schedule/{scheduleName}/run/{runName}:
    get:
      operationId: getWorkflowRun
      summary: Get one workflow run.
      description: >
        Returns all public details for one WorkflowRun created from the
        addressed WorkflowSchedule.
      tags: [workflow-schedules]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - name: workflowName
        in: path
        required: true
        description: Workflow name scoped to one agent.
        schema:
          $ref: '#/components/schemas/WorkflowName'
      - name: scheduleName
        in: path
        required: true
        description: WorkflowSchedule resource name.
        schema:
          $ref: '#/components/schemas/WorkflowScheduleName'
      - name: runName
        in: path
        required: true
        description: WorkflowRun resource name.
        schema:
          $ref: '#/components/schemas/WorkflowRunName'
      responses:
        '200':
          description: Workflow run details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteWorkflowRun
      summary: Delete one workflow run.
      description: >
        Deletes one WorkflowRun created from the addressed WorkflowSchedule and
        waits until controller-driven cleanup completes.
      tags: [workflow-schedules]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - name: workflowName
        in: path
        required: true
        description: Workflow name scoped to one agent.
        schema:
          $ref: '#/components/schemas/WorkflowName'
      - name: scheduleName
        in: path
        required: true
        description: WorkflowSchedule resource name.
        schema:
          $ref: '#/components/schemas/WorkflowScheduleName'
      - name: runName
        in: path
        required: true
        description: WorkflowRun resource name.
        schema:
          $ref: '#/components/schemas/WorkflowRunName'
      responses:
        '204':
          description: Workflow run deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workflow/{agentName}/{workflowName}/run/{runName}/status:
    patch:
      operationId: patchWorkflowRunStatus
      summary: Set a WorkflowRun terminal status.
      description: >
        Marks a running WorkflowRun as succeeded or failed. The gateway owns
        request validation and state-transition checks, then patches the
        WorkflowRun status in the configured namespace.
      tags: [workflows]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - name: workflowName
        in: path
        required: true
        description: Workflow name scoped to one agent.
        schema:
          $ref: '#/components/schemas/WorkflowName'
      - name: runName
        in: path
        required: true
        description: WorkflowRun resource name.
        schema:
          $ref: '#/components/schemas/WorkflowRunName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchWorkflowRunStatusRequest'
      responses:
        '204':
          description: WorkflowRun status updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    GatewayBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AgentNameQuery:
      name: agent_name
      in: query
      required: true
      description: Agent name.
      schema:
        $ref: '#/components/schemas/AgentName'

    AgentNamePath:
      name: agentName
      in: path
      required: true
      description: Agent name.
      schema:
        $ref: '#/components/schemas/AgentName'

    EnvironmentNamePath:
      name: name
      in: path
      required: true
      description: Environment name.
      schema:
        $ref: '#/components/schemas/EnvironmentName'

    MCPConnectionNamePath:
      name: name
      in: path
      required: true
      description: MCPConnection name.
      schema:
        $ref: '#/components/schemas/MCPConnectionName'

    AgentNameFilterQuery:
      name: agent_name
      in: query
      required: false
      description: Optional agent name filters. Repeat the query parameter for multiple agents.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/AgentName'

    LimitQuery:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50

    PageTokenQuery:
      name: page_token
      in: query
      required: false
      description: Opaque pagination token from a previous response.
      schema:
        type: string
        minLength: 1

    TraceIDQuery:
      name: trace_id
      in: query
      required: true
      description: Lowercase hexadecimal OTLP trace ID.
      schema:
        $ref: '#/components/schemas/TraceID'

    SpanIDQuery:
      name: span_id
      in: query
      required: true
      description: Lowercase hexadecimal OTLP span ID.
      schema:
        $ref: '#/components/schemas/SpanID'

    SessionIDQuery:
      name: session_id
      in: query
      required: false
      description: Optional root session ID.
      schema:
        type: string
        minLength: 1

    StartedAfterQuery:
      name: started_after
      in: query
      required: false
      description: Inclusive lower bound for trace start time.
      schema:
        type: string
        format: date-time

    StartedBeforeQuery:
      name: started_before
      in: query
      required: false
      description: Inclusive upper bound for trace start time.
      schema:
        type: string
        format: date-time

    EventTimeAfterQuery:
      name: event_time_after
      in: query
      required: false
      description: Inclusive lower bound for event time.
      schema:
        type: string
        format: date-time

    EventTimeBeforeQuery:
      name: event_time_before
      in: query
      required: false
      description: Inclusive upper bound for event time.
      schema:
        type: string
        format: date-time

    ActionQuery:
      name: action
      in: query
      required: false
      description: Optional observability action filter.
      schema:
        $ref: '#/components/schemas/ObservabilityAction'

    AggregatedQuery:
      name: aggregated
      in: query
      required: false
      description: When true, returns aggregated events with occurrence counts over the time range.
      schema:
        type: boolean
        default: false

    FromDateQuery:
      name: from
      in: query
      required: true
      description: Inclusive lower bound for MCP tool activity date.
      schema:
        type: string
        format: date

    ToDateQuery:
      name: to
      in: query
      required: true
      description: Inclusive upper bound for MCP tool activity date.
      schema:
        type: string
        format: date

  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: >
        Requested resource was not found. For tenant-gated APIs this can also
        mean the current tenant is not initialized and the error code is
        `tenant_not_found`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: >
        Request conflicts with current state. For tenant-gated APIs this can
        also mean the current tenant is still bootstrapping and the error code
        is `tenant_not_ready`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    TraceID:
      type: string
      minLength: 32
      maxLength: 32
      pattern: '^[0-9a-f]{32}$'
      description: Lowercase hexadecimal OTLP trace ID.

    SpanID:
      type: string
      minLength: 16
      maxLength: 16
      pattern: '^[0-9a-f]{16}$'
      description: Lowercase hexadecimal OTLP span ID.

    OptionalSpanID:
      type: string
      maxLength: 16
      pattern: '^([0-9a-f]{16})?$'
      description: Lowercase hexadecimal OTLP span ID, or empty for root spans.

    TenantPhase:
      type: string
      enum: [BOOTSTRAPPING, READY, FAILED]

    TenantCondition:
      type: object
      required: [type, status, reason, message]
      properties:
        type:
          type: string
        status:
          type: string
          enum: ['True', 'False', 'Unknown']
        reason:
          type: string
        message:
          type: string

    Tenant:
      type: object
      required: [tenant_id, user_id, namespace, ready, phase, conditions]
      properties:
        tenant_id:
          type: string
        user_id:
          type: string
        namespace:
          type: string
        ready:
          type: boolean
        phase:
          $ref: '#/components/schemas/TenantPhase'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/TenantCondition'

    ObservabilityAction:
      type: string
      enum: [Allowed, Blocked]

    AgentName:
      type: string
      minLength: 1
      maxLength: 32
      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'

    EnvironmentName:
      type: string
      minLength: 1
      maxLength: 32
      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      description: Environment resource name.

    MCPConnectionName:
      type: string
      minLength: 1
      maxLength: 32
      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      description: MCPConnection resource name.

    WorkflowName:
      type: string
      minLength: 1
      maxLength: 32
      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      description: Workflow name scoped to one agent.

    WorkflowScheduleName:
      type: string
      minLength: 1
      maxLength: 32
      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      description: WorkflowSchedule resource name.

    WorkflowRunName:
      type: string
      minLength: 1
      maxLength: 253
      pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
      description: WorkflowRun resource name.

    WorkflowNodeName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      description: Stable workflow node identifier.

    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        details:
          $ref: '#/components/schemas/JSONValue'
      required: [code, message]

    FieldError:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
      required: [field, message]

    WorkflowRunTerminalPhase:
      type: string
      enum:
      - Succeeded
      - Failed

    WorkflowRunStatus:
      type: string
      enum:
      - Pending
      - Running
      - Succeeded
      - Failed
      - Unacked

    PatchWorkflowRunStatusRequest:
      type: object
      additionalProperties: false
      properties:
        phase:
          $ref: '#/components/schemas/WorkflowRunTerminalPhase'
        message:
          type: string
          maxLength: 4096
      required: [phase]

    ListAgentsResponse:
      type: object
      additionalProperties: false
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
        next_page_token:
          type: string
      required: [agents, next_page_token]

    ListWorkflowSchedulesResponse:
      type: object
      additionalProperties: false
      properties:
        workflow_schedules:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowSchedule'
        next_page_token:
          type: string
      required: [workflow_schedules, next_page_token]

    ListWorkflowRunsResponse:
      type: object
      additionalProperties: false
      properties:
        workflow_runs:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowRunSummary'
        next_page_token:
          type: string
      required: [workflow_runs, next_page_token]

    Agent:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/AgentName'
        environmentName:
          $ref: '#/components/schemas/EnvironmentName'
        last_activity:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        modified_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/AgentStatus'
      required:
      - name
      - environmentName
      - last_activity
      - created_at
      - modified_at
      - status

    AgentStatus:
      type: string
      enum:
      - UNSPECIFIED
      - PROGRESSING
      - DEGRADED
      - DELETED
      - IDLE

    CreateAgentRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/AgentName'
        env:
          type: object
          additionalProperties:
            type: string
        environmentName:
          $ref: '#/components/schemas/EnvironmentName'
        opencode:
          $ref: '#/components/schemas/AgentOpencodeConfig'
      required: [name, environmentName]

    CreateWorkflowRequest:
      type: object
      additionalProperties: false
      properties:
        workflow_name:
          $ref: '#/components/schemas/WorkflowName'
        title:
          type: string
          minLength: 1
          maxLength: 256
        summary:
          type: string
          minLength: 1
          maxLength: 4096
        inputs:
          $ref: '#/components/schemas/WorkflowInputs'
        nodes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WorkflowNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowEdge'
      required:
      - workflow_name
      - title
      - summary
      - nodes
      - edges

    Workflow:
      type: object
      additionalProperties: false
      properties:
        agent_name:
          $ref: '#/components/schemas/AgentName'
        workflow_name:
          $ref: '#/components/schemas/WorkflowName'
        title:
          type: string
        summary:
          type: string
        inputs:
          $ref: '#/components/schemas/WorkflowInputs'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowEdge'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - agent_name
      - workflow_name
      - title
      - summary
      - nodes
      - edges
      - created_at
      - updated_at

    WorkflowSchedule:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/WorkflowScheduleName'
        agent_name:
          $ref: '#/components/schemas/AgentName'
        workflow_name:
          $ref: '#/components/schemas/WorkflowName'
        schedule:
          type: string
          minLength: 1
        time_zone:
          type: string
        inputs:
          $ref: '#/components/schemas/JSONValue'
        timeout_seconds:
          type: integer
          format: int32
          minimum: 1
          maximum: 604800
        suspend:
          type: boolean
        successful_runs_history_limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
        failed_runs_history_limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
        created_at:
          type: string
          format: date-time
      required:
      - name
      - agent_name
      - workflow_name
      - schedule
      - timeout_seconds
      - inputs
      - suspend
      - successful_runs_history_limit
      - failed_runs_history_limit
      - created_at

    WorkflowRunSummary:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/WorkflowRunName'
        workflow_name:
          $ref: '#/components/schemas/WorkflowName'
        status:
          $ref: '#/components/schemas/WorkflowRunStatus'
        reason:
          type: string
        created_at:
          type: string
          format: date-time
        duration_seconds:
          type: integer
          format: int64
          minimum: 0
      required:
      - name
      - workflow_name
      - status
      - reason
      - created_at

    WorkflowRunDetail:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/WorkflowRunName'
        agent_name:
          $ref: '#/components/schemas/AgentName'
        workflow_name:
          $ref: '#/components/schemas/WorkflowName'
        schedule_name:
          $ref: '#/components/schemas/WorkflowScheduleName'
        inputs:
          $ref: '#/components/schemas/JSONValue'
        timeout_seconds:
          type: integer
          format: int32
          minimum: 1
          maximum: 604800
        status:
          $ref: '#/components/schemas/WorkflowRunStatus'
        reason:
          type: string
        message:
          type: string
        session_id:
          type: string
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        duration_seconds:
          type: integer
          format: int64
          minimum: 0
      required:
      - name
      - agent_name
      - workflow_name
      - inputs
      - timeout_seconds
      - status
      - reason
      - message
      - created_at

    CreateWorkflowScheduleRequest:
      type: object
      additionalProperties: false
      properties:
        name:
