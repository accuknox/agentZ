          type: string
          format: uri
        registration_endpoint:
          type: string
          format: uri
        resource:
          type: string
          format: uri
        scopes:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
      required: [token_endpoint, scopes]

    SecretOAuthCredentials:
      type: object
      additionalProperties: false
      properties:
        client_id:
          type: string
        client_secret:
          type: string
        access_token:
          type: string
        refresh_token:
          type: string
        expires_at:
          type: string
          format: date-time
        token_type:
          type: string
        scopes:
          type: array
          items:
