          type: string
        slug:
          type: string
      required: [type, id]

    EventTrailWorkspace:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
      required: [id]

    EventTrailCleanup:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        state:
          type: string
          enum: [pending, running, succeeded, failed]
        completed_at:
          type: string
          format: date-time
      required: [id, state]

    EventTrailEvent:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        actor:
          $ref: '#/components/schemas/EventTrailActor'
        target:
          $ref: '#/components/schemas/EventTrailTarget'
        workspace:
          $ref: '#/components/schemas/EventTrailWorkspace'
        category:
          type: string
        action:
          type: string
        result:
          $ref: '#/components/schemas/EventTrailResult'
        before:
          type: array
          items:
            $ref: '#/components/schemas/EventTrailField'
        after:
          type: array
          items:
            $ref: '#/components/schemas/EventTrailField'
        automatic_cascade:
          type: boolean
        interface:
          $ref: '#/components/schemas/EventTrailInterface'
        ip_address:
          type: string
        user_agent:
          type: string
        cleanup:
          $ref: '#/components/schemas/EventTrailCleanup'
        created_at:
          type: string
          format: date-time
      required:
      - id
      - actor
      - target
      - category
      - action
      - result
      - before
      - after
      - automatic_cascade
      - interface
      - created_at

    EventTrailActorFilter:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
