        minLength:
          type: integer
          minimum: 0
        maxLength:
          type: integer
          minimum: 0
        pattern:
          type: string
          minLength: 1
        format:
          $ref: '#/components/schemas/WorkflowInputStringFormat'
        minimum:
          type: number
          format: double
        maximum:
          type: number
          format: double
        exclusiveMinimum:
          type: number
          format: double
        exclusiveMaximum:
          type: number
          format: double
        multipleOf:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
      required:
      - type
      - required

