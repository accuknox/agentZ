                items:
                  $ref: '#/components/schemas/WorkflowSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createWorkflow
      summary: Create a workflow definition.
      description: >
        Creates a normalized workflow DAG for a single agent. The workflow
        definition is stored as metadata, nodes, and edges, and later retrieval
        can derive a markdown execution playbook from the structured graph.
      tags: [workflows]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowRequest'
      responses:
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '201':
          description: Workflow created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteWorkflows
      summary: Delete workflow definitions.
      description: >
        Deletes multiple persisted workflow DAGs for an agent in a single
        request. Deletion is strict: if any requested workflow name does not
        exist, the request fails and no workflows are deleted.
      tags: [workflows]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteWorkflowsRequest'
      responses:
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '204':
          description: Workflows deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workflow/{agentName}/{workflowName}:
    get:
      operationId: getWorkflow
      summary: Get a workflow definition.
      description: >
        Retrieves a persisted workflow DAG for a single agent. The response
        preserves the normalized workflow structure so clients can derive a
        detailed execution playbook from the graph.
      tags: [workflows]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - name: workflowName
        in: path
        required: true
        description: Workflow name scoped to an agent.
        schema:
          $ref: '#/components/schemas/WorkflowName'
      responses:
        '200':
          description: Workflow definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workflow/{agentName}/schedule:
    get:
      operationId: listAgentWorkflowSchedules
      summary: List workflow schedules for an agent.
      description: >
        Lists paginated workflow schedules for an agent across all workflows.
      tags: [workflow-schedules]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated workflow schedules for an agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkflowSchedulesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workflow/{agentName}/{workflowName}/schedule:
    get:
      operationId: listWorkflowSchedules
      summary: List workflow schedules.
      description: >
        Lists paginated workflow schedules for a workflow definition.
      tags: [workflow-schedules]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - name: workflowName
        in: path
        required: true
        description: Workflow name scoped to an agent.
        schema:
          $ref: '#/components/schemas/WorkflowName'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated workflow schedules for a workflow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkflowSchedulesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createWorkflowSchedule
      summary: Create a workflow schedule.
      description: >
        Creates a WorkflowSchedule resource for an agent-workflow pair. The
        gateway forwards schedule validation to the existing Kubernetes webhook.
      tags: [workflow-schedules]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - name: workflowName
        in: path
        required: true
        description: Workflow name scoped to an agent.
        schema:
          $ref: '#/components/schemas/WorkflowName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowScheduleRequest'
      responses:
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '201':
          description: Workflow schedule created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowSchedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workflow/{agentName}/{workflowName}/schedule/{scheduleName}:
    put:
      operationId: updateWorkflowSchedule
      summary: Update a workflow schedule.
      description: >
        Replaces all mutable workflow schedule fields for an existing schedule.
      tags: [workflow-schedules]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - name: workflowName
        in: path
        required: true
        description: Workflow name scoped to an agent.
        schema:
          $ref: '#/components/schemas/WorkflowName'
      - name: scheduleName
        in: path
        required: true
        description: WorkflowSchedule resource name.
        schema:
          $ref: '#/components/schemas/WorkflowScheduleName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkflowScheduleRequest'
      responses:
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '200':
          description: Workflow schedule updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowSchedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteWorkflowSchedule
      summary: Delete a workflow schedule.
      description: >
        Deletes a workflow schedule addressed by agent, workflow, and
        schedule name.
      tags: [workflow-schedules]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - name: workflowName
        in: path
        required: true
        description: Workflow name scoped to an agent.
        schema:
          $ref: '#/components/schemas/WorkflowName'
      - name: scheduleName
        in: path
        required: true
        description: WorkflowSchedule resource name.
        schema:
          $ref: '#/components/schemas/WorkflowScheduleName'
      responses:
        '204':
          description: Workflow schedule deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workflow/{agentName}/{workflowName}/schedule/{scheduleName}/run:
    post:
      operationId: createWorkflowRun
      summary: Trigger a workflow run from a workflow schedule.
      description: >
        Creates a WorkflowRun from the addressed WorkflowSchedule without
        overriding any schedule-derived execution fields.
      tags: [workflow-schedules]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - name: workflowName
        in: path
        required: true
        description: Workflow name scoped to an agent.
        schema:
          $ref: '#/components/schemas/WorkflowName'
      - name: scheduleName
        in: path
        required: true
        description: WorkflowSchedule resource name.
        schema:
          $ref: '#/components/schemas/WorkflowScheduleName'
      responses:
        '202':
          description: Workflow run accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workflow/{agentName}/{workflowName}/webhook:
    post:
      operationId: invokeWorkflowWebhook
      summary: Trigger a workflow run through a webhook API key.
      description: >
        Validates the request body against the saved workflow input contract, then
        creates a direct WorkflowRun for the addressed tenant, agent, and
        workflow. Every request body is interpreted as JSON regardless of its
        Content-Type header. Authentication uses the X-API-Key header.
      security:
      - GatewayAPIKey: []
      tags: [workflow-webhooks]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - name: workflowName
        in: path
        required: true
        description: Workflow name scoped to an agent.
        schema:
          $ref: '#/components/schemas/WorkflowName'
      - name: timeout_seconds
        in: query
        required: false
        description: Timeout for the created WorkflowRun.
        schema:
          type: integer
          format: int32
          default: 3600
          minimum: 1
          maximum: 604800
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowRunInputs'
          '*/*': {}
      responses:
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '202':
          description: Workflow run accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workflow/{agentName}/webhook:
    get:
      operationId: listWorkflowWebhookTriggers
      summary: List webhook trigger rows for an agent.
      description: >
        Lists the distinct API key and workflow pairs that have produced at
        least a webhook-triggered WorkflowRun for the addressed agent.
      tags: [workflow-webhooks]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated webhook trigger rows for an agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkflowWebhookTriggersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workflow/{agentName}/{workflowName}/run:
    get:
      operationId: listWorkflowRuns
      summary: List workflow runs for a workflow.
      description: >
        Lists paginated WorkflowRuns for an agent-workflow pair. Optional
        trigger filters narrow the results to schedule-triggered or
        webhook-triggered runs.
      tags: [workflow-runs]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - name: workflowName
        in: path
        required: true
        description: Workflow name scoped to an agent.
        schema:
          $ref: '#/components/schemas/WorkflowName'
      - name: status
        in: query
        required: false
        description: Optional WorkflowRun phase filter.
        schema:
          $ref: '#/components/schemas/WorkflowRunStatus'
      - name: trigger_type
        in: query
        required: false
        description: Optional workflow trigger type filter.
        schema:
          $ref: '#/components/schemas/WorkflowRunTriggerType'
      - name: schedule_name
        in: query
        required: false
        description: >
          Optional schedule filter. When set, trigger_type must be Schedule.
        schema:
          $ref: '#/components/schemas/WorkflowScheduleName'
      - name: webhook_api_key_id
        in: query
        required: false
        description: >
          Optional webhook API key filter. When set, trigger_type must be
          Webhook.
        schema:
          $ref: '#/components/schemas/APIKeyID'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated workflow runs for a workflow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkflowRunsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workflow/{agentName}/{workflowName}/run/watch:
    post:
      operationId: watchWorkflowRuns
      summary: Watch workflow runs for a workflow.
      description: >
        Returns an SSE stream. Each event data payload is a JSON object matching
        WatchWorkflowRunsEvent. If run_names is omitted or empty, all runs for
        the addressed workflow are watched.
      tags: [workflow-runs]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - name: workflowName
        in: path
        required: true
        description: Workflow name scoped to an agent.
        schema:
          $ref: '#/components/schemas/WorkflowName'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchWorkflowRunsRequest'
      responses:
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '200':
          description: Stream of workflow run updates.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/WatchWorkflowRunsEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workflow/{agentName}/{workflowName}/run/{runName}:
    get:
      operationId: getWorkflowRun
      summary: Get a workflow run.
      description: >
        Returns all public details for a WorkflowRun owned by the addressed
        agent-workflow pair.
      tags: [workflow-runs]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - name: workflowName
        in: path
        required: true
        description: Workflow name scoped to an agent.
        schema:
          $ref: '#/components/schemas/WorkflowName'
      - name: runName
        in: path
        required: true
        description: WorkflowRun resource name.
        schema:
          $ref: '#/components/schemas/WorkflowRunName'
      responses:
        '200':
          description: Workflow run details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteWorkflowRun
      summary: Delete a workflow run.
      description: >
        Deletes a WorkflowRun owned by the addressed agent-workflow pair and
        waits until controller-driven cleanup completes.
      tags: [workflow-runs]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - name: workflowName
        in: path
        required: true
        description: Workflow name scoped to an agent.
        schema:
          $ref: '#/components/schemas/WorkflowName'
      - name: runName
        in: path
        required: true
        description: WorkflowRun resource name.
        schema:
          $ref: '#/components/schemas/WorkflowRunName'
      responses:
        '204':
          description: Workflow run deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workflow/{agentName}/{workflowName}/run/{runName}/status:
    patch:
      operationId: patchWorkflowRunStatus
      summary: Set a WorkflowRun terminal status.
      description: >
        Marks a running WorkflowRun as succeeded or failed. The gateway owns
        request validation and state-transition checks, then patches the
        WorkflowRun status in the configured namespace.
      tags: [workflow-runs]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - name: workflowName
        in: path
        required: true
        description: Workflow name scoped to an agent.
        schema:
          $ref: '#/components/schemas/WorkflowName'
      - name: runName
        in: path
        required: true
        description: WorkflowRun resource name.
        schema:
          $ref: '#/components/schemas/WorkflowRunName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchWorkflowRunStatusRequest'
      responses:
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '204':
          description: WorkflowRun status updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workflow/{agentName}/{workflowName}/run/{runName}/nodes/{nodeName}/status:
    patch:
      operationId: patchWorkflowRunNodeStatus
      summary: Set a WorkflowRun node status.
      description: >
        Records execution progress for one WorkflowRun node. The gateway
        validates node membership and basic state transitions before patching
        the WorkflowRun status in the configured namespace.
      tags: [workflow-runs]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - name: workflowName
        in: path
        required: true
        description: Workflow name scoped to an agent.
        schema:
          $ref: '#/components/schemas/WorkflowName'
      - name: runName
        in: path
        required: true
        description: WorkflowRun resource name.
        schema:
          $ref: '#/components/schemas/WorkflowRunName'
      - name: nodeName
        in: path
        required: true
        description: Workflow node name.
        schema:
          $ref: '#/components/schemas/WorkflowNodeName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchWorkflowRunNodeStatusRequest'
      responses:
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '204':
          description: WorkflowRun node status updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    GatewayBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    GatewayAPIKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    WorkspaceIDHeader:
      name: X-AgentZ-Workspace-ID
      in: header
      required: false
      description: >
        Stable Workspace ID selecting Workspace scope. Omit for Organisation
        scope.
      schema:
        type: string
        minLength: 1
        maxLength: 128

    WorkspaceIDPath:
      name: workspaceId
      in: path
      required: true
      description: Stable Workspace ID.
      schema:
        type: string
        minLength: 1
        maxLength: 128

    InheritedResourceTypePath:
      name: resourceType
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/InheritedResourceType'

    ResourceScopeQuery:
      name: scope
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/ResourceScope'

    WorkspaceSlugPath:
      name: workspaceSlug
      in: path
      required: true
      description: Current or historical Workspace slug.
      schema:
        type: string
        minLength: 1
        maxLength: 128

    EventTrailActorTypeQuery:
      name: actor_type
      in: query
      required: false
      description: Exact actor type.
      schema:
        $ref: '#/components/schemas/EventTrailActorType'

    EventTrailEventIDPath:
      name: eventId
      in: path
      required: true
      description: Stable event trail event ID.
      schema:
        type: string
        minLength: 1

    EventTrailActorIDQuery:
      name: actor_id
      in: query
      required: false
      description: Exact actor ID.
      schema:
        type: string
        minLength: 1

    EventTrailCategoryQuery:
      name: category
      in: query
      required: false
      description: Exact event trail category.
      schema:
        type: string
        minLength: 1

    EventTrailWorkspaceIDQuery:
      name: workspace_id
      in: query
      required: false
      description: Exact Workspace ID.
      schema:
        type: string
        minLength: 1

    EventTrailTargetTypeQuery:
      name: target_type
      in: query
      required: false
      description: Exact target resource type.
      schema:
        $ref: '#/components/schemas/EventTrailTargetType'

    EventTrailResultQuery:
      name: result
      in: query
      required: false
      description: Exact event trail result.
      schema:
        $ref: '#/components/schemas/EventTrailResult'

    EventTrailCreatedAfterQuery:
      name: created_after
      in: query
      required: false
      description: Inclusive lower event timestamp bound.
      schema:
        type: string
        format: date-time

    EventTrailCreatedBeforeQuery:
      name: created_before
      in: query
      required: false
      description: Inclusive upper event timestamp bound.
      schema:
        type: string
        format: date-time

    AgentNameQuery:
      name: agent_name
      in: query
      required: true
      description: Agent name.
      schema:
        $ref: '#/components/schemas/AgentName'

    AgentNameQueryOptional:
      name: agent_name
      in: query
      required: false
      description: Optional Agent name.
      schema:
        $ref: '#/components/schemas/AgentName'

    AgentNamePath:
      name: agentName
      in: path
      required: true
      description: Agent name.
      schema:
        $ref: '#/components/schemas/AgentName'

    AgentShareIDPath:
      name: shareId
      in: path
      required: true
      description: Stable Agent Share ID.
      schema:
        type: string
        minLength: 1

    InferenceProviderNamePath:
      name: providerName
      in: path
      required: true
      description: Stable inference provider ID.
      schema:
        $ref: '#/components/schemas/InferenceProviderName'

    InferencePoolNamePath:
      name: poolName
      in: path
      required: true
      description: Stable inference Pool ID.
      schema:
        $ref: '#/components/schemas/InferencePoolName'

    FilePathQuery:
      name: path
      in: query
      required: true
      description: Path relative to the agent workspace root.
      schema:
        type: string
        minLength: 1
        maxLength: 4096

    SandboxNamePath:
      name: name
      in: path
      required: true
      description: Sandbox name.
      schema:
        $ref: '#/components/schemas/SandboxName'

    SkillNamePath:
      name: skillName
      in: path
      required: true
      description: Skill name.
      schema:
        $ref: '#/components/schemas/SkillName'

    MCPConnectionNamePath:
      name: name
      in: path
      required: true
      description: MCPConnection name.
      schema:
        $ref: '#/components/schemas/MCPConnectionName'

    AgentNameFilterQuery:
      name: agent_name
      in: query
      required: false
      description: Optional agent name filters. Repeat the query parameter for multiple agents.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/AgentName'

    LimitQuery:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50

    PageTokenQuery:
      name: page_token
      in: query
      required: false
      description: Opaque pagination token from a previous response.
      schema:
        type: string
        minLength: 1

    UpdateSandboxQuery:
      name: update_sandbox
      in: query
      required: false
      description: >
        When true, append compatible secret hosts that are missing from the
        agent sandbox allowed host list before creating the secret.
      schema:
        type: boolean
        default: false

    TraceIDQuery:
      name: trace_id
      in: query
      required: true
      description: Lowercase hexadecimal OTLP trace ID.
      schema:
        $ref: '#/components/schemas/TraceID'

    SpanIDQuery:
      name: span_id
      in: query
      required: true
      description: Lowercase hexadecimal OTLP span ID.
      schema:
        $ref: '#/components/schemas/SpanID'

    SessionIDQuery:
      name: session_id
      in: query
      required: false
      description: Optional root session ID.
      schema:
        type: string
        minLength: 1

    StartedAfterQuery:
      name: started_after
      in: query
      required: false
      description: Inclusive lower bound for trace start time.
      schema:
        type: string
        format: date-time

    StartedBeforeQuery:
      name: started_before
      in: query
      required: false
      description: Inclusive upper bound for trace start time.
      schema:
        type: string
        format: date-time

    EventTimeAfterQuery:
      name: event_time_after
      in: query
      required: false
      description: Inclusive lower bound for event time.
      schema:
        type: string
        format: date-time

    EventTimeBeforeQuery:
      name: event_time_before
      in: query
      required: false
      description: Inclusive upper bound for event time.
      schema:
        type: string
        format: date-time

    EventTimeAfterRequiredQuery:
      name: event_time_after
      in: query
      required: true
      description: Inclusive lower bound for event time.
      schema:
        type: string
        format: date-time

    EventTimeBeforeRequiredQuery:
      name: event_time_before
      in: query
      required: true
      description: Inclusive upper bound for event time.
      schema:
        type: string
        format: date-time

    ActionQuery:
      name: action
      in: query
      required: false
      description: Optional observability action filter.
      schema:
        $ref: '#/components/schemas/ObservabilityAction'

    FromDateQuery:
      name: from
      in: query
      required: true
      description: Inclusive lower bound for MCP tool activity date.
      schema:
        type: string
        format: date

    ToDateQuery:
      name: to
      in: query
      required: true
      description: Inclusive upper bound for MCP tool activity date.
      schema:
        type: string
        format: date

  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Request authentication failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The authenticated principal lacks authority for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: >
        Requested resource was not found. For tenant-gated APIs this can also
        mean the current tenant is not initialized and the error code is
        `tenant_not_found`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: >
        Request conflicts with current state. For tenant-gated APIs this can
        also mean the current tenant is still bootstrapping and the error code
        is `tenant_not_ready`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: Request body or expanded content exceeds a documented limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: The request Content-Type is not supported by this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableContent:
      description: The request body does not match the operation schema.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGateway:
      description: The Agent filesystem is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    EventTrailActorType:
      type: string
      enum: [user, api_key, system]

    EventTrailResult:
      type: string
      enum: [succeeded, denied, failed]

    EventTrailInterface:
      type: string
      enum: [web, gateway, better_auth, controller, system]

    EventTrailTargetType:
