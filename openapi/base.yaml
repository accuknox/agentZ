openapi: 3.0.3
info:
  title: ClawArmor HTTP API
  version: 0.1.0
  description: HTTP API for ClawArmor agents, lens, secrets, and environments.
servers:
- url: /
  description: Current origin
tags:
- name: agents
  description: Agent lifecycle and status APIs.
- name: lens
  description: Trace, span, and OS observability APIs.
- name: secrets
  description: Session secret management APIs.
- name: environments
  description: Environment resource management APIs.
- name: workflows
  description: Workflow definition management APIs.

paths:
  /api/agent/list:
    get:
      operationId: listAgents
      summary: List paginated agent summaries.
      tags: [agents]
      parameters:
      - $ref: '#/components/parameters/AgentNameFilterQuery'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated agent summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAgentsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/lens/trace/list:
    get:
      operationId: listTraces
      summary: List paginated trace summaries.
      tags: [lens]
      parameters:
      - $ref: '#/components/parameters/AgentNameQuery'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      - $ref: '#/components/parameters/StartedAfterQuery'
      - $ref: '#/components/parameters/StartedBeforeQuery'
      responses:
        '200':
          description: Paginated trace summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTracesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/lens/trace/session/list:
    get:
      operationId: listTraceSessions
      summary: List paginated per-session trace summaries.
      tags: [lens]
      parameters:
      - $ref: '#/components/parameters/AgentNameQuery'
      - $ref: '#/components/parameters/SessionIDQuery'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      - $ref: '#/components/parameters/StartedAfterQuery'
      - $ref: '#/components/parameters/StartedBeforeQuery'
      responses:
        '200':
          description: Paginated per-session trace summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTraceSessionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/lens/span/list:
    get:
      operationId: listSpans
      summary: List paginated spans for a trace.
      tags: [lens]
      parameters:
      - $ref: '#/components/parameters/AgentNameQuery'
      - $ref: '#/components/parameters/TraceIDQuery'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated spans for a trace.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSpansResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/lens/span/detail:
    get:
      operationId: getSpanDetail
      summary: Get span details and correlated OS observability.
      tags: [lens]
      parameters:
      - $ref: '#/components/parameters/AgentNameQuery'
      - $ref: '#/components/parameters/TraceIDQuery'
      - $ref: '#/components/parameters/SpanIDQuery'
      responses:
        '200':
          description: Span detail with payload and correlated events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpanDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/lens/observability/process/list:
    get:
      operationId: listProcessObservability
      summary: List paginated process observability events.
      tags: [lens]
      parameters:
      - $ref: '#/components/parameters/AgentNameQuery'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      - $ref: '#/components/parameters/EventTimeAfterQuery'
      - $ref: '#/components/parameters/EventTimeBeforeQuery'
      - $ref: '#/components/parameters/ActionQuery'
      - $ref: '#/components/parameters/AggregatedQuery'
      responses:
        '200':
          description: Paginated process observability events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProcessObservabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/lens/observability/file/list:
    get:
      operationId: listFileObservability
      summary: List paginated file observability events.
      tags: [lens]
      parameters:
      - $ref: '#/components/parameters/AgentNameQuery'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      - $ref: '#/components/parameters/EventTimeAfterQuery'
      - $ref: '#/components/parameters/EventTimeBeforeQuery'
      - $ref: '#/components/parameters/ActionQuery'
      - $ref: '#/components/parameters/AggregatedQuery'
      responses:
        '200':
          description: Paginated file observability events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFileObservabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/lens/observability/network/list:
    get:
      operationId: listNetworkObservability
      summary: List paginated network observability events.
      tags: [lens]
      parameters:
      - $ref: '#/components/parameters/AgentNameQuery'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      - $ref: '#/components/parameters/EventTimeAfterQuery'
      - $ref: '#/components/parameters/EventTimeBeforeQuery'
      - $ref: '#/components/parameters/ActionQuery'
      - $ref: '#/components/parameters/AggregatedQuery'
      responses:
        '200':
          description: Paginated network observability events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListNetworkObservabilityResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/agent/create:
    post:
      operationId: createAgent
      summary: Create an Agent resource.
      description: >
        Creates an agent record and Agent custom resource. The request returns
        after the Agent resource is created and does not wait for the Agent to
        become ready.
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        '201':
          description: Agent resource created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/agent/delete:
    post:
      operationId: deleteAgent
      summary: Delete an Agent resource.
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAgentRequest'
      responses:
        '204':
          description: Agent was deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workflows:
    post:
      operationId: createWorkflow
      summary: Create a workflow definition.
      description: >
        Creates a normalized workflow DAG for a single agent. The workflow
        definition is stored as metadata, nodes, and edges, and later retrieval
        can derive a markdown execution playbook from the structured graph.
      tags: [workflows]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowRequest'
      responses:
        '201':
          description: Workflow created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workflows/{agentName}:
    delete:
      operationId: deleteWorkflows
      summary: Delete workflow definitions.
      description: >
        Deletes multiple persisted workflow DAGs for one agent in a single
        request. Deletion is strict: if any requested workflow name does not
        exist, the request fails and no workflows are deleted.
      tags: [workflows]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteWorkflowsRequest'
      responses:
        '204':
          description: Workflows deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workflows/{agentName}/{workflowName}:
    get:
      operationId: getWorkflow
      summary: Get a workflow definition.
      description: >
        Retrieves a persisted workflow DAG for a single agent. The response
        preserves the normalized workflow structure so clients can derive a
        detailed execution playbook from the graph.
      tags: [workflows]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - name: workflowName
        in: path
        required: true
        description: Workflow name scoped to one agent.
        schema:
          $ref: '#/components/schemas/WorkflowName'
      responses:
        '200':
          description: Workflow definition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workflow-runs/{name}/status:
    patch:
      operationId: patchWorkflowRunStatus
      summary: Set a WorkflowRun terminal status.
      description: >
        Marks a running WorkflowRun as succeeded or failed. The gateway owns
        request validation and state-transition checks, then patches the
        WorkflowRun status in the configured namespace.
      tags: [workflows]
      parameters:
      - name: name
        in: path
        required: true
        description: WorkflowRun resource name.
        schema:
          $ref: '#/components/schemas/WorkflowRunName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchWorkflowRunStatusRequest'
      responses:
        '204':
          description: WorkflowRun status updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workflow-summaries/{agentName}:
    get:
      operationId: listWorkflowSummaries
      summary: List workflow summaries.
      description: >
        Lists saved workflow metadata for a single agent without loading the
        full workflow graph.
      tags: [workflows]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      responses:
        '200':
          description: Workflow summaries for one agent.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/agent/update/{agentName}:
    post:
      operationId: updateAgent
      summary: Update an Agent resource.
      description: >
        Updates mutable Agent fields for an existing Agent. The agent name in
        the path identifies the Agent and is immutable.
      tags: [agents]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        '200':
          description: Agent resource updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/agent/watch:
    post:
      operationId: watchAgents
      summary: Watch agent status changes.
      description: >
        Returns an SSE stream. Each event data payload is a JSON object matching
        WatchAgentsEvent. If agent_names is omitted or empty, all known agents
        are watched.
      tags: [agents]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchAgentsRequest'
      responses:
        '200':
          description: Stream of agent status changes.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/WatchAgentsEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/secret/{agentName}/put:
    post:
      operationId: putSecret
      summary: Store or overwrite secrets for an agent.
      description: >
        Creates or overwrites key-value secrets under the agent. Each secret
        is bound to one or more hosts and is only injected for matching CONNECT
        destinations.
        Keys may contain alphanumeric characters and underscores, up to 128
        characters. Values are limited to 48 KB each. Hosts may be exact
        hostnames, wildcard hostnames with a leading "*.", exact IPv4/IPv6
        addresses, or IPv4/IPv6 CIDR ranges.
      tags: [secrets]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutSecretsRequest'
      responses:
        '201':
          description: Secrets stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutSecretsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/secret/{agentName}/delete:
    post:
      operationId: deleteSecret
      summary: Delete secrets for an agent.
      description: >
        Deletes the specified secret keys for the agent. Missing keys are
        ignored.
      tags: [secrets]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteSecretsRequest'
      responses:
        '204':
          description: Secrets deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/secret/{agentName}/list:
    get:
      operationId: listSecrets
      summary: List secret keys for an agent.
      description: >
        Returns a paginated list of secret keys with created and last modified
        timestamps. Secret values are never included in the response.
      tags: [secrets]
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated secret keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSecretsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/environment/list:
    get:
      operationId: listEnvironments
      summary: List paginated Environment resources.
      tags: [environments]
      parameters:
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        '200':
          description: Paginated environments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvironmentsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/environment/create:
    post:
      operationId: createEnvironment
      summary: Create an Environment resource.
      tags: [environments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnvironmentRequest'
      responses:
        '201':
          description: Environment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/environment/delete:
    post:
      operationId: deleteEnvironment
      summary: Delete an Environment resource.
      tags: [environments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteEnvironmentRequest'
      responses:
        '204':
          description: Environment deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/environment/update/{name}:
    post:
      operationId: updateEnvironment
      summary: Update an Environment resource.
      description: >
        Updates the packages list for an existing Environment. The name in the
        path identifies the Environment.
      tags: [environments]
      parameters:
      - $ref: '#/components/parameters/EnvironmentNamePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEnvironmentRequest'
      responses:
        '200':
          description: Environment updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    AgentNameQuery:
      name: agent_name
      in: query
      required: true
      description: Agent name.
      schema:
        $ref: '#/components/schemas/AgentName'

    AgentNamePath:
      name: agentName
      in: path
      required: true
      description: Agent name.
      schema:
        $ref: '#/components/schemas/AgentName'

    EnvironmentNamePath:
      name: name
      in: path
      required: true
      description: Environment name.
      schema:
        $ref: '#/components/schemas/EnvironmentName'

    AgentNameFilterQuery:
      name: agent_name
      in: query
      required: false
      description: Optional agent name filters. Repeat the query parameter for multiple agents.
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/AgentName'

    LimitQuery:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 50

    PageTokenQuery:
      name: page_token
      in: query
      required: false
      description: Opaque pagination token from a previous response.
      schema:
        type: string
        minLength: 1

    TraceIDQuery:
      name: trace_id
      in: query
      required: true
      description: Lowercase hexadecimal OTLP trace ID.
      schema:
        $ref: '#/components/schemas/TraceID'

    SpanIDQuery:
      name: span_id
      in: query
      required: true
      description: Lowercase hexadecimal OTLP span ID.
      schema:
        $ref: '#/components/schemas/SpanID'

    SessionIDQuery:
      name: session_id
      in: query
      required: false
      description: Optional root session ID.
      schema:
        type: string
        minLength: 1

    StartedAfterQuery:
      name: started_after
      in: query
      required: false
      description: Inclusive lower bound for trace start time.
      schema:
        type: string
        format: date-time

    StartedBeforeQuery:
      name: started_before
      in: query
      required: false
      description: Inclusive upper bound for trace start time.
      schema:
        type: string
        format: date-time

    EventTimeAfterQuery:
      name: event_time_after
      in: query
      required: false
      description: Inclusive lower bound for event time.
      schema:
        type: string
        format: date-time

    EventTimeBeforeQuery:
      name: event_time_before
      in: query
      required: false
      description: Inclusive upper bound for event time.
      schema:
        type: string
        format: date-time

    ActionQuery:
      name: action
      in: query
      required: false
      description: Optional observability action filter.
      schema:
        $ref: '#/components/schemas/ObservabilityAction'

    AggregatedQuery:
      name: aggregated
      in: query
      required: false
      description: When true, returns aggregated events with occurrence counts over the time range.
      schema:
        type: boolean
        default: false

  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Request conflicts with current agent state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    TraceID:
      type: string
      minLength: 32
      maxLength: 32
      pattern: '^[0-9a-f]{32}$'
      description: Lowercase hexadecimal OTLP trace ID.

    SpanID:
      type: string
      minLength: 16
      maxLength: 16
      pattern: '^[0-9a-f]{16}$'
      description: Lowercase hexadecimal OTLP span ID.

    OptionalSpanID:
      type: string
      maxLength: 16
      pattern: '^([0-9a-f]{16})?$'
      description: Lowercase hexadecimal OTLP span ID, or empty for root spans.

    ObservabilityAction:
      type: string
      enum: [Allowed, Blocked]

    AgentName:
      type: string
      minLength: 1
      maxLength: 32
      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'

    EnvironmentName:
      type: string
      minLength: 1
      maxLength: 32
      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      description: Environment resource name.

    WorkflowName:
      type: string
      minLength: 1
      maxLength: 32
      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      description: Workflow name scoped to one agent.

    WorkflowRunName:
      type: string
      minLength: 1
      maxLength: 253
      pattern: '^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$'
      description: WorkflowRun resource name.

    WorkflowNodeName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      description: Stable workflow node identifier.

    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        details:
          $ref: '#/components/schemas/JSONValue'
      required: [code, message]

    FieldError:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
      required: [field, message]

    WorkflowRunTerminalPhase:
      type: string
      enum:
      - Succeeded
      - Failed

