        access_token:
          type: string
        expires_at:
          type: string
          format: date-time
        token_type:
          type: string
        scopes:
          type: array
          items:
            type: string
            minLength: 1
        registration:
          $ref: '#/components/schemas/JSONObject'
        revocation:
          $ref: '#/components/schemas/JSONObject'
