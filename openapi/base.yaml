      maxLength: 128
      pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
      description: Secret key name. Must be a valid environment variable name.

    SecretValue:
      type: string
      maxLength: 49152
      description: Secret value. Max 48 KB.

    SecretHost:
      type: string
      minLength: 1
      maxLength: 253
      description: >
        Allowed request host. Use an exact hostname, wildcard hostname with a
        leading "*." or "**.", exact IPv4/IPv6 address, or IPv4/IPv6 CIDR
        range. "*." matches exactly a subdomain label, while "**." matches
        any subdomain depth. Wildcards do not match the apex domain.

