    MCPConnectionQueryParameterLocation:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
      required: [name]

    MCPConnectionCookieLocation:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
      required: [name]

    MCPConnectionReason:
      type: string
      enum: [Ready, ProbePending, Unreachable, InvalidCredentials, ProtocolError, InternalError]

    MCPConnectionLifecycle:
      type: string
      enum: [Accepted, Ready, Error]

    ListMCPConnectionsResponse:
      type: object
      additionalProperties: false
      properties:
        mcp_connections:
          type: array
