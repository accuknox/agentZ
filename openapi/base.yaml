      - EventTrailTargetOrganizationMembership
      - EventTrailTargetWorkspace
      - EventTrailTargetRole
      - EventTrailTargetSandbox
      - EventTrailTargetSkill
      - EventTrailTargetTeam
      - EventTrailTargetMCPConnection
      - EventTrailTargetInferenceProvider
      - EventTrailTargetInferencePool
      - EventTrailTargetAgent

    EventTrailField:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          enum: [member_id, name, provisioning_attempt, role, slug, state, user_id]
          x-enum-varnames:
          - EventTrailFieldMemberID
          - EventTrailFieldName
          - EventTrailFieldProvisioningAttempt
          - EventTrailFieldRole
          - EventTrailFieldSlug
          - EventTrailFieldState
          - EventTrailFieldUserID
        value:
          type: string
      required: [field, value]

    EventTrailActor:
      type: object
      additionalProperties: false
      properties:
        type:
