        slug:
          type: string
      required: [id]

    EventTrailFilters:
      type: object
      additionalProperties: false
      properties:
        actors:
          type: array
          items:
            $ref: '#/components/schemas/EventTrailActorFilter'
        categories:
          type: array
          items:
            type: string
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/EventTrailWorkspaceFilter'
        target_types:
          type: array
          items:
            $ref: '#/components/schemas/EventTrailTargetType'
      required: [actors, categories, workspaces, target_types]

    ListEventTrailEventsResponse:
