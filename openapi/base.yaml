            $ref: '#/components/schemas/ResourceReference'
    WatchMCPConnectionsEvent:
      type: object
      additionalProperties: false
      properties:
        mcp_connections:
          type: array
          items:
            $ref: '#/components/schemas/MCPConnectionSummary'
      required: [mcp_connections]

    CreateMCPConnectionRequest:
      type: object
      additionalProperties: false
      properties:
        name:
