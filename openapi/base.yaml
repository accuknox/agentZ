      type: string
      maxLength: 49152
      description: Secret value. Max 48 KB.

    SecretHost:
      type: string
      minLength: 1
      maxLength: 253
      description: >
        Allowed request host. Use an exact hostname, wildcard hostname with a
        leading "*." or "**.", exact IPv4/IPv6 address, or IPv4/IPv6 CIDR
        range. "*." matches exactly one subdomain label, while "**." matches
        any subdomain depth. Wildcards do not match the apex domain.

