    WorkflowInputSchema:
      type: object
      additionalProperties: false
      description: |
        Per-input validation schema. Only these keys are accepted: type,
        description, required, default, enum, minLength, maxLength, pattern,
        format, minimum, maximum, exclusiveMinimum, exclusiveMaximum, and
        multipleOf. Extra JSON Schema metadata is not supported.
      properties:
        type:
          $ref: '#/components/schemas/WorkflowInputType'
        description:
          type: string
          minLength: 1
        required:
          type: boolean
        default:
          $ref: '#/components/schemas/WorkflowInputScalarValue'
        enum:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/WorkflowInputScalarValue'
        minLength:
          type: integer
          minimum: 0
        maxLength:
          type: integer
          minimum: 0
        pattern:
          type: string
          minLength: 1
        format:
          $ref: '#/components/schemas/WorkflowInputStringFormat'
        minimum:
          type: number
          format: double
        maximum:
          type: number
          format: double
        exclusiveMinimum:
          type: number
          format: double
        exclusiveMaximum:
          type: number
          format: double
        multipleOf:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
      required:
      - type
      - required

