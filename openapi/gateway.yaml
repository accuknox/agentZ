components:
  callbacks: {}
  examples: {}
  headers: {}
  links: {}
  parameters:
    ActionQuery:
      description: Optional observability action filter.
      in: query
      name: action
      required: false
      schema:
        $ref: '#/components/schemas/ObservabilityAction'
    AgentNameFilterQuery:
      description: Optional agent name filters. Repeat the query parameter for multiple agents.
      explode: true
      in: query
      name: agent_name
      required: false
      schema:
        items:
          $ref: '#/components/schemas/AgentName'
        type: array
      style: form
    AgentNamePath:
      description: Agent name.
      in: path
      name: agentName
      required: true
      schema:
        $ref: '#/components/schemas/AgentName'
    AgentNameQuery:
      description: Agent name.
      in: query
      name: agent_name
      required: true
      schema:
        $ref: '#/components/schemas/AgentName'
    AggregatedQuery:
      description: When true, returns aggregated events with occurrence counts over the time range.
      in: query
      name: aggregated
      required: false
      schema:
        default: false
        type: boolean
    EnvironmentNamePath:
      description: Environment name.
      in: path
      name: name
      required: true
      schema:
        $ref: '#/components/schemas/EnvironmentName'
    EventTimeAfterQuery:
      description: Inclusive lower bound for event time.
      in: query
      name: event_time_after
      required: false
      schema:
        format: date-time
        type: string
    EventTimeBeforeQuery:
      description: Inclusive upper bound for event time.
      in: query
      name: event_time_before
      required: false
      schema:
        format: date-time
        type: string
    FromDateQuery:
      description: Inclusive lower bound for MCP tool activity date.
      in: query
      name: from
      required: true
      schema:
        format: date
        type: string
    LimitQuery:
      description: Maximum number of items to return.
      in: query
      name: limit
      required: false
      schema:
        default: 50
        format: int32
        maximum: 200
        minimum: 1
        type: integer
    MCPConnectionNamePath:
      description: MCPConnection name.
      in: path
      name: name
      required: true
      schema:
        $ref: '#/components/schemas/MCPConnectionName'
    PageTokenQuery:
      description: Opaque pagination token from a previous response.
      in: query
      name: page_token
      required: false
      schema:
        minLength: 1
        type: string
    SessionIDQuery:
      description: Optional root session ID.
      in: query
      name: session_id
      required: false
      schema:
        minLength: 1
        type: string
    SpanIDQuery:
      description: Lowercase hexadecimal OTLP span ID.
      in: query
      name: span_id
      required: true
      schema:
        $ref: '#/components/schemas/SpanID'
    StartedAfterQuery:
      description: Inclusive lower bound for trace start time.
      in: query
      name: started_after
      required: false
      schema:
        format: date-time
        type: string
    StartedBeforeQuery:
      description: Inclusive upper bound for trace start time.
      in: query
      name: started_before
      required: false
      schema:
        format: date-time
        type: string
    ToDateQuery:
      description: Inclusive upper bound for MCP tool activity date.
      in: query
      name: to
      required: true
      schema:
        format: date
        type: string
    TraceIDQuery:
      description: Lowercase hexadecimal OTLP trace ID.
      in: query
      name: trace_id
      required: true
      schema:
        $ref: '#/components/schemas/TraceID'
  requestBodies: {}
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Request validation failed.
    Conflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Request conflicts with current agent state.
    InternalError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Unexpected server error.
    NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: Requested resource was not found.
  schemas:
    Agent:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        environmentName:
          $ref: '#/components/schemas/EnvironmentName'
        last_activity:
          format: date-time
          type: string
        modified_at:
          format: date-time
          type: string
        name:
          $ref: '#/components/schemas/AgentName'
        status:
          $ref: '#/components/schemas/AgentStatus'
      required:
      - name
      - environmentName
      - last_activity
      - created_at
      - modified_at
      - status
      type: object
    AgentName:
      maxLength: 32
      minLength: 1
      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
      type: string
    AgentOpencodeConfig:
      additionalProperties: false
      properties:
        instruction:
          maxLength: 4096
          type: string
        model:
          type: string
        providers:
          additionalProperties:
            $ref: '#/components/schemas/AgentOpencodeProviderConfig'
          type: object
        smallModel:
          type: string
      type: object
    AgentOpencodeProviderConfig:
      additionalProperties: false
      properties:
        baseURL:
          type: string
        env:
          items:
            type: string
          type: array
      type: object
    AgentStatus:
      enum:
      - UNSPECIFIED
      - PROGRESSING
      - DEGRADED
      - DELETED
      - IDLE
      type: string
    CreateAgentRequest:
      additionalProperties: false
      properties:
        env:
          additionalProperties:
            type: string
          type: object
        environmentName:
          $ref: '#/components/schemas/EnvironmentName'
        name:
          $ref: '#/components/schemas/AgentName'
        opencode:
          $ref: '#/components/schemas/AgentOpencodeConfig'
      required:
      - name
      - environmentName
      type: object
    CreateEnvironmentRequest:
      additionalProperties: false
      properties:
        allowed_hosts:
          items:
            minLength: 1
            type: string
          type: array
        mcp_connection_refs:
          items:
            $ref: '#/components/schemas/MCPConnectionRef'
          type: array
        name:
          $ref: '#/components/schemas/EnvironmentName'
        packages:
          items:
            minLength: 1
            type: string
          type: array
      required:
      - name
      type: object
    CreateMCPConnectionRequest:
      additionalProperties: false
      properties:
        auth:
          $ref: '#/components/schemas/MCPConnectionAuth'
        credentials:
          $ref: '#/components/schemas/MCPConnectionCredentials'
        endpoint:
          $ref: '#/components/schemas/MCPConnectionEndpoint'
        name:
          $ref: '#/components/schemas/MCPConnectionName'
      required:
      - name
      - endpoint
      - auth
      - credentials
      type: object
    CreateWorkflowRequest:
      additionalProperties: false
      properties:
        edges:
          items:
            $ref: '#/components/schemas/WorkflowEdge'
          type: array
        inputs:
          $ref: '#/components/schemas/WorkflowInputs'
        nodes:
          items:
            $ref: '#/components/schemas/WorkflowNode'
          minItems: 1
          type: array
        summary:
          maxLength: 4096
          minLength: 1
          type: string
        title:
          maxLength: 256
          minLength: 1
          type: string
        workflow_name:
          $ref: '#/components/schemas/WorkflowName'
      required:
      - workflow_name
      - title
      - summary
      - nodes
      - edges
      type: object
    CreateWorkflowScheduleRequest:
      additionalProperties: false
      properties:
        failed_runs_history_limit:
          format: int32
          maximum: 10
          minimum: 1
          type: integer
        inputs:
          $ref: '#/components/schemas/JSONValue'
        name:
          $ref: '#/components/schemas/WorkflowScheduleName'
        schedule:
          minLength: 1
          type: string
        successful_runs_history_limit:
          format: int32
          maximum: 10
          minimum: 1
          type: integer
        suspend:
          type: boolean
        time_zone:
          type: string
        timeout_seconds:
          format: int32
          maximum: 604800
          minimum: 1
          type: integer
      required:
      - name
      - schedule
      - timeout_seconds
      type: object
    DeleteSecretsRequest:
      additionalProperties: false
      properties:
        keys:
          items:
            $ref: '#/components/schemas/SecretKey'
          maxItems: 100
          type: array
      required:
      - keys
      type: object
    DeleteWorkflowsRequest:
      additionalProperties: false
      properties:
        workflow_names:
          items:
            $ref: '#/components/schemas/WorkflowName'
          minItems: 1
          type: array
      required:
      - workflow_names
      type: object
    Environment:
      additionalProperties: false
      properties:
        allowed_hosts:
          items:
            minLength: 1
            type: string
          type: array
        created_at:
          format: date-time
          type: string
        mcp_connection_refs:
          items:
            $ref: '#/components/schemas/MCPConnectionRef'
          type: array
        metadata:
          additionalProperties: false
          properties:
            allowed_host_count:
              format: int32
              minimum: 0
              type: integer
            package_count:
              format: int32
              minimum: 0
              type: integer
            referenced_by_agent:
              type: boolean
          required:
          - package_count
          - allowed_host_count
          - referenced_by_agent
          type: object
        name:
          $ref: '#/components/schemas/EnvironmentName'
        packages:
          items:
            minLength: 1
            type: string
          type: array
      required:
      - name
      - packages
      - allowed_hosts
      - mcp_connection_refs
      - created_at
      - metadata
      type: object
    EnvironmentName:
      description: Environment resource name.
      maxLength: 32
      minLength: 1
      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
      type: string
    Error:
      additionalProperties: false
      properties:
        code:
          minLength: 1
          type: string
        details:
          $ref: '#/components/schemas/JSONValue'
        errors:
          items:
            $ref: '#/components/schemas/FieldError'
          type: array
        message:
          minLength: 1
          type: string
      required:
      - code
      - message
      type: object
    FieldError:
      additionalProperties: false
      properties:
        field:
          minLength: 1
          type: string
        message:
          minLength: 1
          type: string
      required:
      - field
      - message
      type: object
    FileObservabilityEvent:
      additionalProperties: false
      properties:
        action:
          $ref: '#/components/schemas/ObservabilityAction'
        agent_name:
          $ref: '#/components/schemas/AgentName'
        command_invocation:
          type: string
        event_time:
          format: date-time
          type: string
        file_path_accessed:
          type: string
        id:
          format: int64
          minimum: 1
          type: integer
        ingested_at:
          format: date-time
          type: string
        pod_name:
          type: string
        pod_namespace:
          type: string
        process:
          type: string
        source:
          type: string
      required:
      - id
      - agent_name
      - event_time
      - ingested_at
      - pod_namespace
      - pod_name
      - file_path_accessed
      - process
      - command_invocation
      - action
      - source
      type: object
    FileObservabilityEventAggregated:
      additionalProperties: false
      properties:
        action:
          $ref: '#/components/schemas/ObservabilityAction'
        agent_name:
          $ref: '#/components/schemas/AgentName'
        command_invocation:
          type: string
        file_path_accessed:
          type: string
        last_seen:
          format: date-time
          type: string
        occurrences:
          format: int64
          minimum: 1
          type: integer
        process:
          type: string
        source:
          type: string
      required:
      - agent_name
      - last_seen
      - file_path_accessed
      - process
      - command_invocation
      - action
      - source
      - occurrences
      type: object
    JSONObject:
      additionalProperties:
        $ref: '#/components/schemas/JSONValue'
      type: object
    JSONValue:
      oneOf:
      - type: boolean
      - type: number
      - type: string
      - items:
          $ref: '#/components/schemas/JSONValue'
        type: array
      - additionalProperties:
          $ref: '#/components/schemas/JSONValue'
        type: object
    ListAgentsResponse:
      additionalProperties: false
      properties:
        agents:
          items:
            $ref: '#/components/schemas/Agent'
          type: array
        next_page_token:
          type: string
      required:
      - agents
      - next_page_token
      type: object
    ListEnvironmentsResponse:
      additionalProperties: false
      properties:
        environments:
          items:
            $ref: '#/components/schemas/Environment'
          type: array
        next_page_token:
          type: string
      required:
      - environments
      - next_page_token
      type: object
    ListFileObservabilityResponse:
      additionalProperties: false
      properties:
        events:
          items:
            oneOf:
            - $ref: '#/components/schemas/FileObservabilityEvent'
            - $ref: '#/components/schemas/FileObservabilityEventAggregated'
          type: array
        next_page_token:
          type: string
      required:
      - events
      - next_page_token
      type: object
    ListMCPConnectionsResponse:
      additionalProperties: false
      properties:
        mcp_connections:
          items:
            $ref: '#/components/schemas/MCPConnectionSummary'
          type: array
        next_page_token:
          type: string
      required:
      - mcp_connections
      - next_page_token
      type: object
    ListNetworkObservabilityResponse:
      additionalProperties: false
      properties:
        events:
          items:
            oneOf:
            - $ref: '#/components/schemas/NetworkObservabilityEvent'
            - $ref: '#/components/schemas/NetworkObservabilityEventAggregated'
          type: array
        next_page_token:
          type: string
      required:
      - events
      - next_page_token
      type: object
    ListProcessObservabilityResponse:
      additionalProperties: false
      properties:
        events:
          items:
            oneOf:
            - $ref: '#/components/schemas/ProcessObservabilityEvent'
            - $ref: '#/components/schemas/ProcessObservabilityEventAggregated'
          type: array
        next_page_token:
          type: string
      required:
      - events
      - next_page_token
      type: object
    ListSecretsResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/SecretListItem'
          type: array
        next_page_token:
          type: string
      required:
      - items
      - next_page_token
      type: object
    ListSpansResponse:
      additionalProperties: false
      properties:
        next_page_token:
          type: string
        spans:
          items:
            $ref: '#/components/schemas/Span'
          type: array
      required:
      - spans
      - next_page_token
      type: object
    ListTraceSessionsResponse:
      additionalProperties: false
      properties:
        next_page_token:
          type: string
        trace_sessions:
          items:
            $ref: '#/components/schemas/TraceSession'
          type: array
      required:
      - trace_sessions
      - next_page_token
      type: object
    ListTracesResponse:
      additionalProperties: false
      properties:
        next_page_token:
          type: string
        traces:
          items:
            $ref: '#/components/schemas/Trace'
          type: array
      required:
      - traces
      - next_page_token
      type: object
    ListWorkflowRunsResponse:
      additionalProperties: false
      properties:
        next_page_token:
          type: string
        workflow_runs:
          items:
            $ref: '#/components/schemas/WorkflowRunSummary'
          type: array
      required:
      - workflow_runs
      - next_page_token
      type: object
    ListWorkflowSchedulesResponse:
      additionalProperties: false
      properties:
        next_page_token:
          type: string
        workflow_schedules:
          items:
            $ref: '#/components/schemas/WorkflowSchedule'
          type: array
      required:
      - workflow_schedules
      - next_page_token
      type: object
    MCPConnectionAuth:
      additionalProperties: false
      properties:
        bearer:
          $ref: '#/components/schemas/MCPConnectionBearerAuth'
        oauth:
          $ref: '#/components/schemas/MCPConnectionOAuthAuth'
      type: object
    MCPConnectionAuthLocation:
      additionalProperties: false
      properties:
        cookie:
          $ref: '#/components/schemas/MCPConnectionCookieLocation'
        header:
          $ref: '#/components/schemas/MCPConnectionHeaderLocation'
        query_parameter:
          $ref: '#/components/schemas/MCPConnectionQueryParameterLocation'
      type: object
    MCPConnectionBearerAuth:
      additionalProperties: false
      properties:
        location:
          $ref: '#/components/schemas/MCPConnectionAuthLocation'
      type: object
    MCPConnectionBearerCredentials:
      additionalProperties: false
      properties:
        token:
          minLength: 1
          type: string
      required:
      - token
      type: object
    MCPConnectionCookieLocation:
      additionalProperties: false
      properties:
        name:
          minLength: 1
          type: string
      required:
      - name
      type: object
    MCPConnectionCredentials:
      additionalProperties: false
      properties:
        bearer:
          $ref: '#/components/schemas/MCPConnectionBearerCredentials'
        oauth:
          $ref: '#/components/schemas/MCPConnectionOAuthCredentials'
      type: object
    MCPConnectionDetail:
      additionalProperties: false
      properties:
        auth:
          $ref: '#/components/schemas/MCPConnectionAuth'
        created_at:
          format: date-time
          type: string
        endpoint:
          $ref: '#/components/schemas/MCPConnectionEndpoint'
        message:
          type: string
        name:
          $ref: '#/components/schemas/MCPConnectionName'
        reason:
          $ref: '#/components/schemas/MCPConnectionReason'
        status:
          $ref: '#/components/schemas/MCPConnectionLifecycle'
        tool_catalog_ready:
          type: boolean
        tools:
          items:
            $ref: '#/components/schemas/MCPConnectionTool'
          type: array
      required:
      - name
      - endpoint
      - auth
      - created_at
      - status
      - reason
      - message
      - tool_catalog_ready
      - tools
      type: object
    MCPConnectionEndpoint:
      additionalProperties: false
      properties:
        headers:
          additionalProperties:
            type: string
          type: object
        insecure_skip_verify:
          type: boolean
        timeout:
          minLength: 1
          type: string
        url:
          minLength: 1
          type: string
      required:
      - url
      - insecure_skip_verify
      - headers
      type: object
    MCPConnectionHeaderLocation:
      additionalProperties: false
      properties:
        name:
          minLength: 1
          type: string
        prefix:
          minLength: 1
          type: string
      required:
      - name
      type: object
    MCPConnectionLifecycle:
      enum:
      - Accepted
      - Ready
      - Error
      type: string
    MCPConnectionName:
      description: MCPConnection resource name.
      maxLength: 32
      minLength: 1
      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
      type: string
    MCPConnectionOAuthAuth:
      additionalProperties: false
      properties:
        authorization_endpoint:
          type: string
        issuer:
          type: string
        location:
          $ref: '#/components/schemas/MCPConnectionAuthLocation'
        registration_endpoint:
          type: string
        resource:
          type: string
        scopes:
          items:
            minLength: 1
            type: string
          type: array
        token_endpoint:
          type: string
      type: object
    MCPConnectionOAuthCredentials:
      additionalProperties: false
      properties:
        access_token:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
        expires_at:
          format: date-time
          type: string
        refresh_token:
          type: string
        registration:
          $ref: '#/components/schemas/JSONObject'
        revocation:
          $ref: '#/components/schemas/JSONObject'
        scopes:
          items:
            minLength: 1
            type: string
          type: array
        token_type:
          type: string
      type: object
    MCPConnectionQueryParameterLocation:
      additionalProperties: false
      properties:
        name:
          minLength: 1
          type: string
      required:
      - name
      type: object
    MCPConnectionReason:
      enum:
      - Ready
      - ProbePending
      - Unreachable
      - InvalidCredentials
      - ProtocolError
      - InternalError
      type: string
    MCPConnectionRef:
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/MCPConnectionName'
        tools:
          items:
            $ref: '#/components/schemas/MCPConnectionToolRef'
          minItems: 1
          type: array
      required:
      - name
      - tools
      type: object
    MCPConnectionSummary:
      additionalProperties: false
      properties:
        auth_mode:
          type: string
        created_at:
          format: date-time
          type: string
        endpoint_url:
          type: string
        message:
          type: string
        name:
          $ref: '#/components/schemas/MCPConnectionName'
        reason:
          $ref: '#/components/schemas/MCPConnectionReason'
        status:
          $ref: '#/components/schemas/MCPConnectionLifecycle'
        tool_catalog_ready:
          type: boolean
        tool_count:
          format: int64
          minimum: 0
          type: integer
      required:
      - name
      - auth_mode
      - endpoint_url
      - created_at
      - status
      - reason
      - message
      - tool_catalog_ready
      - tool_count
      type: object
    MCPConnectionTool:
      additionalProperties: false
      properties:
        name:
          minLength: 1
          type: string
      required:
      - name
      type: object
    MCPConnectionToolRef:
      additionalProperties: false
      properties:
        name:
          minLength: 1
          type: string
        require_consent:
          type: boolean
      required:
      - name
      - require_consent
      type: object
    MCPGraphAgent:
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/AgentName'
      required:
      - name
      type: object
    MCPGraphConnection:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        server_url:
          format: uri
          type: string
      required:
      - id
      - name
      type: object
    MCPGraphEdge:
      additionalProperties: false
      properties:
        avg_latency_ms:
          format: double
          minimum: 0
          type: number
        failed_count:
          format: int64
          minimum: 0
          type: integer
        kind:
          enum:
          - agent_connection
          - connection_tool
          type: string
        last_called_at:
          format: date-time
          type: string
        source:
          type: string
        success_count:
          format: int64
          minimum: 0
          type: integer
        target:
          type: string
      required:
      - source
      - target
      - kind
      type: object
    MCPGraphResponse:
      additionalProperties: false
      properties:
        agent:
          $ref: '#/components/schemas/MCPGraphAgent'
        connections:
          items:
            $ref: '#/components/schemas/MCPGraphConnection'
          type: array
        edges:
          items:
            $ref: '#/components/schemas/MCPGraphEdge'
          type: array
        tools:
          items:
            $ref: '#/components/schemas/MCPGraphTool'
          type: array
      required:
      - agent
      - connections
      - tools
      - edges
      type: object
    MCPGraphTool:
      additionalProperties: false
      properties:
        connection_id:
          type: string
        id:
          type: string
        name:
          type: string
      required:
      - id
      - connection_id
      - name
      type: object
    NetworkObservabilityEvent:
      additionalProperties: false
      properties:
        action:
          $ref: '#/components/schemas/ObservabilityAction'
        agent_name:
          $ref: '#/components/schemas/AgentName'
        destination_domain:
          type: string
        destination_ip:
          type: string
        destination_port:
          format: int64
          minimum: 0
          type: integer
        event_time:
          format: date-time
          type: string
        id:
          format: int64
          minimum: 1
          type: integer
        ingested_at:
          format: date-time
          type: string
        pod_name:
          type: string
        pod_namespace:
          type: string
        protocol:
          type: string
        source:
          type: string
      required:
      - id
      - agent_name
      - event_time
      - ingested_at
      - pod_namespace
      - pod_name
      - destination_domain
      - destination_ip
      - destination_port
      - protocol
      - action
      - source
      type: object
    NetworkObservabilityEventAggregated:
      additionalProperties: false
      properties:
        action:
