  /api/secret/{agentName}:
    get:
      description: |
        Returns a paginated list of secret keys with created and last modified timestamps. Secret values are never included in the response.
      operationId: listSecrets
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSecretsResponse'
          description: Paginated secret keys.
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: List secret keys for an agent.
      tags:
      - secrets
    post:
      description: |
        Creates or overwrites key-value secrets under the agent. Each secret is bound to one or more hosts and is only injected for matching CONNECT destinations. Keys may contain alphanumeric characters and underscores, up to 128 characters. Values are limited to 48 KB each. Hosts may be exact hostnames, wildcard hostnames with a leading "*." or "**.", exact IPv4/IPv6 addresses, or IPv4/IPv6 CIDR ranges. "*." matches exactly one subdomain label, while "**." matches any subdomain depth.
      operationId: putSecret
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutSecretsRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutSecretsResponse'
          description: Secrets stored.
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Store or overwrite secrets for an agent.
      tags:
      - secrets
  /api/secret/{agentName}/delete:
    post:
      description: |
        Deletes the specified secret keys for the agent. Missing keys are ignored.
      operationId: deleteSecret
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteSecretsRequest'
        required: true
      responses:
        "204":
          description: Secrets deleted.
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Delete secrets for an agent.
      tags:
      - secrets
  /api/workflow/{agentName}:
    delete:
      description: |
        Deletes multiple persisted workflow DAGs for one agent in a single request. Deletion is strict: if any requested workflow name does not exist, the request fails and no workflows are deleted.
      operationId: deleteWorkflows
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteWorkflowsRequest'
        required: true
      responses:
        "204":
          description: Workflows deleted.
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Delete workflow definitions.
      tags:
      - workflows
    get:
      description: |
        Lists saved workflow metadata for a single agent without loading the full workflow graph.
      operationId: listWorkflowSummaries
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/WorkflowSummary'
                type: array
          description: Workflow summaries for one agent.
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: List workflow summaries.
      tags:
      - workflows
    post:
      description: |
        Creates a normalized workflow DAG for a single agent. The workflow definition is stored as metadata, nodes, and edges, and later retrieval can derive a markdown execution playbook from the structured graph.
      operationId: createWorkflow
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
          description: Workflow created.
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Create a workflow definition.
      tags:
      - workflows
  /api/workflow/{agentName}/{workflowName}:
    get:
      description: |
        Retrieves a persisted workflow DAG for a single agent. The response preserves the normalized workflow structure so clients can derive a detailed execution playbook from the graph.
      operationId: getWorkflow
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - description: Workflow name scoped to one agent.
        in: path
        name: workflowName
        required: true
        schema:
          $ref: '#/components/schemas/WorkflowName'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
          description: Workflow definition.
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Get a workflow definition.
      tags:
      - workflows
  /api/workflow/{agentName}/{workflowName}/run/{runName}/status:
    patch:
      description: |
        Marks a running WorkflowRun as succeeded or failed. The gateway owns request validation and state-transition checks, then patches the WorkflowRun status in the configured namespace.
      operationId: patchWorkflowRunStatus
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - description: Workflow name scoped to one agent.
        in: path
        name: workflowName
        required: true
        schema:
          $ref: '#/components/schemas/WorkflowName'
      - description: WorkflowRun resource name.
        in: path
        name: runName
        required: true
        schema:
          $ref: '#/components/schemas/WorkflowRunName'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchWorkflowRunStatusRequest'
        required: true
      responses:
        "204":
          description: WorkflowRun status updated.
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Set a WorkflowRun terminal status.
      tags:
      - workflows
  /api/workflow/{agentName}/{workflowName}/schedule:
    get:
      description: |
        Lists paginated workflow schedules for one workflow definition.
      operationId: listWorkflowSchedules
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - description: Workflow name scoped to one agent.
        in: path
        name: workflowName
        required: true
        schema:
          $ref: '#/components/schemas/WorkflowName'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkflowSchedulesResponse'
          description: Paginated workflow schedules for one workflow.
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: List workflow schedules.
      tags:
      - workflow-schedules
    post:
      description: |
        Creates a WorkflowSchedule resource for one agent workflow pair. The gateway forwards schedule validation to the existing Kubernetes webhook.
      operationId: createWorkflowSchedule
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - description: Workflow name scoped to one agent.
        in: path
        name: workflowName
        required: true
        schema:
          $ref: '#/components/schemas/WorkflowName'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkflowScheduleRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowSchedule'
          description: Workflow schedule created.
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Create a workflow schedule.
      tags:
      - workflow-schedules
  /api/workflow/{agentName}/{workflowName}/schedule/{scheduleName}:
    delete:
      description: |
        Deletes one workflow schedule addressed by agent, workflow, and schedule name.
      operationId: deleteWorkflowSchedule
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - description: Workflow name scoped to one agent.
        in: path
        name: workflowName
        required: true
        schema:
          $ref: '#/components/schemas/WorkflowName'
      - description: WorkflowSchedule resource name.
        in: path
        name: scheduleName
        required: true
        schema:
          $ref: '#/components/schemas/WorkflowScheduleName'
      responses:
        "204":
          description: Workflow schedule deleted.
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Delete a workflow schedule.
      tags:
      - workflow-schedules
    put:
      description: |
        Replaces all mutable workflow schedule fields for one existing schedule.
      operationId: updateWorkflowSchedule
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - description: Workflow name scoped to one agent.
        in: path
        name: workflowName
        required: true
        schema:
          $ref: '#/components/schemas/WorkflowName'
      - description: WorkflowSchedule resource name.
        in: path
        name: scheduleName
        required: true
        schema:
          $ref: '#/components/schemas/WorkflowScheduleName'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkflowScheduleRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowSchedule'
          description: Workflow schedule updated.
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Update a workflow schedule.
      tags:
      - workflow-schedules
  /api/workflow/{agentName}/{workflowName}/schedule/{scheduleName}/run:
    get:
      description: |
        Lists paginated workflow runs created from the addressed WorkflowSchedule.
      operationId: listWorkflowRuns
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - description: Workflow name scoped to one agent.
        in: path
        name: workflowName
        required: true
        schema:
          $ref: '#/components/schemas/WorkflowName'
      - description: WorkflowSchedule resource name.
        in: path
        name: scheduleName
        required: true
        schema:
          $ref: '#/components/schemas/WorkflowScheduleName'
      - description: Optional WorkflowRun phase filter.
        in: query
        name: status
        required: false
        schema:
          $ref: '#/components/schemas/WorkflowRunStatus'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkflowRunsResponse'
          description: Paginated workflow runs for one workflow schedule.
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: List workflow runs for a workflow schedule.
      tags:
      - workflow-schedules
    post:
      description: |
        Creates one WorkflowRun from the addressed WorkflowSchedule without overriding any schedule-derived execution fields.
      operationId: createWorkflowRun
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - description: Workflow name scoped to one agent.
        in: path
        name: workflowName
        required: true
        schema:
          $ref: '#/components/schemas/WorkflowName'
      - description: WorkflowSchedule resource name.
        in: path
        name: scheduleName
        required: true
        schema:
          $ref: '#/components/schemas/WorkflowScheduleName'
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunSummary'
          description: Workflow run accepted.
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Trigger one workflow run from a workflow schedule.
      tags:
      - workflow-schedules
  /api/workflow/{agentName}/{workflowName}/schedule/{scheduleName}/run/{runName}:
    delete:
      description: |
        Deletes one WorkflowRun created from the addressed WorkflowSchedule and waits until controller-driven cleanup completes.
      operationId: deleteWorkflowRun
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - description: Workflow name scoped to one agent.
        in: path
        name: workflowName
        required: true
        schema:
          $ref: '#/components/schemas/WorkflowName'
      - description: WorkflowSchedule resource name.
        in: path
        name: scheduleName
        required: true
        schema:
          $ref: '#/components/schemas/WorkflowScheduleName'
      - description: WorkflowRun resource name.
        in: path
        name: runName
        required: true
        schema:
          $ref: '#/components/schemas/WorkflowRunName'
      responses:
        "204":
          description: Workflow run deleted.
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Delete one workflow run.
      tags:
      - workflow-schedules
    get:
      description: |
        Returns all public details for one WorkflowRun created from the addressed WorkflowSchedule.
      operationId: getWorkflowRun
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - description: Workflow name scoped to one agent.
        in: path
        name: workflowName
        required: true
        schema:
          $ref: '#/components/schemas/WorkflowName'
      - description: WorkflowSchedule resource name.
        in: path
        name: scheduleName
        required: true
        schema:
          $ref: '#/components/schemas/WorkflowScheduleName'
      - description: WorkflowRun resource name.
        in: path
        name: runName
        required: true
        schema:
          $ref: '#/components/schemas/WorkflowRunName'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunDetail'
          description: Workflow run details.
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Get one workflow run.
      tags:
      - workflow-schedules
  /api/workflow/{agentName}/{workflowName}/schedule/{scheduleName}/run/watch:
    post:
      description: |
        Returns an SSE stream. Each event data payload is a JSON object matching WatchWorkflowRunsEvent. If run_names is omitted or empty, all runs for the addressed WorkflowSchedule are watched.
      operationId: watchWorkflowRuns
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - description: Workflow name scoped to one agent.
        in: path
        name: workflowName
        required: true
        schema:
          $ref: '#/components/schemas/WorkflowName'
      - description: WorkflowSchedule resource name.
        in: path
        name: scheduleName
        required: true
        schema:
          $ref: '#/components/schemas/WorkflowScheduleName'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchWorkflowRunsRequest'
        required: false
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/WatchWorkflowRunsEvent'
          description: Stream of workflow run updates.
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Watch workflow runs for a workflow schedule.
      tags:
      - workflow-schedules
  /api/workflow/{agentName}/schedule:
    get:
      description: |
        Lists paginated workflow schedules for one agent across all workflows.
      operationId: listAgentWorkflowSchedules
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkflowSchedulesResponse'
          description: Paginated workflow schedules for one agent.
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: List workflow schedules for one agent.
      tags:
      - workflow-schedules
