        nodes:
          items:
            $ref: '#/components/schemas/WorkflowNode'
          type: array
        summary:
          type: string
        title:
          type: string
        updated_at:
          format: date-time
          type: string
        workflow_name:
          $ref: '#/components/schemas/WorkflowName'
      required:
      - agent_name
      - workflow_name
      - title
      - summary
      - nodes
      - edges
      - created_at
      - updated_at
      type: object
    WorkflowEdge:
      additionalProperties: false
      properties:
        branch_label:
          maxLength: 256
          type: string
        condition_summary:
          maxLength: 1024
          type: string
        source:
          $ref: '#/components/schemas/WorkflowNodeName'
        target:
          $ref: '#/components/schemas/WorkflowNodeName'
      required:
      - source
      - target
      - branch_label
      - condition_summary
      type: object
    WorkflowInputScalarValue:
      oneOf:
      - type: boolean
      - format: double
        type: number
      - type: string
    WorkflowInputSchema:
      additionalProperties: false
      description: |
        Per-input validation schema. Only these keys are accepted: type,
        description, required, default, enum, minLength, maxLength, pattern,
        format, minimum, maximum, exclusiveMinimum, exclusiveMaximum, and
        multipleOf. Extra JSON Schema metadata is not supported.
      properties:
        default:
          $ref: '#/components/schemas/WorkflowInputScalarValue'
        description:
          minLength: 1
          type: string
        enum:
          items:
            $ref: '#/components/schemas/WorkflowInputScalarValue'
          minItems: 1
          type: array
          uniqueItems: true
        exclusiveMaximum:
          format: double
          type: number
        exclusiveMinimum:
          format: double
          type: number
        format:
          $ref: '#/components/schemas/WorkflowInputStringFormat'
        maxLength:
          minimum: 0
          type: integer
        maximum:
          format: double
          type: number
        minLength:
          minimum: 0
          type: integer
        minimum:
          format: double
          type: number
        multipleOf:
          exclusiveMinimum: true
          format: double
          minimum: 0
          type: number
        pattern:
          minLength: 1
          type: string
        required:
          type: boolean
        type:
          $ref: '#/components/schemas/WorkflowInputType'
      required:
      - type
      - required
      type: object
    WorkflowInputStringFormat:
      enum:
      - email
      - uri
      - uuid
      - date
      - date-time
      type: string
    WorkflowInputType:
      enum:
      - string
      - integer
      - number
      - boolean
      type: string
    WorkflowInputs:
      additionalProperties:
        $ref: '#/components/schemas/WorkflowInputSchema'
      type: object
    WorkflowName:
      description: Workflow name scoped to one agent.
      maxLength: 32
      minLength: 1
      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
      type: string
    WorkflowNode:
      additionalProperties: false
      properties:
        done_criteria:
          maxLength: 2048
          minLength: 1
          type: string
        goal:
          maxLength: 2048
          minLength: 1
          type: string
        instructions:
          maxLength: 16384
          minLength: 1
          type: string
        name:
          $ref: '#/components/schemas/WorkflowNodeName'
        preferred_tools:
          items:
            maxLength: 128
            minLength: 1
            type: string
          type: array
      required:
      - name
      - instructions
      - goal
      - done_criteria
      type: object
    WorkflowNodeName:
      description: Stable workflow node identifier.
      maxLength: 64
      minLength: 1
      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
      type: string
    WorkflowRunDetail:
      additionalProperties: false
      properties:
        agent_name:
          $ref: '#/components/schemas/AgentName'
        completed_at:
          format: date-time
          type: string
        created_at:
          format: date-time
          type: string
        duration_seconds:
          format: int64
          minimum: 0
          type: integer
        inputs:
          $ref: '#/components/schemas/JSONValue'
        message:
          type: string
        name:
          $ref: '#/components/schemas/WorkflowRunName'
        reason:
          type: string
        schedule_name:
          $ref: '#/components/schemas/WorkflowScheduleName'
        session_id:
          type: string
        started_at:
          format: date-time
          type: string
        status:
          $ref: '#/components/schemas/WorkflowRunStatus'
        timeout_seconds:
          format: int32
          maximum: 604800
          minimum: 1
          type: integer
        workflow_name:
          $ref: '#/components/schemas/WorkflowName'
      required:
      - name
      - agent_name
      - workflow_name
      - inputs
      - timeout_seconds
      - status
      - reason
      - message
      - created_at
      type: object
    WorkflowRunName:
      description: WorkflowRun resource name.
      maxLength: 253
      minLength: 1
      pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
      type: string
    WorkflowRunStatus:
      enum:
      - Pending
      - Running
      - Succeeded
      - Failed
      - Unacked
      type: string
    WorkflowRunSummary:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        duration_seconds:
          format: int64
          minimum: 0
          type: integer
        name:
          $ref: '#/components/schemas/WorkflowRunName'
        reason:
          type: string
        status:
          $ref: '#/components/schemas/WorkflowRunStatus'
        workflow_name:
          $ref: '#/components/schemas/WorkflowName'
      required:
      - name
      - workflow_name
      - status
      - reason
      - created_at
      type: object
    WorkflowRunTerminalPhase:
      enum:
      - Succeeded
      - Failed
      type: string
    WorkflowSchedule:
      additionalProperties: false
      properties:
        agent_name:
          $ref: '#/components/schemas/AgentName'
        created_at:
          format: date-time
          type: string
        failed_runs_history_limit:
          format: int32
          maximum: 10
          minimum: 1
          type: integer
        inputs:
          $ref: '#/components/schemas/JSONValue'
        name:
          $ref: '#/components/schemas/WorkflowScheduleName'
        schedule:
          minLength: 1
          type: string
        successful_runs_history_limit:
          format: int32
          maximum: 10
          minimum: 1
          type: integer
        suspend:
          type: boolean
        time_zone:
          type: string
        timeout_seconds:
          format: int32
          maximum: 604800
          minimum: 1
          type: integer
        workflow_name:
          $ref: '#/components/schemas/WorkflowName'
      required:
      - name
      - agent_name
      - workflow_name
      - schedule
      - timeout_seconds
      - inputs
      - suspend
      - successful_runs_history_limit
      - failed_runs_history_limit
      - created_at
      type: object
    WorkflowScheduleName:
      description: WorkflowSchedule resource name.
      maxLength: 32
      minLength: 1
      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
      type: string
    WorkflowSummary:
      additionalProperties: false
      properties:
        summary:
          type: string
        title:
          type: string
        updated_at:
          format: date-time
          type: string
        workflow_name:
          $ref: '#/components/schemas/WorkflowName'
      required:
      - workflow_name
      - title
      - summary
      - updated_at
      type: object
  securitySchemes: {}
info:
  description: HTTP API for ClawArmor agents, lens, secrets, and environments.
  title: ClawArmor HTTP API
  version: 0.1.0
openapi: 3.0.3
paths:
  /api/agent:
    get:
      operationId: listAgents
      parameters:
      - $ref: '#/components/parameters/AgentNameFilterQuery'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAgentsResponse'
          description: Paginated agent summaries.
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: List paginated agent summaries.
      tags:
      - agents
    post:
      description: |
        Creates an agent record and Agent custom resource. The request returns after the Agent resource is created and does not wait for the Agent to become ready.
      operationId: createAgent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
          description: Agent resource created.
        "400":
          $ref: '#/components/responses/BadRequest'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Create an Agent resource.
      tags:
      - agents
  /api/agent/{agentName}:
    delete:
      operationId: deleteAgent
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      responses:
        "204":
          description: Agent was deleted.
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Delete an Agent resource.
      tags:
      - agents
    put:
      description: |
        Updates mutable Agent fields for an existing Agent. The agent name in the path identifies the Agent and is immutable.
      operationId: updateAgent
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
          description: Agent resource updated.
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Update an Agent resource.
      tags:
      - agents
  /api/agent/watch:
    post:
      description: |
        Returns an SSE stream. Each event data payload is a JSON object matching WatchAgentsEvent. If agent_names is omitted or empty, all known agents are watched.
      operationId: watchAgents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchAgentsRequest'
        required: false
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/WatchAgentsEvent'
          description: Stream of agent status changes.
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Watch agent status changes.
      tags:
      - agents
  /api/environment:
    get:
      operationId: listEnvironments
      parameters:
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEnvironmentsResponse'
          description: Paginated environments.
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: List paginated Environment resources.
      tags:
      - environments
    post:
      operationId: createEnvironment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnvironmentRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
          description: Environment created.
        "400":
          $ref: '#/components/responses/BadRequest'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Create an Environment resource.
      tags:
      - environments
  /api/environment/{environmentName}:
    delete:
      operationId: deleteEnvironment
      parameters:
      - description: Environment resource name.
        in: path
        name: environmentName
        required: true
        schema:
          $ref: '#/components/schemas/EnvironmentName'
      responses:
        "204":
          description: Environment deleted.
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Delete an Environment resource.
      tags:
      - environments
    put:
      description: |
        Updates the packages list for an existing Environment. The name in the path identifies the Environment.
      operationId: updateEnvironment
      parameters:
      - description: Environment resource name.
        in: path
        name: environmentName
        required: true
        schema:
          $ref: '#/components/schemas/EnvironmentName'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEnvironmentRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
          description: Environment updated.
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Update an Environment resource.
      tags:
      - environments
  /api/lens/{agentName}/{sessionID}/trace:
    get:
      operationId: listTraceSessions
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - description: Session identifier scoped to one agent.
        in: path
        name: sessionID
        required: true
        schema:
          minLength: 1
          type: string
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      - $ref: '#/components/parameters/StartedAfterQuery'
      - $ref: '#/components/parameters/StartedBeforeQuery'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTraceSessionsResponse'
          description: Paginated per-session trace summaries.
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: List paginated per-session trace summaries.
      tags:
      - lens
  /api/lens/{agentName}/{sessionID}/trace/{traceID}/span:
    get:
      operationId: listSpans
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - description: Session identifier scoped to one agent.
        in: path
        name: sessionID
        required: true
        schema:
          minLength: 1
          type: string
      - description: Trace identifier scoped to one session.
        in: path
        name: traceID
        required: true
        schema:
          $ref: '#/components/schemas/TraceID'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSpansResponse'
          description: Paginated spans for a trace.
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: List paginated spans for a trace.
      tags:
      - lens
  /api/lens/{agentName}/{sessionID}/trace/{traceID}/span/{spanID}:
    get:
      operationId: getSpanDetail
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - description: Session identifier scoped to one agent.
        in: path
        name: sessionID
        required: true
        schema:
          minLength: 1
          type: string
      - description: Trace identifier scoped to one session.
        in: path
        name: traceID
        required: true
        schema:
          $ref: '#/components/schemas/TraceID'
      - description: Span identifier scoped to one trace.
        in: path
        name: spanID
        required: true
        schema:
          $ref: '#/components/schemas/SpanID'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpanDetailResponse'
          description: Span detail with payload and correlated events.
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Get span details and correlated OS observability.
      tags:
      - lens
  /api/lens/{agentName}/mcp/graph:
    get:
      operationId: getMCPGraph
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - $ref: '#/components/parameters/FromDateQuery'
      - $ref: '#/components/parameters/ToDateQuery'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPGraphResponse'
          description: Graph-ready MCP observability for one agent.
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Get MCP observability graph data for one agent and date range.
      tags:
      - lens
  /api/lens/{agentName}/observability/file:
    get:
      operationId: listFileObservability
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      - $ref: '#/components/parameters/EventTimeAfterQuery'
      - $ref: '#/components/parameters/EventTimeBeforeQuery'
      - $ref: '#/components/parameters/ActionQuery'
      - $ref: '#/components/parameters/AggregatedQuery'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFileObservabilityResponse'
          description: Paginated file observability events.
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: List paginated file observability events.
      tags:
      - lens
  /api/lens/{agentName}/observability/network:
    get:
      operationId: listNetworkObservability
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      - $ref: '#/components/parameters/EventTimeAfterQuery'
      - $ref: '#/components/parameters/EventTimeBeforeQuery'
      - $ref: '#/components/parameters/ActionQuery'
      - $ref: '#/components/parameters/AggregatedQuery'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListNetworkObservabilityResponse'
          description: Paginated network observability events.
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: List paginated network observability events.
      tags:
      - lens
  /api/lens/{agentName}/observability/process:
    get:
      operationId: listProcessObservability
      parameters:
      - $ref: '#/components/parameters/AgentNamePath'
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      - $ref: '#/components/parameters/EventTimeAfterQuery'
      - $ref: '#/components/parameters/EventTimeBeforeQuery'
      - $ref: '#/components/parameters/ActionQuery'
      - $ref: '#/components/parameters/AggregatedQuery'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProcessObservabilityResponse'
          description: Paginated process observability events.
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: List paginated process observability events.
      tags:
      - lens
  /api/mcp-connection:
    get:
      operationId: listMCPConnections
      parameters:
      - $ref: '#/components/parameters/LimitQuery'
      - $ref: '#/components/parameters/PageTokenQuery'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMCPConnectionsResponse'
          description: Paginated MCPConnections.
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: List paginated MCPConnection resources.
      tags:
      - mcp-connections
    post:
      operationId: createMCPConnection
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMCPConnectionRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPConnectionDetail'
          description: MCPConnection created.
        "400":
          $ref: '#/components/responses/BadRequest'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Create an MCPConnection resource.
      tags:
      - mcp-connections
  /api/mcp-connection/{name}:
    delete:
      operationId: deleteMCPConnection
      parameters:
      - $ref: '#/components/parameters/MCPConnectionNamePath'
      responses:
        "204":
          description: MCPConnection deleted.
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          $ref: '#/components/responses/Conflict'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Delete an MCPConnection resource.
      tags:
      - mcp-connections
    get:
      operationId: getMCPConnection
      parameters:
      - $ref: '#/components/parameters/MCPConnectionNamePath'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPConnectionDetail'
          description: MCPConnection.
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Get an MCPConnection resource.
      tags:
      - mcp-connections
  /api/mcp-connection/watch:
    post:
      description: |
        Returns an SSE stream. Each event data payload is a JSON object matching WatchMCPConnectionsEvent. If names is omitted or empty, all MCP connections are watched.
      operationId: watchMCPConnections
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchMCPConnectionsRequest'
        required: false
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/WatchMCPConnectionsEvent'
          description: Stream of MCP connection updates.
        "400":
          $ref: '#/components/responses/BadRequest'
        "500":
          $ref: '#/components/responses/InternalError'
      summary: Watch MCP connection status changes.
      tags:
      - mcp-connections
  /api/opencode/{agentName}/agent:
    get:
      description: Get a list of all available AI agents in the OpenCode system.
      operationId: app.agents
      parameters:
      - in: query
        name: directory
        required: false
        schema:
          type: string
      - in: query
        name: workspace
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                description: List of agents
                items:
                  $ref: '#/components/schemas/OpencodeAgent'
                type: array
          description: List of agents
      summary: List agents
      tags:
      - instance
      x-codeSamples:
      - lang: js
        source: |-
          import { createOpencodeClient } from "@opencode-ai/sdk

          const client = createOpencodeClient()
          await client.app.agents({
            ...
          })
    parameters:
    - description: ClawArmor agent name.
      in: path
      name: agentName
      required: true
      schema:
        maxLength: 32
        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
        type: string
  /api/opencode/{agentName}/api/session:
    get:
      description: Retrieve sessions in the requested order. Items keep that order across pages; use cursor.next or cursor.previous to move through the ordered list.
      operationId: v2.session.list
      parameters:
      - in: query
        name: directory
        required: false
        schema:
          type: string
      - in: query
        name: workspace
