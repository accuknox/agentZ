version: "2"
sql:
- engine: postgresql
  queries: internal/session/db/query.sql
  schema: internal/session/db/schema.sql
  gen:
    go:
      package: sessiondb
      out: internal/session/db
      sql_package: pgx/v5
      emit_json_tags: true
      emit_interface: true
      emit_empty_slices: true
      overrides:
      - db_type: uuid
        go_type:
          import: github.com/google/uuid
          type: UUID
      - db_type: timestamptz
        go_type:
          import: time
          type: Time
      - db_type: jsonb
        go_type:
          slice: true
          type: byte
- engine: postgresql
  queries: internal/observer/db/query.sql
  schema:
  - internal/session/db/schema.sql
  - internal/observer/db/schema.sql
  gen:
    go:
      package: observerdb
      out: internal/observer/db
      sql_package: pgx/v5
      emit_json_tags: true
      emit_interface: true
      emit_empty_slices: true
      overrides:
      - db_type: uuid
        go_type:
          import: github.com/google/uuid
          type: UUID
      - db_type: timestamptz
        go_type:
          import: time
          type: Time
